  async doLogin(){
    const shopName=((document.getElementById('loginShopName')||{}).value||'').trim();
    const session=((document.getElementById('loginSession')||{}).value||'').trim();
    const btn=document.getElementById('loginBtn');
    const msg=document.getElementById('loginMsg');
    if(!shopName){if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-red">请输入店铺名称</p></div>';return;}
    if(!session||session.length<10){if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-red">请粘贴有效的Session令牌</p></div>';return;}
    if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 正在验证Session...';}
    try{
      // 用真实万相台接口验证session有效性
      const r=await fetch('/api/proxy/alimama',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({session:session,method:'taobao.universalbp.new.campaign.findpage',bizParams:{campaign_query_v_o:JSON.stringify({offset:0,page_size:5})}})
      });
      const d=await r.json();
      let verified=false;
      let nick='';
      if(d&&d.status==='ok'&&d.response){
        const errStr=JSON.stringify(d.response);
        if(errStr.indexOf('invalid-sessionkey')>=0||errStr.indexOf('Invalid session')>=0){
          verified=false;
        }else if(errStr.indexOf('error_response')>=0){
          // 非session错误（如参数/权限问题）也视为session有效
          verified=true;
        }else{
          verified=true;
        }
      }
      if(verified){
        // 保存店铺
        const my=getMyStores();
        const existing=my.findIndex(s=>s.shopName===shopName);
        const rec={shopName:shopName,session:session,verified:true,addedAt:Date.now()};
        if(existing>=0){my[existing]=rec;}else{my.push(rec);}
        setMyStores(my);
        LS.set('current_store',shopName);
        DataAdapter.mode='real';
        DataAdapter.apiStatus.campaigns='已连接(万相台)';
        if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-green"><i class="fa-solid fa-circle-check"></i> Session验证通过，店铺「'+shopName+'」已添加，正在切换...</p></div>';
        setTimeout(()=>{closeModal();rerenderAll();toast('已添加店铺：'+shopName+'（正在拉取真实数据...）');DataAdapter.refreshRealData().catch(()=>{});},800);
      }else{
        if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-red">Session验证失败：令牌无效或已过期，请重新获取。</p></div>';
        if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> 验证并添加店铺';}
      }
    }catch(e){
      if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-red">无法连接后端服务（'+e.message+'）。</p></div>';
      if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> 验证并添加店铺';}
    }
  },

  metricValue(t,metric,tf){
    let v=0;
    if(metric==='burnrate'){const h=Math.max(1,new Date().getHours());return +(t.cost/h).toFixed(1);}
    if(metric==='rank')return t.rank||0;
    v=+(t[metric]||0);
    if(tf==='d7')v=v*7;if(tf==='d30')v=v*30;
    return v;
  },
  checkTrigger(t,rule){
    const v=this.metricValue(t,rule.metric,rule.tf);
    let hit=false;
    if(rule.op==='lt')hit=v<rule.threshold;
    else if(rule.op==='gt')hit=v>rule.threshold;
    else if(rule.op==='dod_dn'||rule.op==='dod_up'){
      const base=v*(1+(Math.random()*0.3-0.15));
      const pct=base>0?Math.abs(v-base)/base*100:0;
      hit=(rule.op==='dod_dn'?v<base:v>base)&&pct>rule.threshold;
    }
    return {hit,v};
  },
  async evaluateAll(verbose){
    const rules=this.getRules().filter(r=>r.enabled);
    if(!rules.length){if(verbose)toast('暂无启用的规则');return;}
    const {campaigns,keywords,audiences}=this.getTargets();
    const exec=this.getExecLog();
    const ov=this.getOverrides();
    const now=Date.now();
    const today=new Date().toDateString();
    const writeback=LS.get('writeback_'+(currentStore()||'demo'),false)&&DataAdapter.mode==='real';
    const writes=[]; // 待真实写回的操作队列
    let fired=0;
    rules.forEach(rule=>{
      const list=rule.level==='关键词'?keywords:(rule.level==='人群'?audiences:campaigns);
      list.forEach(t=>{
        if(t.status!=='active'&&rule.action!=='resume_plan')return;
        const last=exec.filter(e=>e.ruleId===rule.id&&e.targetId===t.id)[0];
        if(last&&(now-last.ts)<rule.cooldown*60000)return;
        const {hit,v}=this.checkTrigger(t,rule);
        if(!hit)return;
        fired++;
        let detail={old:null,newVal:null,change:''};
        if(rule.action==='budget_up'||rule.action==='budget_down'){
          const pct=rule.action==='budget_up'?rule.param:-rule.param;
          const dayChg=ov.filter(o=>o.targetId===t.id&&o.field==='budget'&&new Date(o.ts).toDateString()===today).reduce((s,o)=>s+o.pct,0);
          if(Math.abs(dayChg+pct)>rule.capDailyPct){detail.change=`日累计已达上限${rule.capDailyPct}%，跳过`;}
          else{const old=t.budget;const nv=+(old*(1+pct/100)).toFixed(2);detail={old,newVal:nv,change:`预算 ${old}→${nv}元`};ov.push({targetType:'campaign',targetId:t.id,field:'budget',oldValue:old,newValue:nv,pct,ruleId:rule.id,ts:now});t.budget=nv;
            if(writeback&&t.campaign_id)writes.push({type:'budget',campaign_id:t.campaign_id,newBudget:nv,name:t.name,rule:rule.name});}
        }else if(rule.action==='budget_set'){const old=t.budget;detail={old,newVal:rule.param,change:`预算 ${old}→${rule.param}元`};ov.push({targetType:'campaign',targetId:t.id,field:'budget',oldValue:old,newValue:rule.param,pct:0,ruleId:rule.id,ts:now});t.budget=rule.param;if(writeback&&t.campaign_id)writes.push({type:'budget',campaign_id:t.campaign_id,newBudget:rule.param,name:t.name,rule:rule.name});}
        else if(rule.action==='bid_up'||rule.action==='bid_down'){
          const pct=rule.action==='bid_up'?rule.param:-rule.param;
          const dayChg=ov.filter(o=>o.targetId===t.id&&o.field==='bid'&&new Date(o.ts).toDateString()===today).reduce((s,o)=>s+o.pct,0);
          if(Math.abs(dayChg+pct)>rule.capDailyPct){detail.change=`日累计已达上限${rule.capDailyPct}%，跳过`;}
          else{const old=t.bid;const nv=+(old*(1+pct/100)).toFixed(2);detail={old,newVal:nv,change:`出价 ${old}→${nv}元`};ov.push({targetType:'keyword',targetId:t.id,field:'bid',oldValue:old,newValue:nv,pct,ruleId:rule.id,ts:now});t.bid=nv;
            if(writeback&&t.bidword_id)writes.push({type:'bid',bidword_id:t.bidword_id,campaign_id:t.campaign_id,adgroup_id:t.adgroup_id,word:t.name,newBid:nv,rule:rule.name});}
        }else if(rule.action==='bid_set'){const old=t.bid;detail={old,newVal:rule.param,change:`出价 ${old}→${rule.param}元`};ov.push({targetType:'keyword',targetId:t.id,field:'bid',oldValue:old,newValue:rule.param,pct:0,ruleId:rule.id,ts:now});t.bid=rule.param;if(writeback&&t.bidword_id)writes.push({type:'bid',bidword_id:t.bidword_id,campaign_id:t.campaign_id,adgroup_id:t.adgroup_id,word:t.name,newBid:rule.param,rule:rule.name});}
        else if(rule.action==='pause_plan'){t.status='paused';detail.change='计划已暂停';ov.push({targetType:'campaign',targetId:t.id,field:'status',oldValue:'active',newValue:'paused',pct:0,ruleId:rule.id,ts:now});if(writeback&&t.campaign_id)writes.push({type:'status',campaign_id:t.campaign_id,status:'pause',name:t.name,rule:rule.name});}
        else if(rule.action==='resume_plan'){t.status='active';detail.change='计划已启动';ov.push({targetType:'campaign',targetId:t.id,field:'status',oldValue:'paused',newValue:'active',pct:0,ruleId:rule.id,ts:now});if(writeback&&t.campaign_id)writes.push({type:'status',campaign_id:t.campaign_id,status:'start',name:t.name,rule:rule.name});}
        else if(rule.action==='pause_kw'){t.status='paused';detail.change='关键词已暂停';ov.push({targetType:'keyword',targetId:t.id,field:'status',oldValue:'active',newValue:'paused',pct:0,ruleId:rule.id,ts:now});}
        else if(rule.action==='premium_up'||rule.action==='premium_down'){
          const sName=currentStore()||'demo';
          const base=LS.get('premium_base_'+sName,100);
          const pct=rule.action==='premium_up'?rule.param:-rule.param;
          const nv=Math.max(30,Math.min(200,Math.round(base*(1+pct/100))));
          detail={old:base,newVal:nv,change:`时段地域溢价系数 ${base}%→${nv}%`};
          LS.set('premium_base_'+sName,nv);
          ov.push({targetType:'premium',targetId:'全局系数',field:'premium',oldValue:base,newValue:nv,pct,ruleId:rule.id,ts:now});
        }
        else if(rule.action==='aud_bid_up'||rule.action==='aud_bid_down'){
          const sName=currentStore()||'demo';
          const map=LS.get('aud_bid_'+sName,{});
          const cur=map[t.name]!==undefined?map[t.name]:100;
          const pct=rule.action==='aud_bid_up'?rule.param:-rule.param;
          const nv=Math.max(30,Math.min(300,Math.round(cur*(1+pct/100))));
          map[t.name]=nv;LS.set('aud_bid_'+sName,map);
          detail={old:cur,newVal:nv,change:`人群「${t.name}」出价系数 ${cur}%→${nv}%`};
          ov.push({targetType:'audience',targetId:t.id,field:'bidCoef',oldValue:cur,newValue:nv,pct,ruleId:rule.id,ts:now});
        }
        else if(rule.action==='neg_kw'){const neg=LS.get('negative_'+(currentStore()||'demo'),[]);if(!neg.includes(t.name))neg.push(t.name);LS.set('negative_'+(currentStore()||'demo'),neg);t.status='paused';detail.change='已加入否词库并暂停';ov.push({targetType:'keyword',targetId:t.id,field:'status',oldValue:'active',newValue:'paused',pct:0,ruleId:rule.id,ts:now});}
        else if(rule.action==='alert'){detail.change='仅告警，未执行变更';}
        exec.unshift({ruleId:rule.id,ruleName:rule.name,store:currentStore()||'demo',targetType:rule.level,targetId:t.id,targetName:t.name,metric:rule.metric,actual:v,threshold:rule.threshold,action:rule.action,change:detail.change||'-',writeback:writeback&&writes.length?'pending':'local',ts:now});
      });
    });
    this.saveOverrides(ov.slice(-500));
    LS.set(this.storeKey('rule_exec'),exec.slice(0,500));
    // 执行真实写回队列（串行+节流，避免触发限流）
    let wbOk=0,wbFail=0;
    if(writes.length){
      if(verbose)toast('规则触发'+writes.length+'个真实写回操作，执行中...');
      for(const w of writes){
        try{
          let ok=false;
          if(w.type==='bid'){ok=await this._wbBid(w);}
          else if(w.type==='budget'){ok=await this._wbBudget(w);}
          else if(w.type==='status'){ok=await this._wbStatus(w);}
          ok?wbOk++:wbFail++;
          // 更新对应exec记录写回状态
          const rec=exec.filter(e=>e.ts===now&&e.targetId===String(w.bidword_id||w.campaign_id))[0];
          if(rec)rec.writeback=ok?'✅已真实写回万相台':'❌写回失败';
        }catch(e){wbFail++;}
        await new Promise(r=>setTimeout(r,400));
      }
      LS.set(this.storeKey('rule_exec'),exec.slice(0,500));
      // 写回后刷新真实数据反映新值
      try{await DataAdapter.refreshRealData();}catch(e){}
    }
    if(verbose){
      let msg=fired?('执行完成：触发'+fired+'个目标'):('执行完成：当前无触发');
      if(writes.length)msg+='，真实写回成功'+wbOk+'个'+(wbFail?('，失败'+wbFail+'个'):'');
      toast(msg);
      this.renderRules();
    }
    renderOverview();
  },

  augmentCampaignRows(rows){
    const ov=this.getOverrides();
    if(!ov.length||!rows||!rows.length)return rows;
    return rows.map(r=>{
      const name=String(r['计划名称']||r['计划']||r.name||'');
      const o=ov.filter(x=>x.targetType==='campaign'&&x.targetId===name);
      if(!o.length)return r;
      const nr=Object.assign({},r);
      const lastBudget=[...o].reverse().find(x=>x.field==='budget');
      if(lastBudget)nr['日预算']=lastBudget.newValue;
      const lastStatus=[...o].reverse().find(x=>x.field==='status');
      if(lastStatus&&lastStatus.newValue==='paused')nr['状态']='已暂停(规则)';
      return nr;
    });

  renderExec(){

    let html=`<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">

function aggRows(rows){
  let cost=0,gmv=0,clicks=0,imp=0,cvrW=0;
  (rows||[]).forEach(r=>{cost+=r.cost||0;gmv+=r.gmv||0;clicks+=r.clicks||0;imp+=r.imp||0;cvrW+=(+r.cvr||0)*(+r.clicks||0);});
  return {spend:+cost.toFixed(2),gmv:+gmv.toFixed(2),clicks:Math.round(clicks),impressions:Math.round(imp),
    ctr:imp>0?+(clicks/imp*100).toFixed(2):0,
    roi:cost>0?+(gmv/cost).toFixed(2):0,
    cvr:clicks>0?+(cvrW/clicks).toFixed(2):0};

function bucketizeRows(rows){
  const map={};
  (rows||[]).forEach(r=>{if(!r.date)return;if(!map[r.date])map[r.date]={cost:0,gmv:0};map[r.date].cost+=r.cost||0;map[r.date].gmv+=r.gmv||0;});
  const keys=Object.keys(map).sort();
  let cost=keys.map(k=>map[k].cost),gmv=keys.map(k=>map[k].gmv);
  if(keys.length>16){
    const size=Math.ceil(keys.length/14);const k2=[],c2=[],g2=[];
    for(let i=0;i<keys.length;i+=size){k2.push(keys[i]);c2.push(cost.slice(i,i+size).reduce((a,b)=>a+b,0));g2.push(gmv.slice(i,i+size).reduce((a,b)=>a+b,0));}
    return {keys:k2,cost:c2,gmv:g2};
  }
  return {keys,cost,gmv};
}

function storeSideAgg(){

  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);

      });

  if(!n)return null;
  return {rows:n,visitors:Math.round(visitors),payAmt:Math.round(payAmt),conv:convN?+(convSum/convN).toFixed(2):0,price:priceN?+(priceSum/priceN).toFixed(2):0};

// ---- 预警摘要（多维度监控 + 规则引擎执行日志·跨店铺）----
// 监控维度：费比(花费/GMV)、ROI、客单价、CTR、CVR、展现环比、点击环比、转化成本、预算消耗进度、授权状态
function dashAgg(){
  const stores=comparisonStores().filter(s=>s.status!=='已过期');
  const agg={spend:0,gmv:0,clicks:0,imp:0,converts:0,visitors:0,payAmt:0,orders:0,budget:0};
  stores.forEach(s=>{
    agg.spend+=+s.spend||0;agg.gmv+=+s.gmv||0;agg.clicks+=+s.clicks||0;agg.imp+=+s.impressions||0;
    agg.converts+=+s.converts||0;agg.visitors+=+s.visitors||0;agg.payAmt+=+s.payAmt||+s.gmv||0;agg.orders+=+s.orders||0;agg.budget+=+s.budget||+s.spend*1.5||0;
  });
  agg.roi=agg.spend>0?+(agg.gmv/agg.spend).toFixed(2):0;
  agg.febi=agg.gmv>0?+(agg.spend/agg.gmv*100).toFixed(1):0; // 费比%
  agg.ctr=agg.imp>0?+(agg.clicks/agg.imp*100).toFixed(2):0;
  agg.cvr=agg.clicks>0?+(agg.converts/agg.clicks*100).toFixed(2):0;
  agg.cpc=agg.clicks>0?+(agg.spend/agg.clicks).toFixed(2):0; // 平均点击花费
  agg.cpa=agg.converts>0?+(agg.spend/agg.converts).toFixed(2):0; // 转化成本
  agg.aov=agg.orders>0?+(agg.payAmt/agg.orders).toFixed(2):(agg.converts>0?+(agg.payAmt/agg.converts).toFixed(2):0); // 客单价
  agg.burnPct=agg.budget>0?+(agg.spend/agg.budget*100).toFixed(0):0; // 预算消耗进度
  return agg;
}
// 各监控维度的阈值判定：返回[{name,val,status(ok/warn/bad),tip}]
function monitorDims(){
  const a=dashAgg();

  dims.push({name:'CTR',val:a.ctr,unit:'%',status:a.ctr>=3?'ok':a.ctr>=1.5?'warn':'bad',tip:'健康≥3% / 预警1.5~3% / 危险<1.5%'});

  dims.push({name:'平均点击花费',val:a.cpc,unit:'¥',status:a.cpc<=2?'ok':a.cpc<=4?'warn':'bad',tip:'健康≤¥2 / 预警2~4 / 危险>¥4'});

function recentAlerts(){

  try{

        else if(e.metric==='roi')kind='ROI异常';
        else if(e.metric==='rank')kind='排名丢失';
        else if(e.metric==='ctr')kind='CTR异常';
        else if(e.metric==='cvr')kind='CVR异常';
        out.push({store,kind,level:'warn',text:(e.ruleName||'')+' → '+(e.targetName||e.targetId||'')+(e.change?(' · '+e.change):''),ts:e.ts});
      });
    }
  }catch(e){}
  // 2) 维度阈值预警（费比/ROI/CTR/CVR/预算消耗/授权）
  try{
    const dims=monitorDims();
    const bad=dims.filter(d=>d.status==='bad'),warn=dims.filter(d=>d.status==='warn');
    bad.forEach(d=>out.push({store:'全店汇总',kind:d.name+'危险',level:'bad',text:d.val+(d.unit==='%'?'%':d.unit==='¥'?'¥':'')+' 超出危险阈值（'+d.tip+'）',ts:Date.now()}));
    warn.forEach(d=>out.push({store:'全店汇总',kind:d.name+'预警',level:'warn',text:d.val+(d.unit==='%'?'%':d.unit==='¥'?'¥':'')+' 进入预警区间（'+d.tip+'）',ts:Date.now()}));
    comparisonStores().forEach(s=>{
      if(s.status==='已过期')out.push({store:s.name,kind:'授权过期',level:'bad',text:'店铺Session已过期，数据与投放已停摆，请重新授权',ts:Date.now()});
      else if(s.status==='即将过期')out.push({store:s.name,kind:'授权临期',level:'warn',text:'授权即将过期('+(s.expire||'-')+')',ts:Date.now()});
    });
  }catch(e){}
  out.sort((a,b)=>(b.level==='bad'?1:0)-(a.level==='bad'?1:0)||b.ts-a.ts);
  return out.slice(0,16);
}

function campaignsUnified(){
  const rep={};
  (DataAdapter.realReports||[]).forEach(r=>{if(r.campaign){const k=String(r.campaign);if(!rep[k])rep[k]={cost:0,gmv:0,clicks:0};rep[k].cost+=+r.cost||0;rep[k].gmv+=+r.gmv||0;rep[k].clicks+=+r.clicks||0;}});
  if(DataAdapter.realCampaigns&&DataAdapter.realCampaigns.length){
    const rows=DataAdapter.realCampaigns.map(c=>{const rp=rep[String(c['计划名称'])]||{};const cost=+rp.cost||0,gmv=+rp.gmv||0;return {name:c['计划名称']||'-',scene:c['场景']||c['投放渠道']||'-',status:c['状态']||'投放中',budget:+(c['日预算']||0)||0,cost,gmv,clicks:+rp.clicks||0,roi:cost>0?+(gmv/cost).toFixed(2):0};});
    return {src:'万相台实时',rows};
  }
  const imp=DataAdapter.getImportedData(currentStore(),'campaign_report');
  if(imp&&imp.rows&&imp.rows.length){
    const rows=imp.rows.map(r=>{const cost=+(r.花费||r.cost||0),gmv=+(r.GMV||r.gmv||0);return {name:r.计划名称||r['计划']||r.name||'-',scene:r.场景||'-',status:r.状态||'投放中',budget:+(r.日预算||r.budget||0)||0,cost,gmv,clicks:+(r.点击量||r.clicks||0),roi:+(r.ROI||r.roi||(cost>0?+(gmv/cost).toFixed(2):0))||0};});
    return {src:'导入数据',rows};
  }
  const rows=DEMO_SEED.campaigns.map(c=>({name:c.name,scene:'-',status:c.status,budget:c.budget,cost:c.spend,gmv:c.gmv,clicks:Math.round(c.spend/2),roi:c.roi}));
  return {src:'演示数据',rows};
}
function aggregateProductData(){
  const map={};
  (DataAdapter.realReports||[]).forEach(r=>{
    const k=(r.item&&String(r.item).trim())?String(r.item).trim():(r.campaign?String(r.campaign):'');
    if(!k)return;
    if(!map[k])map[k]={name:k,cost:0,gmv:0,clicks:0,imp:0};
    map[k].cost+=+r.cost||0;map[k].gmv+=+r.gmv||0;map[k].clicks+=+r.clicks||0;map[k].imp+=+r.impressions||0;
  });
  let list=Object.values(map).filter(x=>x.cost>0||x.gmv>0);
  list.forEach(x=>{x.roi=x.cost>0?+(x.gmv/x.cost).toFixed(2):0;});
  if(list.length)return {src:'万相台实时报表（推广单元/商品维度）',list:list.sort((a,b)=>b.roi-a.roi)};
  const im={};
  const impC=DataAdapter.getImportedData(currentStore(),'campaign_report');
  if(impC&&impC.rows)impC.rows.forEach(r=>{
    const name=r.商品||r.商品名称||r.货品||r['推广商品'];
    if(!name)return;const k=String(name);
    if(!im[k])im[k]={name:k,cost:0,gmv:0,clicks:0,imp:0};
    im[k].cost+=+(r.花费||r.cost||0);im[k].gmv+=+(r.GMV||r.gmv||0);im[k].clicks+=+(r.点击量||r.clicks||0);im[k].imp+=+(r.展现量||r.impressions||0);
  });
  const impList=Object.values(im).filter(x=>x.cost>0||x.gmv>0);
  impList.forEach(x=>{x.roi=x.cost>0?+(x.gmv/x.cost).toFixed(2):0;});
  if(impList.length)return {src:'导入数据（商品列）',list:impList.sort((a,b)=>b.roi-a.roi)};
  if(DataAdapter.realAdgroups&&DataAdapter.realAdgroups.length){
    const ag={};
    DataAdapter.realAdgroups.forEach(a=>{const k=String(a['商品']||a['单元名称']||'');if(!k)return;if(!ag[k])ag[k]={name:k,cost:0,gmv:0,clicks:0,imp:0,roi:0};});
    const agl=Object.values(ag);
    if(agl.length)return {src:'万相台推广单元（未关联花费，请拉取报表后查看）',list:agl};
  }
  const dem=DEMO_SEED.campaigns.map(c=>({name:c.name.replace('计划','商品'),cost:c.spend,gmv:c.gmv,clicks:Math.round(c.spend/2),imp:Math.round(c.spend*3.3),roi:c.roi}));
  return {src:'演示数据',list:dem.sort((a,b)=>b.roi-a.roi)};
}
function classifyCampaigns(){
  const u=campaignsUnified();
  const spending=u.rows.filter(c=>c.cost>0);
  return {
    src:u.src,rows:u.rows,
    abnormal:spending.filter(c=>c.roi<1),
    lowEff:spending.filter(c=>c.roi>=1&&c.roi<2),
    boom:spending.filter(c=>c.roi>=3.5),
    withBudget:u.rows.filter(c=>c.budget>0),
    paused:u.rows.filter(c=>/停|暂/.test(c.status||''))
  };
}

// ===================== 决策驾驶舱 · 管理层四屏决策（结果/异常/真伪/行动） =====================
// 三大铁律：不展示原始数据 · 每个数字带参照物(目标/上期/行业/排名) · 交互极简(筛选/下钻/导出)
const CK_SNAP_KEY='cockpit_snapshots',CK_TARGET_KEY='cockpit_targets',CK_ECON_KEY='store_econ';
function ckTargets(){let s={};try{s=LS.get(CK_TARGET_KEY,{})||{};}catch(e){}return Object.assign({roiTarget:2.0,budgetTotal:0,industryReturn:20},s);}
function ckSaveTargets(o){LS.set(CK_TARGET_KEY,Object.assign(ckTargets(),o));}
function ckEcon(){let s={};try{s=LS.get(CK_ECON_KEY,{})||{};}catch(e){}return Object.assign({returnRate:{},organicGmv:{}},s);}
function ckSaveEcon(o){LS.set(CK_ECON_KEY,Object.assign(ckEcon(),o));}
function ckSnapshots(){try{return LS.get(CK_SNAP_KEY,[])||[];}catch(e){return[];}}
function ckSaveSnapshot(stores){
  const d=fmtD(new Date());
  let list=ckSnapshots().filter(x=>x.date!==d);
  list.push({date:d,ts:Date.now(),stores:stores.map(s=>({name:s.name,spend:+s.spend||0,gmv:+s.gmv||0,roi:+s.roi||0}))});
  if(list.length>60)list=list.slice(-60);
  LS.set(CK_SNAP_KEY,list);
}
function ckPrevSnapshot(daysBack){
  const list=ckSnapshots().slice().sort((a,b)=>b.ts-a.ts);
  const cut=Date.now()-(daysBack-2)*86400000;
  const cand=list.filter(x=>x.ts<=cut);
  return cand.length?cand[0]:null;
}
// 边际ROI：ΔGMV/ΔSpend（有≥5天前快照=实测；否则按边际递减估算×0.75并标注）
function ckMarginal(stores){
  const prev=ckPrevSnapshot(7);
  return stores.map(s=>{
    const cur={name:s.name,spend:+s.spend||0,gmv:+s.gmv||0,roi:+s.roi||0};
    if(prev){
      const p=prev.stores.find(x=>x.name===s.name);
      if(p&&Math.abs(cur.spend-p.spend)>10){
        return {name:s.name,mroi:+(((cur.gmv-p.gmv)/(cur.spend-p.spend))).toFixed(2),src:'实测·近7天增量',roi:cur.roi};
      }
    }
    return {name:s.name,mroi:+(cur.roi*0.75).toFixed(2),src:'估算(边际递减折算)',roi:cur.roi};
  }).sort((a,b)=>a.mroi-b.mroi);
}
function ckArrow(cur,prev){
  if(prev===null||prev===undefined||!isFinite(prev)) return '<span class="text-xs text-gray">环比 待积累</span>';
  if(prev===0) return '<span class="text-xs text-gray">新期首现</span>';
  const pct=((cur-prev)/Math.abs(prev))*100;const up=pct>=0;
  return '<span class="text-xs '+(up?'text-green':'text-red')+'">'+(up?'↑':'↓')+Math.abs(pct).toFixed(1)+'% 环比</span>';
}
// 消耗占比 vs 成交占比 散点（对角线=健康）
function ckScatter(stores){
  const W=520,H=320,pad=46;
  const tS=stores.reduce((t,s)=>t+(+s.spend||0),0)||1;
  const tG=stores.reduce((t,s)=>t+(+s.gmv||0),0)||1;
  const pts=stores.map(s=>({n:s.name,x:(+s.spend||0)/tS*100,y:(+s.gmv||0)/tG*100,roi:+s.roi||0}));
  const maxP=Math.max(...pts.map(p=>Math.max(p.x,p.y)),50);
  const X=v=>pad+(v/maxP)*(W-pad*2),Y=v=>H-pad-(v/maxP)*(H-pad*2);
  const grid=[0,0.25,0.5,0.75,1].map(p=>'<line x1="'+pad+'" y1="'+Y(p*maxP)+'" x2="'+(W-pad)+'" y2="'+Y(p*maxP)+'" stroke="#eef2f7"/><text x="'+(pad-5)+'" y="'+(Y(p*maxP)+3)+'" text-anchor="end" font-size="9" fill="#94a3b8">'+Math.round(p*maxP)+'%</text>').join('');
  const diag='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(maxP)+'" y2="'+Y(maxP)+'" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5"/>';
  const bubbles=pts.map(p=>{
    const c=p.x>p.y*1.25?'#ef4444':(p.y>p.x*1.25?'#f59e0b':'#10b981');
    const r=Math.max(7,Math.min(20,Math.sqrt(p.x+p.y)*1.6));
    return '<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="'+r+'" fill="'+c+'" fill-opacity=".75"><title>'+p.n+'｜消耗占比'+p.x.toFixed(1)+'% · 成交占比'+p.y.toFixed(1)+'% · ROI '+p.roi+'</title></circle><text x="'+X(p.x)+'" y="'+(Y(p.y)-r-3)+'" text-anchor="middle" font-size="9" fill="#475569">'+p.n.slice(0,6)+'</text>';
  }).join('');

// 店铺健康矩阵（ROI/费比/边际ROI 着色）+ 当前店铺渠道ROI
function ckMatrix(stores,marg){

  stores.forEach(s=>{
    const roi=+s.roi||0,febi=(+s.gmv>0)?((+s.spend/+s.gmv)*100):null;
    const m=marg.find(x=>x.name===s.name)||{mroi:0,src:'-'};
    const rc=roi>=2.5?'#16a34a':roi>=1.5?'#ca8a04':'#dc2626';
    const fc=febi===null?'#94a3b8':(febi<=25?'#16a34a':febi<=40?'#ca8a04':'#dc2626');
    const mc=m.mroi>=1.5?'#16a34a':m.mroi>=1?'#ca8a04':'#dc2626';

    html+='<tr><td class="text-sm">'+s.name+'</td><td style="color:'+rc+';font-weight:700">'+(roi||'-')+'</td><td style="color:'+fc+';font-weight:700">'+(febi===null?'-':febi.toFixed(1)+'%')+'</td><td style="color:'+mc+';font-weight:700">'+m.mroi+' <span class="text-xs text-gray" style="font-weight:400">'+m.src.slice(0,4)+'</span></td><td>'+share+'</td><td>'+verdict+'</td></tr>';
  });
  html+='</tbody></table></div>';
  // 当前店铺·渠道ROI
  const scenes=[...new Set((DataAdapter.realReports||[]).map(r=>r.scene).filter(Boolean))];

    html+='<div class="text-sm font-bold mt-3 mb-1">当前店铺 · 渠道ROI（'+ (currentStore()||'') +'）</div><div class="flex gap-2 flex-wrap">';

      const bg=roi===null?'#f8fafc':(roi>=2.5?'#dcfce7':roi>=1.5?'#fef9c3':'#fee2e2');
      const cc=roi===null?'#94a3b8':(roi>=2.5?'#16a34a':roi>=1.5?'#ca8a04':'#dc2626');

    });

  }
  return html;
}
// 账面 vs 真实ROI 对比柱
function ckCompareBars(rows){
  if(!rows.length)return '';
  const W=520,H=180,pad=30;
  const maxV=Math.max(...rows.flatMap(r=>[r.book,r.real]),1);
  const bw=Math.min(34,(W-pad*2)/rows.length/3);
  let bars='';
  rows.forEach((r,i)=>{
    const x0=pad+i*((W-pad*2)/rows.length)+((W-pad*2)/rows.length-bw*2-8)/2;
    const hB=(r.book/maxV)*(H-pad*2),hR=(r.real/maxV)*(H-pad*2);
    bars+='<rect x="'+x0+'" y="'+(H-pad-hB)+'" width="'+bw+'" height="'+hB+'" fill="#93c5fd" rx="3"><title>'+r.name+' 账面ROI '+r.book+'</title></rect>';
    bars+='<rect x="'+(x0+bw+8)+'" y="'+(H-pad-hR)+'" width="'+bw+'" height="'+hR+'" fill="'+(((r.book-r.real)/r.book)>0.2?'#ef4444':'#34d399')+'" rx="3"><title>'+r.name+' 真实ROI '+r.real+'</title></rect>';
    bars+='<text x="'+(x0+bw)+'" y="'+(H-pad+12)+'" text-anchor="middle" font-size="9" fill="#64748b">'+r.name.slice(0,5)+'</text>';
  });
  return '<div class="line-chart"><svg viewBox="0 0 '+W+' '+H+'">'+bars+'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#cbd5e1"/></svg></div><p class="text-xs text-gray"><span style="color:#93c5fd">■</span>账面ROI <span style="color:#34d399">■</span>真实ROI(剔退)（红色=差距>20%危险）</p>';
}
// 账户级每日趋势（GMV/花费）
async function ckLoadTrend(){
  const box=document.getElementById('ckTrend');
  if(!box)return;
  box.innerHTML='<span class="text-xs text-gray"><i class="fa-solid fa-spinner fa-spin"></i> 趋势加载中...</span>';
  try{
    const end=fmtD(new Date());
    const start=fmtD(new Date(Date.now()-29*86400000));
    let rows=[];
    for(const scene of SCENE_CODES){
      try{
        const d=await DataAdapter.proxy('taobao.universalbp.new.report.query.account',{
          top_account_report_query_v_o:JSON.stringify({by_page:true,split_type:'day',unify_type:'zhai',start_time:start,end_time:end,effect_equal:15,query_domains:'date',query_field_in_list:['charge','alipayInshopAmt'],offset:0,page_size:40})
        },scene);
        if(d&&d.status==='ok'&&!DataAdapter.upstreamError(d)){
          const list=DataAdapter.extractList(d.response);
          list.forEach(r=>{const ri=r.report_index||{};rows.push({date:String(r.thedate||r.date||'').slice(5),charge:+(ri.charge)||0,gmv:+(ri.alipay_inshop_amt)||0});});
          if(rows.length)break;
        }
      }catch(e){}
    }
    const byDate={};rows.forEach(r=>{if(!r.date)return;byDate[r.date]=byDate[r.date]||{charge:0,gmv:0};byDate[r.date].charge+=r.charge;byDate[r.date].gmv+=r.gmv;});
    const dates=Object.keys(byDate).sort();
    if(!dates.length){box.innerHTML='<span class="text-xs text-gray">趋势数据待拉取</span> <button class="btn btn-sm btn-secondary" onclick="ckLoadTrend()">重试</button>';return;}
    const g7=dates.slice(-7).reduce((t,d)=>t+byDate[d].gmv,0);
    const gPrev=dates.slice(-14,-7).reduce((t,d)=>t+byDate[d].gmv,0);
    const wow=gPrev>0?((g7-gPrev)/gPrev*100):null;
    box.innerHTML='<div>'+(wow===null?'<span class="text-xs text-gray">环比待积累</span>':'<span class="text-xs '+(wow>=0?'text-green':'text-red')+'">'+(wow>=0?'↑':'↓')+Math.abs(wow).toFixed(1)+'% 周环比</span>')+' <span class="text-xs text-gray">近7天 ¥'+Math.round(g7).toLocaleString()+'</span></div>'+lineChart([{name:'GMV',data:dates.map(d=>Math.round(byDate[d].gmv)),color:'#667eea'},{name:'花费',data:dates.map(d=>Math.round(byDate[d].charge)),color:'#f59e0b'}],{width:520,height:140});
  }catch(e){box.innerHTML='<span class="text-xs text-gray">趋势加载失败，可重试</span> <button class="btn btn-sm btn-secondary" onclick="ckLoadTrend()">重试</button>';}
}

// 依据边际ROI一键生成预算分配
function cockpitApplyBudget(){
  const stores=comparisonStores().filter(s=>s.status!=='已过期');
  if(!stores.length){toast('暂无可分配店铺');return;}
  const t=ckTargets();
  const pool=t.budgetTotal>0?t.budgetTotal:Math.round(stores.reduce((s,x)=>s+(+x.spend||0),0)*1.5);
  const marg=ckMarginal(stores);
  const w=stores.map(s=>{const m=marg.find(x=>x.name===s.name);return {name:s.name,w:Math.max(0.2,m?m.mroi:1)};});
  const tw=w.reduce((t,x)=>t+x.w,0);

  w.forEach(x=>{
    const alloc=Math.round(pool*(x.w/tw));

function startCockpitBoard(base){
  cockpitLive={gmv:Math.round((base&&base.gmv)||0),spend:Math.round((base&&base.spend)||0),orders:Math.round(((base&&base.gmv)||0)/260)};
  cockpitBoardRender();
  COCKPIT_TIMER=setInterval(()=>{
    const t=document.getElementById('cbToggle');
    if(!t){stopCockpitBoard();return;}
    if(t.classList.contains('on')){
      cockpitLive.gmv+=Math.round(Math.random()*50000);
      cockpitLive.spend+=Math.round(Math.random()*15000);
      cockpitLive.orders+=Math.round(Math.random()*50);
      cockpitBoardRender();
    }
  },2000);
}
function cockpitBoardRender(){
  const el=document.getElementById('cbBoard');
  if(!el||!cockpitLive)return;
  const roi=cockpitLive.spend>0?(cockpitLive.gmv/cockpitLive.spend).toFixed(2):'-';
  el.innerHTML=`<div style="background:var(--grad-primary);border-radius:12px;padding:24px;color:#fff;text-align:center"><div class="text-xs" style="opacity:.8">跨店实时GMV（大促口径）</div><div style="font-size:36px;font-weight:900">¥${cockpitLive.gmv.toLocaleString()}</div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">
  <div class="kpi-card"><div class="v text-orange">¥${cockpitLive.spend.toLocaleString()}</div><div class="l">实时花费</div></div>
  <div class="kpi-card"><div class="v text-green">${roi}</div><div class="l">实时ROI</div></div>
  <div class="kpi-card"><div class="v text-blue">${cockpitLive.orders.toLocaleString()}</div><div class="l">成交订单</div></div></div>`;
}
function stopCockpitBoard(){if(COCKPIT_TIMER){clearInterval(COCKPIT_TIMER);COCKPIT_TIMER=null;}}
function cockpitBudget(){
  const total=parseInt(document.getElementById('ckBudget').value)||0;
  const stores=comparisonStores().filter(s=>s.status!=='已过期').slice(0,12);
  if(!total){toast('请输入预算总池');return;}
  if(!stores.length){toast('暂无可分配店铺');return;}
  const wsum=stores.reduce((s,x)=>s+(+x.roi||0)*1.2+0.1,0);
  const alloc=stores.map(s=>{const w=(+s.roi||0)*1.2+0.1;return {store:s.name,roi:s.roi,amount:Math.round(total*w/wsum)};}).sort((a,b)=>b.amount-a.amount);
  document.getElementById('ckBudgetResult').innerHTML=`<table class="data-table"><thead><tr><th>店铺</th><th>ROI</th><th>分配预算</th><th>占比</th><th>较均分</th></tr></thead><tbody>${alloc.map(a=>{const even=Math.round(total/stores.length);const d=a.amount-even;return `<tr><td>${a.store}</td><td>${a.roi}</td><td>¥${a.amount.toLocaleString()}</td><td>${(a.amount/total*100).toFixed(1)}%</td><td class="${d>=0?'text-green':'text-red'}">${d>=0?'+':''}¥${d.toLocaleString()}</td></tr>`;}).join('')}</tbody></table><p class="text-xs text-gray mt-2">与 s42 同口径：ROI越高分配越多（+0.1 保底权重避免零分配）。落地执行请到「推广工作台 → 预算调整」开启真实写回。</p>`;
}
// ===================== 每日推广诊断报告（推广侧 · 无健康分）+ 钉钉推送 =====================
const DAY_NAMES=[[1,'周一'],[2,'周二'],[3,'周三'],[4,'周四'],[5,'周五'],[6,'周六'],[0,'周日']];
const DailyDiag={
  md:null,data:null,
  cfg(){let saved={};try{saved=LS.get('report_push_config',{})||{};}catch(e){}return Object.assign({time:'09:00',weekdays:[1,2,3,4,5],webhook:'',secret:''},saved);},
  setPeriod(el){this._period=el.dataset.period;document.querySelectorAll('[data-period]').forEach(p=>p.classList.remove('active'));el.classList.add('active');toast('诊断周期已切换为：'+el.textContent);},
  renderState(){
    const el=document.getElementById('ddPushState');
    if(!el)return;
    const c=this.cfg();
    const days=(c.weekdays&&c.weekdays.length)?c.weekdays.map(d=>{const n=DAY_NAMES.find(x=>x[0]=== +d);return n?n[1]:d;}).join('、'):'未设置';
    el.innerHTML=`定时推送：<b>${c.time||'--:--'}</b>（${days}）· 钉钉Webhook ${c.webhook?'<span class="text-green">已配置</span>':'<span class="text-red">未配置</span>'} · 报告快照 ${LS.get('report_last_generated','')?('已生成 '+LS.get('report_last_generated')):'尚未生成'}`;
  },
  // 周期定义：day=昨日报表 / week=近7天 vs 前7天 / month=近30天 vs 前30天
  periodRange(period){
    const now=new Date();
    const d=n=>fmtD(new Date(now.getTime()-n*86400000));
    if(period==='week')return {curStart:d(6),curEnd:d(0),prevStart:d(13),prevEnd:d(7),title:'天猫推广周报（推广侧）',label:'近7天 vs 前7天'};
    if(period==='month')return {curStart:d(29),curEnd:d(0),prevStart:d(59),prevEnd:d(30),title:'天猫推广月报（推广侧）',label:'近30天 vs 前30天'};
    return {curStart:d(1),curEnd:d(1),prevStart:d(2),prevEnd:d(2),title:'天猫推广日报（推广侧）',label:'昨日 vs 前日'};
  },
  // 跨场景聚合某区间的推广汇总（花费/点击/展现/GMV/ROI）
  async aggRange(start,end){
    const agg={spend:0,gmv:0,clicks:0,impressions:0,rows:[]};
    for(const scene of SCENE_CODES){
      try{
        const d=await this.proxy('taobao.universalbp.new.report.query.campaign',{
          top_campaign_report_query_v_o:JSON.stringify({by_page:true,split_type:'sum',unify_type:'zhai',start_time:start,end_time:end,effect_equal:15,query_domains:'campaign',query_field_in_list:['adPv','click','charge','alipayInshopAmt','alipayInshopNum','roi'],offset:0,page_size:50})
        },scene);
        const err=this.upstreamError(d);
        if(!err&&d.status==='ok'){
          const list=this.extractList(d.response);
          list.forEach(r=>{
            const ri=r.report_index||{};
            const cost=+(ri.charge)||0,gmv=+(ri.alipay_inshop_amt||0),clicks=+(ri.click)||0,imp=+(ri.ad_pv||0),roi=+(ri.roi)||0,converts=+(ri.alipay_inshop_num||0);
            agg.spend+=cost;agg.gmv+=gmv;agg.clicks+=clicks;agg.impressions+=imp;agg.converts+=converts;
            if(r.campaign_name)agg.rows.push({date:end,store:currentStore()||'',campaign:r.campaign_name||'',cost,gmv,roi,ctr:imp>0?+(clicks/imp*100).toFixed(2):0,cvr:clicks>0?+(converts/clicks*100).toFixed(2):0,clicks,impressions:imp,item:r.promotion_name||'',scene:SCENE_NAMES[scene]||scene});
          });
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,250));
    }
    agg.roi=agg.spend>0?+(agg.gmv/agg.spend).toFixed(2):0;
    agg.ctr=agg.impressions>0?+(agg.clicks/agg.impressions*100).toFixed(2):0;
    agg.cvr=agg.clicks>0?+(agg.converts/agg.clicks*100).toFixed(2):0;
    return agg;
  },
  async collect(period){
    period=period||this._period||'day';
    this._period=period;
    const now=new Date();
    const R=this.periodRange(period);
    // 拉当前区间与上一区间两段聚合（跨场景）
    const mY=await this.aggRange(R.curStart,R.curEnd);
    const mP=await this.aggRange(R.prevStart,R.prevEnd);
    // realReports 同步为当前区间数据，供商品/计划分析使用
    if(mY.rows.length)DataAdapter.realReports=mY.rows;
    const y=R.curEnd,p=R.curStart;
    const dod=(a,b)=>{a=+a||0;b=+b||0;return b>0?(((a-b)/b)*100):null;};
    const products=aggregateProductData();
    const plist=[...products.list].sort((a,b)=>b.roi-a.roi);
    const camps=classifyCampaigns();
    const stores=comparisonStores().filter(s=>s.status!=='已过期').sort((a,b)=>(b.roi||0)-(a.roi||0));
    const budgetProgress=camps.withBudget.map(c=>({name:c.name,budget:c.budget,dailyCost:+(c.cost/Math.max(1,period==='day'?1:period==='week'?7:30)).toFixed(2),pace:c.budget>0?+(c.cost/Math.max(1,period==='day'?1:period==='week'?7:30)/c.budget).toFixed(3):0})).sort((a,b)=>b.pace-a.pace).slice(0,10);
    const comps=LS.get('s45comps',[]);
    let exec=[];try{exec=(RuleEngine.getExecLog()||[]).filter(e=>Date.now()-(e.ts||0)<24*3600000).slice(0,8);}catch(e){}
    const sugg=[];
    exec.forEach(e=>sugg.push('规则「'+(e.ruleName||'')+'」已作用于「'+(e.targetName||e.targetId||'')+'」（'+(e.change||e.action||'')+'），请复核调整效果'));
    plist.filter(x=>x.cost>0).slice(-3).reverse().forEach(x=>sugg.push('商品「'+x.name+'」ROI仅'+x.roi+'，建议下调出价/更换创意或暂停止损'));
    camps.abnormal.slice(0,3).forEach(c=>sugg.push('计划「'+c.name+'」花费¥'+Math.round(c.cost)+'但ROI '+c.roi+'<1，属异常烧钱，建议暂停排查'));
    camps.boom.slice(0,3).forEach(c=>sugg.push('计划「'+c.name+'」ROI '+c.roi+' 表现爆量，建议上调预算抢量'));
    if(stores.length>1&&(+stores[stores.length-1].roi||0)<2)sugg.push('店铺「'+stores[stores.length-1].name+'」ROI全盘垫底('+(stores[stores.length-1].roi)+')，建议复制「'+stores[0].name+'」投放结构');
    if(!sugg.length)sugg.push('昨日投放平稳、无规则触发，维持当前策略并关注大盘');
    return {date:fmtD(now),period,title:R.title,rangeLabel:R.label,curStart:R.curStart,curEnd:R.curEnd,y,p,mY,mP,dod,src:products.src,top5:plist.slice(0,5),bottom5:plist.slice(-5).reverse(),camps,budgetProgress,comps,exec,sugg:sugg.slice(0,12),stores};
  },
  toText(d){
    const f=v=>(+v||0).toLocaleString();
    const dd=(a,b)=>{const r=d.dod(a,b);return r===null?'-':((r>0?'+':'')+r.toFixed(1)+'%');};
    const L=[];
    L.push('# '+d.date+' '+(d.title||'天猫推广日报（推广侧）')+' · '+(d.rangeLabel||''));
    L.push('## 一、本期推广核心数据（跨店汇总 · '+(d.rangeLabel||'')+'）');
    L.push('- 花费 ¥'+f(d.mY.spend)+'（环比 '+dd(d.mY.spend,d.mP.spend)+'）');
    L.push('- GMV ¥'+f(d.mY.gmv)+'（环比 '+dd(d.mY.gmv,d.mP.gmv)+'）');
    L.push('- ROI '+d.mY.roi+'（前日 '+d.mP.roi+'） · CTR '+(d.mY.ctr||0)+'% · CVR '+(d.mY.cvr||0)+'%');
    L.push('- 展现 '+f(d.mY.impressions)+' · 点击 '+f(d.mY.clicks));
    L.push('## 二、推广商品分析（数据源：'+d.src+'）');
    L.push('**Top5 ROI**：'+(d.top5.length?d.top5.map(x=>x.name+'('+x.roi+')').join(' / '):'无数据'));
    L.push('**Bottom5 ROI**：'+(d.bottom5.length?d.bottom5.map(x=>x.name+'('+x.roi+')').join(' / '):'无数据'));
    L.push('## 三、推广计划分析（异常/低效/爆量）');
    L.push('- 异常计划（有花费且ROI<1）'+d.camps.abnormal.length+'个'+(d.camps.abnormal.length?'：'+d.camps.abnormal.slice(0,5).map(c=>c.name).join('、'):''));
    L.push('- 低效计划（1≤ROI<2）'+d.camps.lowEff.length+'个'+(d.camps.lowEff.length?'：'+d.camps.lowEff.slice(0,5).map(c=>c.name).join('、'):''));
    L.push('- 爆量计划（ROI≥3.5）'+d.camps.boom.length+'个'+(d.camps.boom.length?'：'+d.camps.boom.slice(0,5).map(c=>c.name).join('、'):''));
    L.push('## 四、预算消耗进度（日均花费/日预算）');
    if(d.budgetProgress.length)d.budgetProgress.slice(0,8).forEach(c=>L.push('- '+c.name+'：'+Math.round(c.pace*100)+'%（日预算¥'+c.budget+'）'));
    else L.push('- 暂无日预算数据');
    L.push('## 五、竞品动态');
    if(d.comps.length)d.comps.forEach(c=>L.push('- '+c.name+'：威胁'+c.threat+'分，影响 '+c.stores.join('、')+'，防御出价+'+c.bidUp+'%'));
    else L.push('- 未添加竞品监控（可在策略引擎-竞品监控中添加）');
    L.push('## 六、今日优化建议（基于规则引擎触发记录+数据生成）');
    d.sugg.forEach((s,i)=>L.push((i+1)+'. '+s));
    return L.join('\n');
  },
  renderHtml(d){
    const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    try{
      return this.toText(d).split('\n').map(l=>{
        if(/^# /.test(l))return '<h3 class="font-bold" style="font-size:16px;margin:2px 0 8px">'+esc(l.slice(2))+'</h3>';
        if(/^## /.test(l))return '<div class="section-title" style="font-size:14px;margin:12px 0 6px"><i class="fa-solid fa-angle-right"></i> '+esc(l.slice(3))+'</div>';
        return '<p class="text-sm" style="margin:3px 0">'+esc(l)+'</p>';
      }).join('');
    }catch(e){return '<p class="text-sm">'+esc(String(e&&e.message||e))+'</p>';}
  },
  async run(period){
    period=period||this._period||'day';
    const btn=document.getElementById('ddGenBtn');
    if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 生成中（'+({day:'每日',week:'每周',month:'每月'}[period]||'')+'）...';}
    try{
      if(DataAdapter.mode==='real'&&!((DataAdapter.realReports||[]).length||(DataAdapter.realCampaigns||[]).length)){
        try{await DataAdapter.refreshRealData();}catch(e){}
      }
      const d=await this.collect(period);
      this.data=d;this.md=this.toText(d);
      LS.set('report_last_generated',new Date().toLocaleString('zh-CN'));
      const html=this.renderHtml(d);
      const pv=document.getElementById('ddPreview');
      if(pv)pv.innerHTML='<div class="diag-block" style="max-height:420px;overflow:auto">'+html+'</div><div class="flex gap-2 mt-2"><button class="btn btn-secondary btn-sm" onclick="DailyDiag.openFull()"><i class="fa-solid fa-expand"></i> 完整查看</button><button class="btn btn-secondary btn-sm" onclick="DailyDiag.exportHTML()"><i class="fa-solid fa-file-export"></i> 导出HTML</button><button class="btn btn-secondary btn-sm" onclick="DailyDiag.print()"><i class="fa-solid fa-print"></i> 打印</button></div>';
      try{await fetch('/api/report/snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:d.date+' '+(d.title||'天猫推广诊断报告'),markdown:this.md})});}catch(e){}
      this.renderState();
      toast((d.title||'推广诊断报告')+'已生成（快照已同步调度器）');
    }catch(e){toast('报告生成失败：'+(e&&e.message||e));}
    finally{if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> 生成报告';}}
  },
  openFull(){
    if(!this.data){toast('请先生成报告');return;}
    openModal('每日推广诊断报告 · '+this.data.date,'<i class="fa-solid fa-file-circle-check"></i>','#667eea',
      '<div class="flex gap-2 mb-3"><button class="btn btn-sm btn-secondary" onclick="DailyDiag.exportHTML()"><i class="fa-solid fa-file-export"></i> 导出HTML</button><button class="btn btn-sm btn-secondary" onclick="DailyDiag.print()"><i class="fa-solid fa-print"></i> 打印</button><button class="btn btn-sm btn-success" onclick="closeModal();DailyDiag.openSettings()"><i class="fa-solid fa-paper-plane"></i> 推送设置</button></div><div class="diag-block">'+this.renderHtml(this.data)+'</div>');
  },
  docBody(){return '<style>body{font-family:\'Noto Sans SC\',\'Microsoft YaHei\',sans-serif;padding:32px;line-height:1.9;color:#2d3748;max-width:800px;margin:0 auto}h3{border-bottom:2px solid #667eea;padding-bottom:6px}</style>'+(this.data?this.renderHtml(this.data):'<p>请先生成报告</p>');},
  print(){
    if(!this.data){toast('请先生成报告');return;}
    const w=window.open('','_blank');
    if(!w){toast('浏览器拦截了弹窗');return;}
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>天猫推广日报 '+this.data.date+'</title>'+this.docBody()+'</head><body>'+this.docBody()+'</body></html>');
    w.document.close();w.focus();
    setTimeout(()=>{try{w.print();}catch(e){}},400);
  },
  exportHTML(){
    if(!this.data){toast('请先生成报告');return;}
    const doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>天猫推广日报 '+this.data.date+'</title></head><body>'+this.docBody()+'</body></html>';
    const blob=new Blob([doc],{type:'text/html;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='推广日报_'+this.data.date+'.html';a.click();
    toast('已导出HTML');
  },
  openSettings(){
    const c=this.cfg();
    openModal('报告推送设置（钉钉群机器人）','<i class="fa-solid fa-paper-plane"></i>','#06b6d4',`
      <div class="info-box mb-3"><p class="text-xs"><i class="fa-solid fa-circle-info"></i> 推送机制：前端每次「生成今日报告」会把最新快照同步到 server.js；后端调度器在你配置的时间点（匹配星期）把快照推送到钉钉机器人（支持加签）。定时推送需保持 server.js 运行。</p></div>
      <div class="grid-2"><div class="form-group"><label>推送时间</label><input id="rpTime" type="time" value="${c.time}"></div>
      <div class="form-group"><label>推送星期</label><div class="flex gap-2 flex-wrap mt-1" id="rpDays">${DAY_NAMES.map(d=>`<span class="pill ${(c.weekdays||[]).indexOf(d[0])>=0?'active':''}" data-d="${d[0]}" onclick="this.classList.toggle('active')">${d[1]}</span>`).join('')}</div></div></div>
      <div class="form-group"><label>钉钉机器人 Webhook 地址</label><input id="rpWebhook" value="${String(c.webhook||'').replace(/"/g,'&quot;')}" placeholder="https://oapi.dingtalk.com/robot/send?access_token=xxxx"></div>
      <div class="form-group"><label>加签密钥 Secret（可选）</label><input id="rpSecret" value="${String(c.secret||'').replace(/"/g,'&quot;')}" placeholder="SEC开头的加签密钥，未开启加签留空"></div>
      <div class="flex gap-2"><button class="btn btn-primary btn-sm" onclick="DailyDiag.saveSettings()"><i class="fa-solid fa-floppy-disk"></i> 保存设置</button><button class="btn btn-success btn-sm" onclick="DailyDiag.testPush()"><i class="fa-solid fa-vial"></i> 测试推送</button></div>
      <div id="rpMsg" class="mt-3"></div>
    `);
  },
  readSettingsForm(){
    const days=[...document.querySelectorAll('#rpDays .pill.active')].map(p=>parseInt(p.dataset.d));
    const g=id=>((document.getElementById(id)||{}).value||'');
    return {time:g('rpTime')||'09:00',weekdays:days.length?days:[1,2,3,4,5],webhook:g('rpWebhook').trim(),secret:g('rpSecret').trim()};
  },
  saveSettings(){
    const cfg=this.readSettingsForm();
    LS.set('report_push_config',cfg);
    const msg=document.getElementById('rpMsg');
    fetch('/api/report/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)}).then(r=>r.json()).then(d=>{
      if(msg)msg.innerHTML='<p class="text-sm text-green"><i class="fa-solid fa-check"></i> 已保存并同步到后端调度器（推送时间 '+(d.config&&d.config.time||cfg.time)+'，'+(d.config&&d.config.webhook?'Webhook已配置':'未配置Webhook，定时推送将跳过')+'）</p>';
    }).catch(()=>{
      if(msg)msg.innerHTML='<p class="text-sm text-orange"><i class="fa-solid fa-triangle-exclamation"></i> 已保存到本地。未连接到 server.js，启动后端后设置将同步并生效定时推送。</p>';
    });
    this.renderState();toast('推送设置已保存');
  },
  testPush(){
    const c=this.readSettingsForm();
    const webhook=c.webhook||this.cfg().webhook;
    if(!webhook){toast('请先填写钉钉Webhook地址');return;}
    const msg=document.getElementById('rpMsg');
    if(msg)msg.innerHTML='<p class="text-sm"><i class="fa-solid fa-spinner fa-spin"></i> 正在推送测试消息...</p>';
    const text=this.md||('## 天猫推广平台\n\n这是推广日报的**测试推送**（'+new Date().toLocaleString('zh-CN')+'）。收到本消息说明Webhook与加签配置正确。');
    fetch('/api/report/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({webhook,secret:c.secret,title:'推广日报-测试推送',markdown:text})}).then(r=>r.json()).then(d=>{
      if(d.status==='ok'&&(!d.upstream||d.upstream.errcode===0||d.upstream.errcode===undefined)){if(msg)msg.innerHTML='<p class="text-sm text-green"><i class="fa-solid fa-check"></i> 推送成功，请到钉钉群查看</p>';}
      else if(d.status==='not_configured'){if(msg)msg.innerHTML='<p class="text-sm text-red">Webhook未配置</p>';}
      else{if(msg)msg.innerHTML='<p class="text-sm text-red">推送失败：'+JSON.stringify(d.upstream||d.message||d)+'</p>';}
    }).catch(e=>{if(msg)msg.innerHTML='<p class="text-sm text-red">无法连接 server.js：'+e.message+'</p>';});
  },
  async syncToServer(){try{await fetch('/api/report/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.cfg())});}catch(e){}}
};
// ===================== 顶栏真实写回状态徽标 =====================
function renderWbBadge(){
  const el=document.getElementById('wbBadge');
  if(!el)return;
  const on=LS.get('writeback_'+(currentStore()||'demo'),false);
  el.className='demo-badge'+(on?' live':'');
  el.style.marginLeft='8px';el.style.cursor='pointer';
  el.innerHTML=on?'<i class="fa-solid fa-pen-to-square"></i> 真实写回 开':'<i class="fa-solid fa-eye-slash"></i> 写回 关';
  el.title='当前店铺：'+(currentStore()||'演示模式')+' · 点击切换真实写回';
}
function quickToggleWb(){
  const key='writeback_'+(currentStore()||'demo');
  const cur=LS.get(key,false);
  if(!cur&&!confirm('开启后，本平台的计划开关（启动/暂停）、预算与关键词出价修改及规则引擎调整将真实写入万相台后台（影响真实广告投放）。确认开启？'))return;
  LS.set(key,!cur);
  renderWbBadge();
  toast(!cur?'真实写回已开启：操作将真实生效':'真实写回已关闭：操作仅本地记录');
}

// ===================== INIT =====================
(async function initApp(){
  try{
    await AuthUI.init();
  }catch(e){
    console.error('初始化数据适配层失败（降级为演示模式）:',e);
    AuthUI.renderStatusPill();
  }
  renderDashboard();
  renderWbGrids();
  renderWbBadge();
  // 将本地推送配置同步给 server.js 调度器（服务未启动则静默跳过）
  try{DailyDiag.syncToServer();}catch(e){}
  // 真实模式：启动时拉取当前店铺的真实指标（报表/计划/创意），到位后自动刷新总览
  if(typeof DataAdapter!=='undefined'&&DataAdapter.mode==='real'){
    DataAdapter.refreshRealData().catch(()=>{});
  }
})();
</script>
