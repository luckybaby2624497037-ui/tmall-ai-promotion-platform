<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天猫AI推广半自动化平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --grad-primary:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --c-primary:#667eea;
  --c-primary-dark:#5568d3;
  --c-secondary:#764ba2;
  --c-bg:#f5f6fa;
  --c-card:#ffffff;
  --c-text:#2d3748;
  --c-text-light:#718096;
  --c-border:#e2e8f0;
  --c-blue:#3b82f6;
  --c-green:#10b981;
  --c-orange:#f59e0b;
  --c-red:#ef4444;
  --c-purple:#8b5cf6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,.15);
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#f1f1f1;}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#a1a1a1;}

/* Top Navigation */
.topbar{background:var(--grad-primary);color:#fff;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:1000;box-shadow:var(--shadow-md);}
.topbar .logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.topbar .logo i{font-size:22px;}
.topbar .tabs{display:flex;gap:4px;}
.topbar .tab{padding:8px 20px;border-radius:8px;cursor:pointer;transition:.2s;font-size:14px;font-weight:500;opacity:.8;}
.topbar .tab:hover{opacity:1;background:rgba(255,255,255,.15);}
.topbar .tab.active{background:rgba(255,255,255,.2);opacity:1;font-weight:700;}
.topbar .search{flex:1;max-width:400px;margin-left:auto;position:relative;}
.topbar .search input{width:100%;padding:8px 12px 8px 36px;border:none;border-radius:20px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.2);color:#fff;}
.topbar .search input::placeholder{color:rgba(255,255,255,.6);}
.topbar .search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6);}
.topbar .search-results{position:absolute;top:48px;left:0;right:0;background:#fff;border-radius:8px;box-shadow:var(--shadow-lg);max-height:400px;overflow-y:auto;display:none;z-index:9999;}
.topbar .search-results.show{display:block;}
.topbar .search-results .item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--c-border);color:var(--c-text);}
.topbar .search-results .item:hover{background:var(--c-bg);}
.topbar .search-results .item .mod{font-size:11px;color:var(--c-text-light);}

/* Main Content */
.main{max-width:1400px;margin:0 auto;padding:24px;}

/* Tab panels */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Stat Cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px;transition:.2s;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.stat-card .icon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
.stat-card .num{font-size:28px;font-weight:900;}
.stat-card .label{font-size:13px;color:var(--c-text-light);}

/* Module Cards Grid */
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.module-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;border:2px solid transparent;text-align:center;}
.module-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow-md);transform:translateY(-3px);}
.module-card .icon{width:52px;height:52px;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;}
.module-card .name{font-size:14px;font-weight:700;margin-bottom:4px;}
.module-card .count{font-size:12px;color:var(--c-text-light);}
.module-card .desc{font-size:11px;color:var(--c-text-light);margin-top:6px;line-height:1.4;}

/* Accordion */
.accordion-item{background:var(--c-card);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.accordion-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s;}
.accordion-header:hover{background:var(--c-bg);}
.accordion-header .icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;}
.accordion-header .title{font-size:16px;font-weight:700;flex:1;}
.accordion-header .count{font-size:12px;color:var(--c-text-light);background:var(--c-bg);padding:2px 10px;border-radius:10px;}
.accordion-header .arrow{transition:.3s;color:var(--c-text-light);}
.accordion-item.open .accordion-header .arrow{transform:rotate(180deg);}
.accordion-body{display:none;padding:16px 20px 20px;}
.accordion-item.open .accordion-body{display:block;}

/* Skill Cards */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.skill-card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:.2s;display:flex;align-items:flex-start;gap:12px;}
.skill-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.skill-card .s-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0;}
.skill-card .s-info{flex:1;min-width:0;}
.skill-card .s-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.skill-card .s-desc{font-size:11px;color:var(--c-text-light);line-height:1.4;}
.skill-card .s-badge{font-size:10px;color:var(--c-green);background:var(--c-green-bg,#ecfdf5);padding:1px 6px;border-radius:4px;margin-top:4px;display:inline-block;}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:5000;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:900px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalIn .2s;}
@keyframes modalIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.modal-header{padding:16px 24px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.modal-header .m-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
.modal-header .m-title{font-size:17px;font-weight:700;flex:1;}
.modal-header .close{width:32px;height:32px;border:none;background:var(--c-bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--c-text-light);transition:.2s;}
.modal-header .close:hover{background:var(--c-red);color:#fff;}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1;}

/* Forms & Inputs */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--c-text);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;font-family:inherit;transition:.2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(102,126,234,.1);}
.form-group textarea{resize:vertical;min-height:80px;}
.form-row{display:flex;gap:12px;}
.form-row .form-group{flex:1;}

/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--grad-primary);color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-secondary{background:var(--c-bg);color:var(--c-text);}
.btn-secondary:hover{background:var(--c-border);}
.btn-danger{background:var(--c-red);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-success{background:var(--c-green);color:#fff;}
.btn-success:hover{opacity:.9;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{background:var(--c-bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--c-text-light);font-size:12px;white-space:nowrap;}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--c-border);}
.data-table tr:hover td{background:#fafbfc;}
.data-table .actions{display:flex;gap:6px;}

/* Badges */
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-gray{background:#f3f4f6;color:#374151;}
.badge-purple{background:#f3e8ff;color:#6b21a8;}

/* Toggle Switch */
.toggle{position:relative;width:40px;height:22px;background:#ccc;border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle.on{background:var(--c-green);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;}
.toggle.on::after{transform:translateX(18px);}

/* Progress Bars */
.progress{height:8px;background:var(--c-bg);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;border-radius:4px;transition:width .5s;}

/* Charts */
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:160px;padding:8px 0;}
.chart-bar .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.chart-bar .bar{width:60%;border-radius:4px 4px 0 0;transition:.3s;min-height:2px;position:relative;}
.chart-bar .bar:hover{opacity:.8;}
.chart-bar .bar-label{font-size:10px;color:var(--c-text-light);text-align:center;white-space:nowrap;}

.pie-chart{width:160px;height:160px;border-radius:50%;position:relative;margin:0 auto;}
.pie-chart::after{content:'';position:absolute;top:25%;left:25%;width:50%;height:50%;background:#fff;border-radius:50%;}

.line-chart{width:100%;height:160px;}
.line-chart svg{width:100%;height:100%;}

/* Heatmap */
.heatmap{display:grid;gap:2px;font-size:10px;}
.heatmap .hm-cell{padding:4px;text-align:center;border-radius:3px;cursor:pointer;transition:.2s;color:#fff;font-weight:600;}
.heatmap .hm-cell:hover{transform:scale(1.1);z-index:1;}

/* Tool Cards (Tab 3) */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.tool-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;border:2px solid transparent;}
.tool-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow-md);transform:translateY(-3px);}
.tool-card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-bottom:12px;}
.tool-card .name{font-size:15px;font-weight:700;margin-bottom:4px;}
.tool-card .desc{font-size:12px;color:var(--c-text-light);line-height:1.5;}

/* Section Title */
.section-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-title i{color:var(--c-primary);}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--c-text);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:9999;animation:toastIn .3s;font-size:14px;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* Tree */
.tree-node{padding-left:20px;}
.tree-item{padding:6px 10px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;transition:.2s;}
.tree-item:hover{background:var(--c-bg);}
.tree-item.active{background:rgba(102,126,234,.1);}
.tree-children{margin-left:16px;border-left:2px solid var(--c-border);padding-left:8px;}

/* Misc */
.flex{display:flex;}
.items-center{align-items:center;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.gap-4{gap:16px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mt-4{margin-top:16px;}
.mb-2{margin-bottom:8px;}
.mb-3{margin-bottom:12px;}
.mb-4{margin-bottom:16px;}
.text-sm{font-size:13px;}
.text-xs{font-size:12px;}
.text-green{color:var(--c-green);}
.text-red{color:var(--c-red);}
.text-orange{color:var(--c-orange);}
.text-blue{color:var(--c-blue);}
.text-gray{color:var(--c-text-light);}
.text-center{text-align:center;}
.font-bold{font-weight:700;}
.w-full{width:100%;}
.hidden{display:none!important;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.flex-wrap{flex-wrap:wrap;}
.justify-between{justify-content:space-between;}
.pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s;border:1px solid var(--c-border);}
.pill.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.pill:hover{border-color:var(--c-primary);}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:4px 0;}
.checkbox-item input{margin:0;}
.result-box{background:var(--c-bg);border-radius:8px;padding:14px;margin-top:12px;}
.kpi-card{background:var(--c-bg);border-radius:8px;padding:14px;text-align:center;}
.kpi-card .v{font-size:22px;font-weight:900;}
.kpi-card .l{font-size:11px;color:var(--c-text-light);}
.slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--c-border);outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--c-primary);cursor:pointer;}

/* Topbar Store Login */
.topbar-auth{display:flex;align-items:center;gap:10px;position:relative;margin-left:8px;white-space:nowrap;}
.auth-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.auth-btn:hover{background:rgba(255,255,255,.32);}
.demo-badge{background:#f59e0b;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.demo-badge.live{background:var(--c-green);}
.store-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:4px 12px 4px 4px;border-radius:18px;cursor:pointer;position:relative;color:#fff;font-size:13px;font-weight:600;transition:.2s;}
.store-chip:hover{background:rgba(255,255,255,.3);}
.store-chip .avatar{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
.chip-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);min-width:220px;z-index:10001;padding:6px 0;color:var(--c-text);}
.chip-dropdown.show{display:block;}
.chip-dropdown .dd-title{padding:6px 16px;font-size:11px;color:var(--c-text-light);font-weight:700;}
.chip-dropdown .dd-item{padding:8px 16px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--c-text);}
.chip-dropdown .dd-item:hover{background:var(--c-bg);}
.chip-dropdown .dd-item.active{color:var(--c-primary);font-weight:700;}
.chip-dropdown .dd-item.danger{color:var(--c-red);}
.chip-dropdown .dd-sep{height:1px;background:var(--c-border);margin:4px 0;}

/* Live badge on data panels */
.live-badge{font-size:10px;color:var(--c-green);background:#ecfdf5;border:1px solid #a7f3d0;padding:1px 6px;border-radius:4px;font-weight:700;display:inline-block;vertical-align:middle;}

/* Footer data source status pill */
.status-pill{position:fixed;bottom:16px;right:16px;z-index:4000;background:var(--c-text);color:#fff;padding:8px 16px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:6px;transition:.2s;}
.status-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.status-pill.live{background:var(--c-green);}
.src-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--c-border);font-size:13px;}
.src-row:last-child{border-bottom:none;}
.src-state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.src-ok{background:#dcfce7;color:#166534;}
.src-demo{background:#fef3c7;color:#92400e;}
.src-err{background:#fee2e2;color:#991b1b;}
.info-box{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:14px;}

@media(max-width:768px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .topbar{flex-wrap:wrap;height:auto;padding:12px;}
  .topbar .search{order:3;max-width:100%;margin:8px 0 0;}
  .topbar-auth{order:2;margin-left:auto;}
}
</style>
</head>
<body>
<!-- Top Navigation -->
<div class="topbar">
  <div class="logo"><i class="fa-solid fa-robot"></i> 天猫AI推广半自动化平台</div>
  <div class="tabs">
    <div class="tab active" data-tab="overview">平台总览</div>
    <div class="tab" data-tab="skills">板块与技能</div>
    <div class="tab" data-tab="tools">平台工具</div>
  </div>
  <div class="search">
    <i class="fa-solid fa-search"></i>
    <input type="text" id="globalSearch" placeholder="搜索技能或工具...">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="topbar-auth" id="topbarAuth"></div>
</div>

<div class="main">
<!-- TAB 1: Overview -->
<div class="tab-panel active" id="tab-overview">
  <div class="stat-grid" id="statGrid"></div>
  <div class="section-title"><i class="fa-solid fa-th-large"></i> 功能板块</div>
  <div class="module-grid" id="moduleGrid"></div>
</div>

<!-- TAB 2: Skills -->
<div class="tab-panel" id="tab-skills">
  <div class="section-title"><i class="fa-solid fa-layer-group"></i> 板块与技能</div>
  <div id="accordionContainer"></div>
</div>

<!-- TAB 3: Tools -->
<div class="tab-panel" id="tab-tools">
  <div class="section-title"><i class="fa-solid fa-toolbox"></i> 平台工具</div>
  <div class="tool-grid" id="toolGrid"></div>
</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="m-icon" id="modalIcon"><i class="fa-solid fa-cog"></i></div>
      <div class="m-title" id="modalTitle">标题</div>
      <button class="close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

// ===================== SEED DATA & UTILITIES =====================
const COLORS=['#667eea','#764ba2','#f59e0b','#10b981','#ef4444','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16'];
const STORE_SEED=[

const DataAdapter={
  mode:'demo', // 'demo' | 'real'
  currentUserId:null,
  realStores:null, // 真实模式下各店铺指标缓存
  apiStatus:{campaigns:'演示数据',reports:'演示数据',keywords:'演示数据',audiences:'演示数据',creatives:'演示数据',sycm:'演示数据'},
  // ---------- 店铺授权记录（localStorage: tmall_shops） ----------
  getShops(){try{return JSON.parse(localStorage.getItem('tmall_shops')||'[]');}catch(e){return[];}},
  saveShops(shops){try{localStorage.setItem('tmall_shops',JSON.stringify(shops));}catch(e){}},
  // ---------- 初始化：决定 demo/real ----------
  async init(){
    const shops=this.getShops();
    this.mode='demo';
    if(shops.length){
      try{
        const r=await fetch('/api/auth/status');
        const d=await r.json();
        if(d&&d.configured&&Array.isArray(d.stores)&&d.stores.length){
          const valid=shops.filter(s=>d.stores.some(t=>String(t.userId)===String(s.userId)));
          d.stores.forEach(t=>{
            if(!valid.some(v=>String(v.userId)===String(t.userId)))
              valid.push({userId:t.userId,shopName:t.shopName,nick:t.nick,expiresAt:t.expiresAt});
          });
          this.saveShops(valid);
          if(valid.length){
            this.mode='real';
            this.currentUserId=String(valid[0].userId);
          }
        }
      }catch(e){this.mode='demo';}
    }
    if(this.mode!=='real'){
      Object.keys(this.apiStatus).forEach(k=>this.apiStatus[k]='演示数据');
      this.realStores=null;
    }
    return this.mode;
  },
  // ---------- 通用API代理 ----------
  async proxy(method,params){
    const shops=this.getShops();
    const uid=this.currentUserId||(shops[0]&&shops[0].userId);
    const resp=await fetch('/api/proxy/alimama',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId:String(uid||''),method,params:params||{}})
    });
    return resp.json();
  },
  // 从上游响应中尽力提取列表数据
  extractList(resp){
    if(!resp||typeof resp!=='object')return[];
    let best=[];
    const scan=(o,depth)=>{
      if(!o||typeof o!=='object'||depth>4)return;
      if(Array.isArray(o)){if(o.length>best.length)best=o;return;}
      Object.values(o).forEach(v=>scan(v,depth+1));
    };
    scan(resp,0);
    return best;
  },
  upstreamError(d){
    if(d&&d.response&&d.response.error_response){
      const er=d.response.error_response;
      return er.sub_msg||er.msg||('上游错误code:'+er.code);
    }
    if(d&&d.status==='error')return d.message||'网关错误';
    if(d&&d.status==='not_configured')return '未配置appKey';
    return null;
  },
  async fetchCampaigns(){
    if(this.mode==='real'){
      try{
        const d=await this.proxy('alimama.zw.campaign.list',{page:1,size:50});
        const err=this.upstreamError(d);
        if(!err&&d.status==='ok'){
          this.apiStatus.campaigns='已连接';
          const list=this.extractList(d.response);
          if(list.length)return {live:true,data:list};
          return {live:true,data:DEMO_SEED.campaigns}; // 上游成功但无计划
        }
        this.apiStatus.campaigns=err||'未授权接口';
      }catch(e){this.apiStatus.campaigns='连接失败';}
      return {live:false,data:DEMO_SEED.campaigns};
    }
    this.apiStatus.campaigns='演示数据';
    return {live:false,data:DEMO_SEED.campaigns};
  },
  seedReports(){
    const stores=LS.get('stores',STORE_SEED).filter(s=>s.status!=='已过期');
    const rows=[];
    for(let i=6;i>=0;i--){
      const d=new Date(Date.now()-i*86400000);
      const ds=d.toISOString().slice(0,10);
      stores.slice(0,4).forEach(s=>{
        rows.push({date:ds,store:s.name,cost:Math.round(s.spend/7),gmv:Math.round(s.gmv/7),roi:s.roi,ctr:s.ctr,cvr:s.cvr,clicks:Math.round(s.spend/14),impressions:Math.round(s.spend/3)});
      });
    }
    return rows;
  },
  summarize(rows){
    const cost=rows.reduce((t,r)=>t+(+r.cost||0),0);
    const gmv=rows.reduce((t,r)=>t+(+r.gmv||0),0);
    const clicks=rows.reduce((t,r)=>t+(+r.clicks||0),0);
    const impressions=rows.reduce((t,r)=>t+(+r.impressions||0),0);
    return {spend:cost,gmv,roi:cost>0?+(gmv/cost).toFixed(2):0,ctr:impressions>0?+(clicks/impressions*100).toFixed(2):0,cvr:0,clicks,impressions};
  },
  async fetchReports(startDate,endDate){
    if(this.mode==='real'){
      try{
        const d=await this.proxy('alimama.report.campaign.get',{start_time:startDate||'',end_time:endDate||'',page:1,size:50});
        const err=this.upstreamError(d);
        if(!err&&d.status==='ok'){
          this.apiStatus.reports='已连接';
          const rows=this.extractList(d.response).map(r=>({
            date:r.date||r.log_date||'',store:r.campaign_name||r.store||'',
            cost:+(r.cost||r.charge||0),gmv:+(r.gmv||r.pay||0),
            roi:+(r.roi||0),ctr:+(r.ctr||0),cvr:+(r.cvr||0),
            clicks:+(r.click||r.clicks||0),impressions:+(r.impression||r.impressions||0)
          }));
          if(!rows.length)return {live:true,rows:[],summary:this.summarize([])};
          return {live:true,rows,summary:this.summarize(rows)};
        }
        this.apiStatus.reports=err||'未授权接口';
      }catch(e){this.apiStatus.reports='连接失败';}
      const rows=this.seedReports();
      return {live:false,rows,summary:this.summarize(rows)};
    }
    this.apiStatus.reports='演示数据';
    const rows=this.seedReports();
    return {live:false,rows,summary:this.summarize(rows)};
  },

  // 真实模式下按店铺拉取核心指标，供 getStores() 融合
  async refreshRealData(){

function getStores(){
  if(DataAdapter.mode==='real'){
    const shops=DataAdapter.getShops();
    if(shops.length){
      return shops.map(s=>{
        const name=s.shopName||s.nick||('店铺-'+s.userId);
        const live=(DataAdapter.realStores||[]).find(r=>r.name===name);
        return {
          name,
          status:(s.expiresAt&&s.expiresAt>Date.now())?'已授权':(s.expiresAt?'已过期':'已授权'),
          expire:s.expiresAt?new Date(s.expiresAt).toISOString().slice(0,10):'长期',
          quota:8000,quotaMax:10000,
          roi:live?live.roi:2.5,gmv:live?live.gmv:0,spend:live?live.spend:0,
          ctr:live?live.ctr:0,cvr:live?live.cvr:0,
          health:live&&live.roi>=2.5?90:75,
          real:true,userId:s.userId
        };
      });
    }
  }
  return LS.get('stores',STORE_SEED);
}

// CSV Export
function exportCSV(filename,rows){
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

// CSS Bar Chart
function barChart(data,opts={}){
  const max=Math.max(...data.map(d=>d.value),1);
  const h=opts.height||140;
  return `<div class="chart-bar" style="height:${h}px">${data.map((d,i)=>`<div class="bar-col"><div class="bar" style="height:${(d.value/max)*100}%;background:${d.color||COLORS[i%COLORS.length]}" title="${d.label}:${d.value}"></div><div class="bar-label">${d.label}</div></div>`).join('')}</div>`;
}
// Pie Chart with legend
function pieChart(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let acc=0;const segs=[];
  data.forEach((d,i)=>{const pct=(d.value/total)*100;segs.push(`${d.color||COLORS[i%COLORS.length]} ${acc}% ${acc+pct}%`);acc+=pct;});
  return `<div style="display:flex;gap:20px;align-items:center"><div class="pie-chart" style="background:conic-gradient(${segs.join(',')})"></div><div>${data.map((d,i)=>`<div style="display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px"><span style="width:12px;height:12px;border-radius:3px;background:${d.color||COLORS[i%COLORS.length]}"></span>${d.label}: ${d.value} (${((d.value/total)*100).toFixed(1)}%)</div>`).join('')}</div></div>`;
}
// SVG Line Chart
function lineChart(series,opts={}){
  const w=opts.width||500,h=opts.height||160,pad=30;
  const allVals=series.flatMap(s=>s.data);
  const max=Math.max(...allVals,1),min=Math.min(...allVals,0);
  const n=series[0].data.length;
  const pts=s=>s.data.map((v,i)=>`${pad+(i/(n-1))*(w-pad*2)},${h-pad-((v-min)/(max-min||1))*(h-pad*2)}`).join(' ');
  const grid=[0,0.25,0.5,0.75,1].map(p=>`<line x1="${pad}" y1="${h-pad-p*(h-pad*2)}" x2="${w-pad}" y2="${h-pad-p*(h-pad*2)}" stroke="#e2e8f0" stroke-width="1"/><text x="${pad-4}" y="${h-pad-p*(h-pad*2)+3}" text-anchor="end" font-size="9" fill="#718096">${Math.round(min+p*(max-min))}</text>`).join('');
  return `<div class="line-chart"><svg viewBox="0 0 ${w} ${h}">${grid}${series.map((s,i)=>`<polyline points="${pts(s)}" fill="none" stroke="${s.color||COLORS[i%COLORS.length]}" stroke-width="2"/>${s.data.map((v,j)=>`<circle cx="${pad+(j/(n-1))*(w-pad*2)}" cy="${h-pad-((v-min)/(max-min||1))*(h-pad*2)}" r="3" fill="${s.color||COLORS[i%COLORS.length]}"/>`).join('')}`).join('')}</svg></div>`;
}

function openSkill(modId,skillId){
  const mod=MODULES.find(m=>m.id===modId);
  const skill=mod.skills.find(s=>s.id===skillId);
  if(typeof window[skill.render]==='function'){
    window[skill.render](mod,skill);
  }else{
    openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,'<p>该技能渲染函数未找到。</p>');
  }
}

// ===================== TAB SWITCHING =====================
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

// ===================== GLOBAL SEARCH =====================
const searchInput=document.getElementById('globalSearch');
const searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){searchResults.classList.remove('show');return;}
  const results=[];
  MODULES.forEach(m=>m.skills.forEach(s=>{
    if(s.name.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q)||m.name.toLowerCase().includes(q))
      results.push({mod:m,skill:s});
  }));
  TOOLS.forEach(t=>{if(t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q))results.push({tool:t});});
  searchResults.innerHTML=results.slice(0,12).map(r=>{
    if(r.skill)return `<div class="item" onclick="switchTab('skills');openSkill('${r.mod.id}','${r.skill.id}');document.getElementById('globalSearch').value='';this.parentElement.classList.remove('show')"><div>${r.skill.name}</div><div class="mod">${r.mod.name}</div></div>`;
    return `<div class="item" onclick="switchTab('tools');openTool('${r.tool.id}');document.getElementById('globalSearch').value='';this.parentElement.classList.remove('show')"><div>${r.tool.name}</div><div class="mod">平台工具</div></div>`;
  }).join('');
  searchResults.classList.add('show');
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))searchResults.classList.remove('show');});

function s1SaveAdd(){const name=document.getElementById('s1Name').value.trim();if(!name){toast('请输入店铺名');return;}const stores=getStores();stores.push({name,status:'已授权',expire:document.getElementById('s1Expire').value,quota:Math.round(parseInt(document.getElementById('s1QuotaMax').value)*0.8),quotaMax:parseInt(document.getElementById('s1QuotaMax').value),roi:2.5,gmv:0,spend:0,ctr:0,cvr:0,health:70});saveStores(stores);document.getElementById('s1AddArea').innerHTML='';s1Render();toast('店铺已添加');}

function s2SelectAcc(si,ai){const data=LS.get('mapping',[]);const a=data[si].accounts[ai];document.getElementById('s2Detail').innerHTML=`<h4>${a.name}</h4><p class="text-sm mt-2">所属店铺：${data[si].name}</p><p class="text-sm">渠道：${a.channels.join('、')}</p><button class="btn btn-primary btn-sm mt-3" onclick="s2AddCh(${si},${ai})">+ 添加渠道</button>`;}

function s2AddRoot(){const name=prompt('请输入店铺名称');if(!name)return;const data=LS.get('mapping',[]);data.push({name,accounts:[]});LS.set('mapping',data);s2Render();toast('店铺节点已添加');}
function s2AddAcc(si){const name=prompt('请输入账户名称');if(!name)return;const data=LS.get('mapping',[]);data[si].accounts.push({name,channels:[]});LS.set('mapping',data);s2Render();s2Select(si);toast('账户已添加');}
function s2AddCh(si,ai){const name=prompt('请输入渠道名称');if(!name)return;const data=LS.get('mapping',[]);data[si].accounts[ai].channels.push(name);LS.set('mapping',data);s2Render();s2SelectAcc(si,ai);toast('渠道已添加');}

// ===== S3: 店铺分组管理 =====
function renderS3(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`
    <div class="flex gap-3 mb-3"><input id="s3NewGroup" placeholder="新分组名称" style="flex:1;padding:6px 12px;border:1px solid var(--c-border);border-radius:6px;font-size:13px"><button class="btn btn-primary btn-sm" onclick="s3AddGroup()">创建分组</button></div>
    <div id="s3Groups"></div>
  `,mb=>s3Render());
}
function s3Render(){
  const groups=getGroups();const stores=getStores();
  let html='<div class="grid-2">';
  groups.forEach((g,gi)=>{
    html+=`<div class="result-box"><div class="flex justify-between items-center mb-2"><h4>${g.name}</h4><button class="btn btn-sm btn-danger" onclick="s3DelGroup(${gi})">删除</button></div><div class="text-xs text-gray mb-2">${g.stores.length}家店铺</div>`;
    g.stores.forEach(sn=>{html+=`<div class="flex justify-between items-center" style="padding:4px 0"><span class="text-sm"><i class="fa-solid fa-store text-blue"></i> ${sn}</span><button class="btn btn-sm btn-secondary" onclick="s3Remove(${gi},'${sn}')">移出</button></div>`;});
    const unassigned=stores.filter(s=>!g.stores.includes(s.name));
    html+=`<select id="s3sel${gi}" style="width:100%;padding:4px;border:1px solid var(--c-border);border-radius:4px;margin-top:8px"><option value="">选择店铺加入...</option>${unassigned.map(s=>`<option value="${s.name}">${s.name}</option>`).join('')}</select><button class="btn btn-sm btn-primary mt-2" onclick="s3Add(${gi})">加入分组</button></div>`;
  });
  html+='</div>';
  document.getElementById('s3Groups').innerHTML=html;
}
function s3AddGroup(){const n=document.getElementById('s3NewGroup').value.trim();if(!n){toast('请输入分组名');return;}const g=getGroups();g.push({name:n,stores:[]});saveGroups(g);document.getElementById('s3NewGroup').value='';s3Render();toast('分组已创建');}
function s3DelGroup(gi){const g=getGroups();g.splice(gi,1);saveGroups(g);s3Render();toast('已删除');}
function s3Add(gi){const sel=document.getElementById('s3sel'+gi);if(!sel.value)return;const g=getGroups();g[gi].stores.push(sel.value);saveGroups(g);s3Render();toast('已加入');}
function s3Remove(gi,sn){const g=getGroups();g[gi].stores=g[gi].stores.filter(s=>s!==sn);saveGroups(g);s3Render();toast('已移出');}

// ===== S5: 店铺健康度巡检 =====
function renderS5(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`
    <div class="mb-3"><button class="btn btn-primary btn-sm" id="s5Btn" onclick="s5Patrol()"><i class="fa-solid fa-play"></i> 立即巡检</button></div>
    <div id="s5Grid" class="grid-3"></div><div id="s5Detail"></div>
  `,mb=>s5Render());
}
function s5Render(){const stores=getStores();document.getElementById('s5Grid').innerHTML=stores.map((s,i)=>{const h=s.health;const color=h>=80?'var(--c-green)':h>=60?'var(--c-orange)':'var(--c-red)';return `<div class="kpi-card" style="cursor:pointer;border:2px solid transparent" onclick="s5ShowDetail(${i})"><div style="font-size:28px;font-weight:900;color:${color}">${h}</div><div class="l">${s.name}</div><div class="progress mt-2"><div class="progress-bar" style="width:${h}%;background:${color}"></div></div></div>`;}).join('');}
function s5ShowDetail(i){const s=getStores()[i];const checks=[{name:'授权状态',ok:s.status!=='已过期',detail:s.status},{name:'API额度',ok:s.quota/s.quotaMax>0.3,detail:`${s.quota}/${s.quotaMax}`},{name:'违规记录',ok:s.health>70,detail:s.health>70?'无违规':'有违规风险'},{name:'商品状态',ok:s.health>60,detail:s.health>60?'正常':'部分异常'},{name:'ROI水平',ok:s.roi>=2.5,detail:`ROI=${s.roi}`},{name:'CTR表现',ok:s.ctr>=3.5,detail:`CTR=${s.ctr}%`}];document.getElementById('s5Detail').innerHTML=`<div class="result-box mt-3"><h4>${s.name} - 健康度详情</h4><table class="data-table mt-2"><thead><tr><th>检查项</th><th>状态</th><th>详情</th></tr></thead><tbody>${checks.map(c=>`<tr><td>${c.name}</td><td>${c.ok?'<span class="badge badge-green">正常</span>':'<span class="badge badge-red">异常</span>'}</td><td>${c.detail}</td></tr>`).join('')}</tbody></table></div>`;}
function s5Patrol(){const stores=getStores();let done=0;const btn=document.getElementById('s5Btn');btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 巡检中...';stores.forEach((s,i)=>{setTimeout(()=>{s.health=Math.max(20,Math.min(100,s.health+Math.round((Math.random()-0.4)*15)));done++;if(done===stores.length){saveStores(stores);s5Render();btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-play"></i> 立即巡检';toast('巡检完成');}},i*150);});}

function renderS6(mod,skill){

function s6Render(){const tasks=LS.get('s6tasks',[]);document.getElementById('s6Tasks').innerHTML=tasks.length?`<table class="data-table"><thead><tr><th>店铺</th><th>报表类型</th><th>进度</th><th>状态</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${t.store}</td><td>${t.type}</td><td><div class="progress" style="width:100px"><div class="progress-bar" style="width:${t.progress}%;background:${t.status==='失败'?'var(--c-red)':t.status==='完成'?'var(--c-green)':'var(--c-blue)'}"></div></div></td><td><span class="badge ${t.status==='完成'?'badge-green':t.status==='失败'?'badge-red':'badge-blue'}">${t.status}</span></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray text-sm">暂无任务，点击"启动拉取"开始</p>';}
function s6Start(){const store=document.getElementById('s6Store').value;const type=document.getElementById('s6Type').value;const tasks=LS.get('s6tasks',[]);const task={store,type,progress:0,status:'运行中'};tasks.push(task);LS.set('s6tasks',tasks);s6Render();const idx=tasks.length-1;const timer=setInterval(()=>{task.progress+=Math.random()*20+5;if(task.progress>=100){task.progress=100;task.status=Math.random()>0.1?'完成':'失败';clearInterval(timer);}tasks[idx]=task;LS.set('s6tasks',tasks);s6Render();},500);toast('拉取任务已启动');}

function renderS7(mod,skill){

function s7Init(){const stores=getStores().filter(s=>s.status!=='已过期');document.getElementById('s7Stores').innerHTML=stores.map((s,i)=>`<span class="pill active" data-idx="${i}" onclick="this.classList.toggle('active');s7Update()">${s.name}</span>`).join('');s7Update();}
function s7Update(){const stores=getStores().filter(s=>s.status!=='已过期');const active=[...document.querySelectorAll('#s7Stores .pill.active')].map(p=>stores[parseInt(p.dataset.idx)]);if(!active.length){document.getElementById('s7Dashboard').innerHTML='<p class="text-gray text-sm">请至少选择一个店铺</p>';return;}const tGMV=active.reduce((s,st)=>s+st.gmv,0);const tSpend=active.reduce((s,st)=>s+st.spend,0);const aROI=(tGMV/tSpend).toFixed(2);const aCTR=(active.reduce((s,st)=>s+st.ctr,0)/active.length).toFixed(2);document.getElementById('s7Dashboard').innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div class="kpi-card"><div class="v text-blue">${(tGMV/10000).toFixed(1)}万</div><div class="l">总GMV</div></div><div class="kpi-card"><div class="v text-orange">${(tSpend/10000).toFixed(1)}万</div><div class="l">总花费</div></div><div class="kpi-card"><div class="v text-green">${aROI}</div><div class="l">综合ROI</div></div><div class="kpi-card"><div class="v text-purple">${aCTR}%</div><div class="l">平均CTR</div></div></div><div class="mt-4"><h4 class="mb-2">GMV分布</h4>${barChart(active.map(s=>({label:s.name.slice(0,6),value:s.gmv})))}</div><div class="mt-4"><h4 class="mb-2">花费占比</h4>${pieChart(active.map(s=>({label:s.name.slice(0,6),value:s.spend})))}</div>`;}

// ===== S8: 店铺间横向对比报表 =====
function renderS8(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`
    <div class="mb-3"><label class="text-sm font-bold mb-2">选择店铺 (2+)：</label><div id="s8Stores" class="flex flex-wrap gap-2"></div></div>
    <div class="mb-3"><label class="text-sm font-bold mb-2">对比指标：</label><div id="s8Metrics" class="flex gap-2">${['ROI','CTR','CVR','花费','GMV'].map((m,i)=>`<span class="pill ${i===0?'active':''}" data-metric="${m}" onclick="s8Metric(this)">${m}</span>`).join('')}</div></div>
    <div id="s8Result"></div>
  `,mb=>s8Init());
}
function s8Init(){const stores=getStores().filter(s=>s.status!=='已过期');document.getElementById('s8Stores').innerHTML=stores.slice(0,6).map((s,i)=>`<span class="pill ${i<3?'active':''}" data-idx="${i}" onclick="this.classList.toggle('active');s8Update()">${s.name}</span>`).join('');s8Update();}
function s8Metric(el){[...el.parentElement.querySelectorAll('.pill')].forEach(p=>p.classList.remove('active'));el.classList.add('active');s8Update();}
function s8Update(){const stores=getStores().filter(s=>s.status!=='已过期');const active=[...document.querySelectorAll('#s8Stores .pill.active')].map(p=>stores[parseInt(p.dataset.idx)]);if(active.length<2){document.getElementById('s8Result').innerHTML='<p class="text-gray text-sm">请至少选择2个店铺</p>';return;}const metric=document.querySelector('#s8Metrics .pill.active')?.dataset.metric||'ROI';const vm={ROI:s=>s.roi,CTR:s=>s.ctr,CVR:s=>s.cvr,'花费':s=>s.spend,GMV:s=>s.gmv};const max=Math.max(...active.map(vm[metric]));const sorted=[...active].sort((a,b)=>vm[metric](b)-vm[metric](a));let html=`<table class="data-table"><thead><tr><th>店铺</th><th>${metric}</th><th>对比</th><th>排名</th></tr></thead><tbody>`;sorted.forEach((s,i)=>{const v=vm[metric](s);const pct=(v/max)*100;html+=`<tr><td>${s.name}</td><td><strong>${v}</strong></td><td><div class="progress" style="width:120px"><div class="progress-bar" style="width:${pct}%;background:${i===0?'var(--c-green)':i===sorted.length-1?'var(--c-red)':'var(--c-blue)'}"></div></div></td><td>${i===0?'<span class="badge badge-green">第1名</span>':'<span class="badge badge-gray">第'+(i+1)+'名</span>'}</td></tr>`;});html+=`</tbody></table><div class="result-box mt-3"><p class="text-sm"><i class="fa-solid fa-lightbulb text-orange"></i> <strong>分析：</strong>${sorted[0].name}在${metric}上最优(${vm[metric](sorted[0])})，${sorted[sorted.length-1].name}最差(${vm[metric](sorted[sorted.length-1])})。</p></div>`;document.getElementById('s8Result').innerHTML=html;}

// ===== S9: 自定义多维度报表 =====
function renderS9(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`
    <div class="grid-2 mb-3"><div><label class="text-sm font-bold mb-2">维度：</label>${['店铺','渠道','计划','日期'].map(d=>`<div class="checkbox-item"><input type="checkbox" class="s9dim" value="${d}" checked><span>${d}</span></div>`).join('')}</div><div><label class="text-sm font-bold mb-2">指标：</label>${['花费','GMV','ROI','CTR','CVR','点击','展现'].map(m=>`<div class="checkbox-item"><input type="checkbox" class="s9metric" value="${m}" ${['花费','GMV','ROI'].includes(m)?'checked':''}><span>${m}</span></div>`).join('')}</div></div>
    <button class="btn btn-primary btn-sm" onclick="s9Gen()"><i class="fa-solid fa-table"></i> 生成报表</button> <button class="btn btn-secondary btn-sm" onclick="s9Export()"><i class="fa-solid fa-download"></i> 导出CSV</button>
    <div id="s9Result" class="mt-3"></div>
  `,mb=>{});
}
function s9Gen(){const dims=[...document.querySelectorAll('.s9dim:checked')].map(c=>c.value);const metrics=[...document.querySelectorAll('.s9metric:checked')].map(c=>c.value);if(!dims.length||!metrics.length){toast('请选择维度和指标');return;}const stores=getStores().slice(0,6);const channels=['直通车','引力魔方','万相台'];let rows=[];stores.forEach(s=>{channels.forEach(ch=>{if(dims.includes('日期')){['2025-06-01','2025-06-02','2025-06-03'].forEach(d=>{rows.push(genRow9(s,ch,d,dims,metrics));});}else{rows.push(genRow9(s,ch,'',dims,metrics));}});});let html=`<table class="data-table"><thead><tr>${dims.map(d=>`<th>${d}</th>`).join('')}${metrics.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>`;html+=rows.map(r=>`<tr>${dims.map(d=>`<td>${r[d]}</td>`).join('')}${metrics.map(m=>`<td>${r[m]}</td>`).join('')}</tr>`).join('')+'</tbody></table>';document.getElementById('s9Result').innerHTML=html;LS.set('s9rows',{dims,metrics,rows});}
function genRow9(s,ch,d,dims,metrics){const row={};dims.forEach(dim=>{if(dim==='店铺')row[dim]=s.name;if(dim==='渠道')row[dim]=ch;if(dim==='计划')row[dim]=ch+'-计划'+Math.ceil(Math.random()*3);if(dim==='日期')row[dim]=d||'2025-06-01';});metrics.forEach(m=>{if(m==='花费')row[m]=Math.round(s.spend/3+Math.random()*5000);if(m==='GMV')row[m]=Math.round(s.gmv/3+Math.random()*15000);if(m==='ROI')row[m]=(s.roi+Math.random()-0.5).toFixed(2);if(m==='CTR')row[m]=(s.ctr+Math.random()-0.5).toFixed(2)+'%';if(m==='CVR')row[m]=(s.cvr+Math.random()-0.5).toFixed(2)+'%';if(m==='点击')row[m]=Math.round(5000+Math.random()*8000);if(m==='展现')row[m]=Math.round(80000+Math.random()*100000);});return row;}

function s11Calc(){const model=document.querySelector('#s11Models .pill.active')?.textContent||'首次点击';const path=document.getElementById('s11Path').value.split('→').map(s=>s.trim()).filter(s=>s);if(path.length<2){toast('请输入至少2个触点');return;}const stores=[...new Set(path)];const weights={};stores.forEach(s=>weights[s]=0);if(model==='首次点击')weights[path[0]]=100;else if(model==='末次点击')weights[path[path.length-1]]=100;else if(model==='线性')path.forEach(p=>weights[p]+=100/path.length);else if(model==='时间衰减'){const total=path.reduce((s,_,i)=>s+Math.pow(0.5,i),0);path.forEach((p,i)=>weights[p]+=(Math.pow(0.5,i)/total)*100);}const data=stores.map(s=>({label:s.slice(0,6),value:Math.round(weights[s])}));document.getElementById('s11Result').innerHTML=`<div class="result-box"><h4 class="mb-2">${model}归因结果</h4>${pieChart(data)}<table class="data-table mt-3"><thead><tr><th>店铺</th><th>ROI贡献(%)</th></tr></thead><tbody>${data.map(d=>`<tr><td>${d.label}</td><td>${d.value}%</td></tr>`).join('')}</tbody></table></div>`;}

  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="flex gap-3 mb-3 items-center"><div class="toggle on" id="s35Toggle" onclick="this.classList.toggle('on')"></div><span class="text-sm">实时监控</span></div><div id="s35List"></div>`,mb=>s35Init());
}
let s35Timer=null,s35Data={};
function s35Init(){const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);s35Data={};stores.forEach(s=>{s35Data[s.name]={spend:s.spend,budget:s.spend*1.5,rate:Math.round(Math.random()*500+200)};});s35Render();s35Timer=setInterval(()=>{if(document.getElementById('s35Toggle').classList.contains('on')){Object.keys(s35Data).forEach(k=>{s35Data[k].spend+=s35Data[k].rate/60;s35Data[k].rate+=Math.round((Math.random()-0.5)*50);});s35Render();}},2000);}
function s35Render(){document.getElementById('s35List').innerHTML=Object.entries(s35Data).map(([k,v])=>{const pct=Math.min(100,v.spend/v.budget*100);const over=pct>80;return `<div class="result-box mb-2"><div class="flex justify-between items-center"><strong>${k}</strong>${over?'<span class="badge badge-red"><i class="fa-solid fa-bell"></i> 超阈值</span>':'<span class="badge badge-green">正常</span>'}</div><div class="flex justify-between text-sm mt-1"><span>今日花费: ¥${Math.round(v.spend).toLocaleString()}</span><span>预算: ¥${Math.round(v.budget).toLocaleString()}</span></div><div class="progress mt-2"><div class="progress-bar" style="width:${pct}%;background:${over?'var(--c-red)':'var(--c-green)'}"></div></div><div class="text-xs text-gray mt-1">消耗速率: ¥${v.rate}/分钟</div></div>`;}).join('');}

// ===== S36: 多店铺ROI异常监控 =====
function renderS36(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="mb-3"><label class="text-sm font-bold mb-2">ROI告警阈值(降幅%)：</label><input id="s36Thresh" type="number" value="20" style="width:80px;padding:4px;border:1px solid var(--c-border);border-radius:4px">%<select id="s36Action" style="margin-left:12px;padding:4px;border:1px solid var(--c-border);border-radius:4px"><option>通知运营</option><option>自动暂停</option><option>自动调价</option></select></div><div id="s36List"></div>`,mb=>s36Render());
}
function s36Render(){const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);const thresh=parseInt(document.getElementById('s36Thresh')?.value||20);let html='<table class="data-table"><thead><tr><th>店铺</th><th>当前ROI</th><th>昨日ROI</th><th>降幅</th><th>趋势</th><th>状态</th></tr></thead><tbody>';stores.forEach(s=>{const yROI=s.roi;const cROI=s.roi*(1-(Math.random()*0.4-0.1));const drop=Math.round((yROI-cROI)/yROI*100);const flagged=drop>thresh;const trendData=Array.from({length:7},()=>cROI*(0.8+Math.random()*0.4));html+=`<tr><td>${s.name}</td><td>${cROI.toFixed(2)}</td><td>${yROI.toFixed(2)}</td><td class="${drop>0?'text-red':'text-green'}">${drop>0?'-':'+'}${Math.abs(drop)}%</td><td style="width:120px"><svg width="120" height="30"><polyline points="${trendData.map((v,i)=>`${i*18},${30-v/yROI*25}`).join(' ')}" fill="none" stroke="${flagged?'#ef4444':'#10b981'}" stroke-width="1.5"/></svg></td><td>${flagged?'<span class="badge badge-red"><i class="fa-solid fa-bell"></i> 异常</span>':'<span class="badge badge-green">正常</span>'}</td></tr>`;});html+='</tbody></table>';document.getElementById('s36List').innerHTML=html;}

// ===== S37: 跨店排名丢失监控 =====
function renderS37(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div id="s37List"></div>`,mb=>s37Render());
}
function s37Render(){const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);const kws=['补水面膜','美白精华','防晒霜','口红','粉底液'];let html='<table class="data-table"><thead><tr><th>店铺</th><th>关键词</th><th>目标排名</th><th>当前排名</th><th>变化</th><th>状态</th></tr></thead><tbody>';stores.forEach(s=>{kws.forEach(kw=>{const target=3;const rank=Math.ceil(Math.random()*15);const change=Math.round((Math.random()-0.5)*6);const lost=rank>target;html+=`<tr><td>${s.name}</td><td>${kw}</td><td>前${target}名</td><td>第${rank}名</td><td class="${change>0?'text-red':'text-green'}">${change>0?'↓':'↑'}${Math.abs(change)}</td><td>${lost?'<span class="badge badge-red">排名丢失</span>':'<span class="badge badge-green">达标</span>'}</td></tr>`;});});html+='</tbody></table>';document.getElementById('s37List').innerHTML=html;}

// ===== S38: 店铺异常巡检 =====
function renderS38(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="mb-3"><button class="btn btn-primary btn-sm" id="s38Btn" onclick="s38Run()"><i class="fa-solid fa-play"></i> 立即巡检</button></div><div id="s38List"></div>`,mb=>s38Render());
}
function s38Render(){const stores=getStores();const items=[{type:'违规处罚',sev:'高'},{type:'商品下架',sev:'中'},{type:'审核驳回',sev:'中'},{type:'计划异常',sev:'低'},{type:'资质过期',sev:'高'}];let html='<table class="data-table"><thead><tr><th>店铺</th><th>检查项</th><th>严重程度</th><th>状态</th></tr></thead><tbody>';stores.forEach(s=>{const hasIssue=s.health<70;const item=items[Math.floor(Math.random()*items.length)];if(hasIssue){html+=`<tr><td>${s.name}</td><td>${item.type}</td><td><span class="badge ${item.sev==='高'?'badge-red':item.sev==='中'?'badge-yellow':'badge-gray'}">${item.sev}</span></td><td><span class="badge badge-red">异常</span></td></tr>`;}else{html+=`<tr><td>${s.name}</td><td>全项检查</td><td>-</td><td><span class="badge badge-green">正常</span></td></tr>`;}});html+='</tbody></table>';document.getElementById('s38List').innerHTML=html;}
function s38Run(){const btn=document.getElementById('s38Btn');btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 巡检中...';setTimeout(()=>{s38Render();btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-play"></i> 立即巡检';toast('巡检完成');},1500);}

// ===== S39: 分级告警体系 =====
function renderS39(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div id="s39List"></div>`,mb=>s39Render());
}
function s39Render(){const alerts=LS.get('s39alerts',[{level:'L0',desc:'旗舰店-美妆官方 ROI突降30%',time:'2分钟前',status:'未处理',route:'运营'},{level:'L1',desc:'美妆品牌线 花费超预算80%',time:'5分钟前',status:'未处理',route:'组长'},{level:'L2',desc:'API额度即将耗尽(全局)',time:'10分钟前',status:'处理中',route:'总监'},{level:'L3',desc:'系统数据拉取服务异常',time:'15分钟前',status:'已处理',route:'管理员'},{level:'L0',desc:'专卖店-护肤优选 排名跌出前10',time:'20分钟前',status:'已处理',route:'运营'},{level:'L1',desc:'母婴品牌线 CTR低于行业均值',time:'30分钟前',status:'已处理',route:'组长'}]);const levelMap={L0:{badge:'badge-gray',route:'运营→该店运营'},L1:{badge:'badge-blue',route:'运营+组长'},L2:{badge:'badge-yellow',route:'组长+总监'},L3:{badge:'badge-red',route:'总监+管理员+短信'}};document.getElementById('s39List').innerHTML=alerts.map((a,i)=>{const lm=levelMap[a.level];return `<div class="result-box mb-2"><div class="flex justify-between items-center"><div><span class="badge ${lm.badge}">${a.level}</span> <span class="text-sm font-bold">${a.desc}</span></div><span class="text-xs text-gray">${a.time}</span></div><div class="flex justify-between items-center mt-2"><span class="text-xs text-gray">路由: ${lm.route}</span><div>${a.status==='未处理'?`<button class="btn btn-sm btn-success" onclick="s39Ack(${i})">确认</button> <button class="btn btn-sm btn-primary" onclick="s39Resolve(${i})">解决</button>`:`<span class="badge badge-green">${a.status}</span>`}</div></div></div>`;}).join('');}
function s39Ack(i){const alerts=LS.get('s39alerts',[]);alerts[i].status='处理中';LS.set('s39alerts',alerts);s39Render();toast('已确认');}
function s39Resolve(i){const alerts=LS.get('s39alerts',[]);alerts[i].status='已处理';LS.set('s39alerts',alerts);s39Render();toast('已解决');}

// ===== S40: 告警去重与聚合 =====
function renderS40(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="result-box mb-3"><div class="form-group"><label>聚合窗口(分钟)</label><input id="s40Window" type="number" value="5" style="width:80px;padding:6px;border:1px solid var(--c-border);border-radius:6px" oninput="s40Render()"></div></div><div class="grid-2"><div><h4 class="mb-2">原始告警 (12条)</h4><div id="s40Raw"></div></div><div><h4 class="mb-2">聚合后告警</h4><div id="s40Agg"></div></div></div>`,mb=>s40Render());
}
function s40Render(){const window=parseInt(document.getElementById('s40Window').value)||5;const raw=[{store:'美妆官方',msg:'ROI下降',t:1},{store:'美妆官方',msg:'ROI下降',t:2},{store:'美妆官方',msg:'ROI下降',t:3},{store:'个护品牌',msg:'花费超标',t:2},{store:'个护品牌',msg:'花费超标',t:4},{store:'美妆官方',msg:'ROI下降',t:6},{store:'家电官方',msg:'排名丢失',t:3},{store:'家电官方',msg:'排名丢失',t:5},{store:'母婴官方',msg:'CTR低',t:1},{store:'母婴官方',msg:'CTR低',t:7},{store:'数码优选',msg:'API额度低',t:4},{store:'数码优选',msg:'API额度低',t:5}];document.getElementById('s40Raw').innerHTML=raw.map(r=>`<div class="text-xs" style="padding:4px 0;border-bottom:1px solid var(--c-border)"><span class="badge badge-gray">${r.t}分</span> ${r.store} - ${r.msg}</div>`).join('');const groups={};raw.forEach(r=>{const key=r.store+'|'+r.msg;if(!groups[key])groups[key]={store:r.store,msg:r.msg,count:0,first:r.t,last:r.t};groups[key].count++;groups[key].last=Math.max(groups[key].last,r.t);});const aggregated=Object.values(groups).filter(g=>g.last-g.first<=window);const deduped=Object.values(groups);document.getElementById('s40Agg').innerHTML=deduped.map(g=>`<div class="result-box mb-2"><div class="flex justify-between"><span class="text-sm font-bold">${g.store} - ${g.msg}</span>${g.count>1?`<span class="badge badge-purple">聚合${g.count}条</span>`:'<span class="badge badge-gray">单条</span>'}</div><div class="text-xs text-gray mt-1">首次: ${g.first}分钟前 | 最后: ${g.last}分钟前</div></div>`).join('')+'<div class="result-box mt-2"><p class="text-sm text-green"><i class="fa-solid fa-check"></i> 去重率: '+Math.round((1-deduped.length/raw.length)*100)+'% ('+raw.length+'条→'+deduped.length+'条)</p></div>';}

// ===== S41: 策略配置层级 =====
function renderS41(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="mb-3"><button class="btn btn-primary btn-sm" onclick="s41Add()">+ 添加策略</button></div><div id="s41Tree"></div>`,mb=>s41Render());
}
function s41Render(){const data=LS.get('s41tree',[{name:'全局策略',level:0,children:[{name:'美妆品牌线策略',level:1,children:[{name:'旗舰店-美妆官方',level:2,override:'自定义ROI目标=3.5'},{name:'旗舰店-个护品牌',level:2,override:'继承分组'}]},{name:'家电数码线策略',level:1,children:[{name:'旗舰店-家电官方',level:2,override:'继承分组'}]}]}]);let html='';function renderNode(node,depth){const colors=['var(--c-primary)','var(--c-purple)','var(--c-blue)'];const bgs=['rgba(102,126,234,0.1)','rgba(139,92,246,0.08)','rgba(59,130,246,0.06)'];html+=`<div style="margin-left:${depth*24}px;padding:10px 14px;border-left:3px solid ${colors[node.level]};background:${bgs[node.level]};border-radius:0 8px 8px 0;margin-bottom:6px"><div class="flex justify-between items-center"><div><span class="badge ${node.level===0?'badge-purple':node.level===1?'badge-blue':'badge-green'}">${['全局','分组','单店'][node.level]}</span> <strong class="text-sm">${node.name}</strong></div>${node.override?`<span class="text-xs text-orange">${node.override}</span>`:''}</div></div>`;if(node.children)node.children.forEach(c=>renderNode(c,depth+1));}data.forEach(n=>renderNode(n,0));document.getElementById('s41Tree').innerHTML=html;LS.set('s41tree',data);}
function s41Add(){const name=prompt('策略名称');if(!name)return;const level=parseInt(prompt('层级(0=全局,1=分组,2=单店)','1'));const data=LS.get('s41tree',[]);if(level===0){data.push({name,level:0,children:[]});}else if(level===1&&data.length){data[0].children.push({name,level:1,children:[]});}else if(level===2&&data.length&&data[0].children.length){data[0].children[0].children.push({name,level:2,override:'继承分组'});}LS.set('s41tree',data);s41Render();toast('已添加');}

// ===== S42: 跨店智能预算分配 =====
function renderS42(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="result-box mb-3"><div class="form-group"><label>总预算池 (元)</label><input id="s42Budget" type="number" value="500000" style="padding:8px;border:1px solid var(--c-border);border-radius:6px"></div><button class="btn btn-primary btn-sm" onclick="s42Calc()"><i class="fa-solid fa-brain"></i> AI智能分配</button></div><div id="s42Result"></div>`,mb=>{});
}
function s42Calc(){const budget=parseInt(document.getElementById('s42Budget').value);const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);const totalROI=stores.reduce((s,st)=>s+st.roi,0);const totalGrowth=stores.reduce((s,st)=>s+st.roi*1.2,0);let before=[],after=[];const beforeTotal=budget;stores.forEach(s=>{const bShare=Math.round(budget/s.length);before.push({label:s.name.slice(0,6)+'(原)',value:bShare,color:'#94a3b8'});const aShare=Math.round(budget*(s.roi*1.2/totalGrowth));after.push({label:s.name.slice(0,6)+'(AI)',value:aShare,color:'var(--c-primary)'});});document.getElementById('s42Result').innerHTML=`<div class="grid-2"><div><h4 class="mb-2">原均分方案</h4>${pieChart(before)}</div><div><h4 class="mb-2">AI优化方案</h4>${pieChart(after)}</div></div><table class="data-table mt-3"><thead><tr><th>店铺</th><th>ROI</th><th>原分配</th><th>AI分配</th><th>变化</th></tr></thead><tbody>${stores.map((s,i)=>{const b=Math.round(budget/stores.length);const a=Math.round(budget*(s.roi*1.2/totalGrowth));const diff=a-b;return `<tr><td>${s.name}</td><td>${s.roi}</td><td>¥${b.toLocaleString()}</td><td>¥${a.toLocaleString()}</td><td class="${diff>0?'text-green':'text-red'}">${diff>0?'+':''}¥${diff.toLocaleString()}</td></tr>`;}).join('')}</tbody></table><div class="result-box mt-3"><p class="text-sm"><i class="fa-solid fa-lightbulb text-orange"></i> AI将更多预算分配给高ROI店铺，预计总GMV提升${Math.round(Math.random()*15+10)}%。</p></div>`;}

// ===== S43: 多目标优化 =====
function renderS43(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="result-box mb-3"><h4 class="mb-2">优化目标权重</h4>${['ROI','GMV','流量'].map((g,i)=>`<div class="form-group"><label>${g}权重: <span id="s43w${i}">${[40,35,25][i]}%</span></label><input type="range" class="slider" min="0" max="100" value="${[40,35,25][i]}" oninput="document.getElementById('s43w${i}').textContent=this.value+'%'" ${i===0?'id="s43roi"':''}></div>`).join('')}<button class="btn btn-primary btn-sm" onclick="s43Opt()"><i class="fa-solid fa-calculator"></i> 计算帕累托最优</button></div><div id="s43Result"></div>`,mb=>{});
}
function s43Opt(){const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);const w=[parseInt(document.getElementById('s43w0').textContent),parseInt(document.getElementById('s43w1').textContent),parseInt(document.getElementById('s43w2').textContent)];const total=w.reduce((a,b)=>a+b,0)||1;const scores=stores.map(s=>({label:s.name.slice(0,6),roi:s.roi,gmv:s.gmv,traffic:s.spend/100,score:(s.roi*w[0]+s.gmv/10000*w[1]+s.spend/100*w[2])/total}));scores.sort((a,b)=>b.score-a.score);document.getElementById('s43Result').innerHTML=`<h4 class="mb-2">帕累托最优分配</h4>${barChart(scores.map((s,i)=>({label:s.label,value:Math.round(s.score),color:COLORS[i%COLORS.length]})))}<table class="data-table mt-3"><thead><tr><th>店铺</th><th>ROI</th><th>GMV</th><th>流量</th><th>综合评分</th></tr></thead><tbody>${scores.map((s,i)=>`<tr><td>${s.label}</td><td>${s.roi}</td><td>¥${(s.gmv/10000).toFixed(1)}万</td><td>${Math.round(s.traffic)}</td><td><strong>${s.score.toFixed(2)}</strong> ${i===0?'<span class="badge badge-green">最优</span>':''}</td></tr>`).join('')}</tbody></table>`;}

// ===== S44: 投放节奏控制 =====
function renderS44(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="mb-3"><label class="text-sm font-bold mb-2">店铺：</label><div id="s44Tabs" class="flex flex-wrap gap-2"></div></div><div id="s44Timeline"></div>`,mb=>s44Init());
}
function s44Init(){const stores=getStores().filter(s=>s.status!=='已过期').slice(0,4);document.getElementById('s44Tabs').innerHTML=stores.map((s,i)=>`<span class="pill ${i===0?'active':''}" onclick="s44Tab(${i})" data-idx="${i}">${s.name.slice(0,8)}</span>`).join('');s44Tab(0);}
function s44Tab(i){document.querySelectorAll('#s44Tabs .pill').forEach((p,j)=>p.classList.toggle('active',j===i));const stores=getStores().filter(s=>s.status!=='已过期').slice(0,4);const store=stores[i];const phases=LS.get('s44_'+store.name,[{name:'预热',start:5,end:15,color:'#3b82f6',budget:20},{name:'爆发',start:15,end:20,color:'#ef4444',budget:50},{name:'余热',start:20,end:30,color:'#f59e0b',budget:30}]);let html='<div style="position:relative;height:200px;background:var(--c-bg);border-radius:8px;padding:20px">';html+='<div style="position:absolute;left:20px;right:20px;top:20px;bottom:40px;display:flex">';const total=30;phases.forEach((p,pi)=>{const left=p.start/total*100;const width=(p.end-p.start)/total*100;html+=`<div style="position:absolute;left:${left}%;width:${width}%;top:0;bottom:0;background:${p.color}22;border:2px solid ${p.color};border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer" onclick="s44Edit(${i},${pi})"><div style="font-weight:700;color:${p.color}">${p.name}</div><div class="text-xs text-gray">Day ${p.start}-${p.end}</div><div class="text-xs text-gray">预算${p.budget}%</div></div>`;});html+='</div>';html+='<div style="position:absolute;left:20px;right:20px;bottom:10px;display:flex;justify-content:space-between"><span class="text-xs text-gray">Day 1</span><span class="text-xs text-gray">Day 10</span><span class="text-xs text-gray">Day 20</span><span class="text-xs text-gray">Day 30</span></div>';html+='</div>';document.getElementById('s44Timeline').innerHTML=html;}
function s44Edit(si,pi){const stores=getStores().filter(s=>s.status!=='已过期').slice(0,4);const store=stores[si];const phases=LS.get('s44_'+store.name,[]);const p=phases[pi];const newEnd=parseInt(prompt(p.name+'阶段结束日期(1-30)',p.end));if(newEnd){phases[pi].end=newEnd;if(phases[pi+1])phases[pi+1].start=newEnd;LS.set('s44_'+store.name,phases);s44Tab(si);toast('已调整');}}

// ===== S46: 跨店AB测试框架 =====
function renderS46(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="result-box mb-3"><h4 class="mb-2">实验配置</h4><div class="grid-2"><div class="form-group"><label>测试店铺</label><input id="s46Test" value="旗舰店-美妆官方,专卖店-护肤优选" style="width:100%;padding:6px;border:1px solid var(--c-border);border-radius:6px"></div><div class="form-group"><label>对照店铺</label><input id="s46Ctrl" value="旗舰店-个护品牌,专营店-彩妆集合" style="width:100%;padding:6px;border:1px solid var(--c-border);border-radius:6px"></div></div><div class="form-group"><label>测试指标</label><select id="s46Metric" style="padding:6px;border:1px solid var(--c-border);border-radius:6px"><option>ROI</option><option>CTR</option><option>CVR</option><option>GMV</option></select></div><button class="btn btn-primary btn-sm" onclick="s46Calc()">计算显著性</button></div><div id="s46Result"></div>`,mb=>{});
}
function s46Calc(){const metric=document.getElementById('s46Metric').value;const testN=20000;const ctrlN=20000;const testRate=Math.random()*0.05+0.03;const ctrlRate=Math.random()*0.04+0.02;const testConv=Math.round(testN*testRate);const ctrlConv=Math.round(ctrlN*ctrlRate);const pooledRate=(testConv+ctrlConv)/(testN+ctrlN);const se=Math.sqrt(pooledRate*(1-pooledRate)*(1/testN+1/ctrlN));const z=(testRate-ctrlRate)/se;const significant=Math.abs(z)>1.96;const pValue=2*(1-normalCDF(Math.abs(z)));document.getElementById('s46Result').innerHTML=`<table class="data-table"><thead><tr><th>指标</th><th>测试组</th><th>对照组</th></tr></thead><tbody><tr><td>样本量</td><td>${testN.toLocaleString()}</td><td>${ctrlN.toLocaleString()}</td></tr><tr><td>${metric}</td><td>${(testRate*100).toFixed(2)}%</td><td>${(ctrlRate*100).toFixed(2)}%</td></tr><tr><td>转化数</td><td>${testConv.toLocaleString()}</td><td>${ctrlConv.toLocaleString()}</td></tr></tbody></table><div class="result-box mt-3"><div class="grid-3"><div class="kpi-card"><div class="v">${z.toFixed(2)}</div><div class="l">Z值</div></div><div class="kpi-card"><div class="v">${pValue.toFixed(4)}</div><div class="l">P值</div></div><div class="kpi-card"><div class="v ${significant?'text-green':'text-orange'}">${significant?'显著':'不显著'}</div><div class="l">结论(95%置信)</div></div></div><p class="text-sm mt-2">${significant?'<i class="fa-solid fa-check text-green"></i> 测试组'+metric+'显著'+(testRate>ctrlRate?'高于':'低于')+'对照组，建议'+(testRate>ctrlRate?'推广测试方案':'放弃测试方案')+'。':'<i class="fa-solid fa-clock text-orange"></i> 差异不显著，建议增加样本量或延长测试周期。'}</p></div>`;}
function normalCDF(x){return 0.5*(1+erf(x/Math.SQRT2));}
function erf(x){const t=1/(1+0.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y;}

function t2Calc(){

// ===== T3: A/B测试计算器 =====
function renderT3(tool){
  openModal(tool.name,`<i class="fa-solid ${tool.icon}"></i>`,tool.color,`
    <div class="grid-2 mb-3">
      <div class="result-box"><h4>A组</h4><div class="form-group"><label>展现量</label><input id="t3aImp" type="number" value="12000" oninput="t3Calc()"></div><div class="form-group"><label>点击量</label><input id="t3aClick" type="number" value="480" oninput="t3Calc()"></div></div>
      <div class="result-box"><h4>B组</h4><div class="form-group"><label>展现量</label><input id="t3bImp" type="number" value="12000" oninput="t3Calc()"></div><div class="form-group"><label>点击量</label><input id="t3bClick" type="number" value="612" oninput="t3Calc()"></div></div>
    </div>
    <div id="t3Result"></div>
  `,mb=>t3Calc());
}
function t3Calc(){
  const aImp=parseInt(document.getElementById('t3aImp').value)||0;
  const aClick=parseInt(document.getElementById('t3aClick').value)||0;
  const bImp=parseInt(document.getElementById('t3bImp').value)||0;
  const bClick=parseInt(document.getElementById('t3bClick').value)||0;
  const aCTR=aImp>0?aClick/aImp:0;const bCTR=bImp>0?bClick/bImp:0;
  const pooledCTR=(aClick+bClick)/(aImp+bImp)||0;
  const se=Math.sqrt(pooledCTR*(1-pooledCTR)*(1/(aImp||1)+1/(bImp||1)));
  const z=se>0?Math.abs(bCTR-aCTR)/se:0;
  const pValue=2*(1-normalCDF(z));
  const significant=z>1.96;
  document.getElementById('t3Result').innerHTML=`
    <table class="data-table"><thead><tr><th>指标</th><th>A组</th><th>B组</th></tr></thead><tbody>
    <tr><td>CTR</td><td><strong>${(aCTR*100).toFixed(2)}%</strong></td><td><strong>${(bCTR*100).toFixed(2)}%</strong></td></tr>
    <tr><td>点击量</td><td>${aClick}</td><td>${bClick}</td></tr>
    <tr><td>CTR差异</td><td colspan="2">${((bCTR-aCTR)*100).toFixed(2)}pp</td></tr>
    </tbody></table>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">
      <div class="kpi-card"><div class="v">${z.toFixed(2)}</div><div class="l">Z值</div></div>
      <div class="kpi-card"><div class="v">${pValue.toFixed(4)}</div><div class="l">P值</div></div>
      <div class="kpi-card"><div class="v ${significant?'text-green':'text-orange'}">${significant?'显著':'不显著'}</div><div class="l">95%置信</div></div>
    </div>
    <div class="result-box mt-3"><p class="text-sm">${significant?`<i class="fa-solid fa-check text-green"></i> 差异显著！${bCTR>aCTR?'B组':'A组'}CTR更高，建议采用。`:`<i class="fa-solid fa-clock text-orange"></i> 差异不显著(P=${pValue.toFixed(4)}>0.05)，建议增加样本量。`}</p></div>`;
}

function t7Calc(){
  const roi=parseFloat(document.getElementById('t7roi').value)||0;

  const cvr=parseFloat(document.getElementById('t7cvr').value)||0;

  const viol=parseInt(document.getElementById('t7viol').value)||0;
  const scores=[
    {name:'ROI表现',score:Math.min(100,roi*25),weight:25},
    {name:'点击率',score:Math.min(100,ctr*15),weight:20},
    {name:'转化率',score:Math.min(100,cvr*15),weight:20},
    {name:'花费利用',score:util,weight:15},
    {name:'API健康',score:api,weight:10},
    {name:'合规情况',score:Math.max(0,100-viol*20),weight:10}
  ];
  const total=scores.reduce((s,x)=>s+x.score*x.weight/100,0);
  const grade=total>=90?'A+':total>=80?'A':total>=70?'B':total>=60?'C':'D';
  const color=total>=80?'var(--c-green)':total>=60?'var(--c-orange)':'var(--c-red)';

}
