    <div id="t10Result"></div>
  `,mb=>{});
}
function t10Gen(){
  const dims=[...document.querySelectorAll('.t10dim:checked')].map(c=>c.value);
  const metrics=[...document.querySelectorAll('.t10met:checked')].map(c=>c.value);
  if(!dims.length||!metrics.length){toast('请选择维度和指标');return;}
  const stores=getStores().slice(0,6);const channels=['直通车','引力魔方','万相台'];
  const rows=[];stores.forEach(s=>{channels.forEach(ch=>{if(dims.includes('日期')){['2025-06-01','2025-06-02','2025-06-03'].forEach(d=>{rows.push(genExpRow(s,ch,d,dims,metrics));});}else{rows.push(genExpRow(s,ch,'',dims,metrics));}});});
  exportCSV('数据导出_'+new Date().toISOString().slice(0,10)+'.csv',[dims.concat(metrics),...rows.map(r=>dims.concat(metrics).map(c=>r[c]))]);
  document.getElementById('t10Result').innerHTML=`<div class="result-box"><p class="text-sm text-green"><i class="fa-solid fa-check"></i> 已导出 ${rows.length} 行数据，包含 ${dims.length} 个维度和 ${metrics.length} 个指标。</p><table class="data-table mt-3"><thead><tr>${dims.concat(metrics).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,10).map(r=>`<tr>${dims.concat(metrics).map(c=>`<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length>10?'<p class="text-xs text-gray mt-2">仅显示前10行预览，完整数据已下载</p>':''}</div>`;
}
function genExpRow(s,ch,d,dims,metrics){const row={};dims.forEach(dim=>{if(dim==='店铺')row[dim]=s.name;if(dim==='渠道')row[dim]=ch;if(dim==='日期')row[dim]=d||'2025-06-01';if(dim==='计划')row[dim]=ch+'-计划'+Math.ceil(Math.random()*3);});metrics.forEach(m=>{if(m==='花费')row[m]=Math.round(s.spend/3+Math.random()*2000);if(m==='GMV')row[m]=Math.round(s.gmv/3+Math.random()*8000);if(m==='ROI')row[m]=(s.roi+(Math.random()-0.5)).toFixed(2);if(m==='CTR')row[m]=(s.ctr+(Math.random()-0.5)).toFixed(2)+'%';if(m==='CVR')row[m]=(s.cvr+(Math.random()-0.5)).toFixed(2)+'%';if(m==='点击')row[m]=Math.round(3000+Math.random()*5000);if(m==='展现')row[m]=Math.round(60000+Math.random()*80000);});return row;}

// ============ 店铺登录 / 数据源状态 UI ============
const AuthUI={
  async init(){
    await DataAdapter.init();
    this.bindMessage();
    this.renderTopbar();
    this.renderStatusPill();
    if(DataAdapter.mode==='real'){
      DataAdapter.refreshRealData().then(()=>{this.renderTopbar();this.renderStatusPill();}).catch(()=>{});
    }
  },
  // 监听授权回调窗口 postMessage
  bindMessage(){
    window.addEventListener('message',async(e)=>{
      if(!e.data||typeof e.data!=='object')return;
      if(e.data.type==='auth_success'&&e.data.shop){
        const shop=e.data.shop;
        const shops=DataAdapter.getShops();
        if(!shops.some(s=>String(s.userId)===String(shop.userId)))shops.push(shop);
        DataAdapter.saveShops(shops);
        DataAdapter.mode='real';
        DataAdapter.currentUserId=String(shop.userId);
        closeModal();
        toast('店铺授权成功：'+(shop.shopName||shop.nick||''));
        try{await DataAdapter.refreshRealData();}catch(err){}
        this.renderTopbar();
        this.renderStatusPill();
      }else if(e.data.type==='auth_failed'){
        toast('授权失败：'+(e.data.message||'未知错误'));
      }
    });
    // 点击其他区域关闭店铺下拉菜单
    document.addEventListener('click',e=>{
      const menu=document.getElementById('storeMenu');
      if(menu&&menu.classList.contains('show')&&!e.target.closest('.store-chip'))menu.classList.remove('show');
    });
  },
  // ---------- 顶栏：登录按钮 / 店铺芯片 + 演示模式徽标 ----------
  renderTopbar(){
    const el=document.getElementById('topbarAuth');
    if(!el)return;
    const shops=DataAdapter.getShops();
    const real=DataAdapter.mode==='real'&&shops.length;
    const badge=real
      ?'<span class="demo-badge live" title="已连接阿里妈妈实时数据"><i class="fa-solid fa-signal"></i> 实时</span>'
      :'<span class="demo-badge" title="当前使用演示数据"><i class="fa-solid fa-flask"></i> 演示模式</span>';
    if(!real){
      el.innerHTML=badge+'<button class="auth-btn" onclick="AuthUI.openLogin()"><i class="fa-solid fa-store"></i> 店铺登录</button>';
      return;
    }
    const cur=shops.find(s=>String(s.userId)===String(DataAdapter.currentUserId))||shops[0];
    const name=cur.shopName||cur.nick||('店铺-'+cur.userId);
    el.innerHTML=badge+`
    <div class="store-chip" onclick="AuthUI.toggleMenu(event)">
      <div class="avatar">${name.slice(0,1)}</div>
      <span>${name}</span>
      <i class="fa-solid fa-chevron-down" style="font-size:10px;opacity:.8"></i>
      <div class="chip-dropdown" id="storeMenu">
        <div class="dd-title">已授权店铺（${shops.length}）</div>
        ${shops.map((sh,i)=>`<div class="dd-item ${String(sh.userId)===String(DataAdapter.currentUserId)?'active':''}" onclick="event.stopPropagation();AuthUI.switchStore(${i})"><i class="fa-solid fa-store"></i> ${sh.shopName||sh.nick||sh.userId}</div>`).join('')}
        <div class="dd-sep"></div>
        <div class="dd-item" onclick="event.stopPropagation();AuthUI.openLogin()"><i class="fa-solid fa-plus"></i> 添加店铺（切换店铺）</div>
        <div class="dd-item" onclick="event.stopPropagation();AuthUI.showStoreStatus()"><i class="fa-solid fa-chart-pie"></i> 店铺数据状态</div>
        <div class="dd-item danger" onclick="event.stopPropagation();AuthUI.logout()"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</div>
      </div>
    </div>`;
  },
  toggleMenu(e){
    if(e)e.stopPropagation();
    const m=document.getElementById('storeMenu');
    if(m)m.classList.toggle('show');
  },
  switchStore(i){
    const shops=DataAdapter.getShops();
    if(!shops[i])return;
    DataAdapter.currentUserId=String(shops[i].userId);
    const m=document.getElementById('storeMenu');if(m)m.classList.remove('show');
    toast('已切换到：'+(shops[i].shopName||shops[i].nick||shops[i].userId));
    DataAdapter.refreshRealData().then(()=>{AuthUI.renderTopbar();AuthUI.renderStatusPill();}).catch(()=>{});
  },
  // ---------- 登录弹窗 ----------
  openLogin(){
    openModal('店铺登录','<i class="fa-solid fa-store"></i>','var(--grad-primary)',`
      <div class="form-group"><label>店铺名称（用于展示）</label><input id="loginShopName" placeholder="如：旗舰店-美妆官方"></div>
      <button class="btn btn-primary" id="loginBtn" onclick="AuthUI.doLogin()"><i class="fa-solid fa-right-to-bracket"></i> 通过淘宝授权登录</button>
      <div id="loginMsg" class="mt-3"></div>
    `);
  },
  async doLogin(){
    const shopName=(document.getElementById('loginShopName')||{}).value||'';
    const btn=document.getElementById('loginBtn');
    const msg=document.getElementById('loginMsg');
    if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 正在生成授权链接...';}
    try{
      const r=await fetch('/api/auth/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({shopName})
      });
      const d=await r.json();
      if(d.status==='not_configured'){
        if(msg)msg.innerHTML=`<div class="info-box">
          <p class="text-sm" style="color:#92400e"><i class="fa-solid fa-circle-info"></i> 真实数据接入需先配置阿里妈妈开放平台appKey/appSecret（见README），当前可使用演示模式体验全部功能</p>
          <div class="flex gap-2 mt-2">
            <button class="btn btn-sm btn-success" onclick="AuthUI.enterDemo()"><i class="fa-solid fa-play"></i> 进入演示模式</button>
            <button class="btn btn-sm btn-secondary" onclick="AuthUI.showConfigTutorial()"><i class="fa-solid fa-book"></i> 查看配置教程</button>
          </div></div>`;
        if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> 通过淘宝授权登录';}
      }else if(d.status==='ok'&&d.authUrl){
        window.open(d.authUrl,'tmall_oauth','width=560,height=700');
        if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-gray"><i class="fa-solid fa-spinner fa-spin"></i> 已打开淘宝授权窗口，请在新窗口完成授权，授权成功后自动返回本平台...</p></div>';
        if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> 通过淘宝授权登录';}
      }else{
        if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-red">登录失败：'+((d&&d.message)||'未知错误')+'</p></div>';
        if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> 通过淘宝授权登录';}
      }
    }catch(e){
      if(msg)msg.innerHTML='<div class="result-box"><p class="text-sm text-red">无法连接后端服务（'+e.message+'），请确认 server.js 已启动。</p></div>';
      if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> 通过淘宝授权登录';}
    }
  },
  enterDemo(){
    DataAdapter.mode='demo';
    DataAdapter.saveShops([]);
    DataAdapter.realStores=null;
    Object.keys(DataAdapter.apiStatus).forEach(k=>DataAdapter.apiStatus[k]='演示数据');
    closeModal();
    this.renderTopbar();
    this.renderStatusPill();
    renderOverview();
    toast('已进入演示模式，全部功能可用');
  },
  showConfigTutorial(){
    openModal('真实数据配置教程','<i class="fa-solid fa-book"></i>','#f59e0b',`
      <div class="result-box">
        <p class="text-sm"><strong>1. 登录阿里妈妈开放平台</strong><br>访问 alimama.com 开放平台（open.alimama.com），使用天猫店铺主账号登录并完成企业实名认证。</p>
        <p class="text-sm mt-2"><strong>2. 创建应用获得 appKey/appSecret</strong><br>进入"应用管理→创建应用"（自用型或工具型ISV），创建后获得 appKey 与 appSecret。</p>
        <p class="text-sm mt-2"><strong>3. 申请万相台无界版 API 权限包</strong><br>在"API权限申请"中勾选万相台无界版（营销投放）、直通车/引力魔方报表、达摩盘人群、生意参谋数据权限包并提交资质审核。</p>
        <p class="text-sm mt-2"><strong>4. 配置回调地址</strong><br>在应用"授权回调地址"中填写本平台回调：<code>http://localhost:8081/api/auth/callback</code>（线上改为你的域名），并设置环境变量后重启 server.js。</p>
        <p class="text-sm mt-2 text-gray">详细说明见项目 README.md。</p>
      </div>`);
  },
  // ---------- 退出登录 ----------
  async logout(){
    const shops=DataAdapter.getShops();
    const cur=shops.find(s=>String(s.userId)===String(DataAdapter.currentUserId))||shops[0];
    try{
      if(cur)await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:cur.userId})});
    }catch(e){}
    const remain=shops.filter(s=>String(s.userId)!==String(cur&&cur.userId));
    DataAdapter.saveShops(remain);
    if(remain.length){
      DataAdapter.currentUserId=String(remain[0].userId);
    }else{
      DataAdapter.mode='demo';
      DataAdapter.realStores=null;
      Object.keys(DataAdapter.apiStatus).forEach(k=>DataAdapter.apiStatus[k]='演示数据');
    }
    this.renderTopbar();
    this.renderStatusPill();
    renderOverview();
    toast('已退出登录');
  },
  // ---------- 店铺数据状态 ----------
  showStoreStatus(){
    const shops=DataAdapter.getShops();
    openModal('店铺数据状态','<i class="fa-solid fa-chart-pie"></i>','#3b82f6',`
      <table class="data-table"><thead><tr><th>店铺</th><th>授权状态</th><th>Token到期</th></tr></thead><tbody>
      ${(shops.length?shops:[{shopName:'（未登录店铺）',nick:'',expiresAt:0}]).map(s=>{
        const exp=s.expiresAt?new Date(s.expiresAt).toLocaleString('zh-CN'):'-';
        const ok=!s.expiresAt||s.expiresAt>Date.now();
        return `<tr><td>${s.shopName||s.nick||s.userId||'-'}</td><td>${ok?'<span class="badge badge-green">有效</span>':'<span class="badge badge-red">已过期</span>'}</td><td class="text-xs">${exp}</td></tr>`;
      }).join('')}
      </tbody></table>
      <div class="result-box mt-3"><h4>数据能力连接状态</h4><div class="mt-2">${AuthUI.sourceRowsHtml()}</div></div>
    `);
  },
  sourceRowsHtml(){
    const map=[['campaigns','万相台计划'],['reports','计划报表'],['keywords','关键词'],['audiences','人群(达摩盘)'],['creatives','创意素材'],['sycm','生意参谋数据']];
    return map.map(([k,label])=>{
      const st=DataAdapter.apiStatus[k]||'未知';
      const cls=st==='已连接'?'src-ok':(st==='演示数据'?'src-demo':'src-err');
      const prefix=st==='已连接'?'<i class="fa-solid fa-circle-check text-green"></i> ':st==='演示数据'?'<i class="fa-solid fa-flask text-orange"></i> ':'<i class="fa-solid fa-triangle-exclamation text-red"></i> ';
      return `<div class="src-row"><span>${label}</span><span class="src-state ${cls}">${prefix}${st}</span></div>`;
    }).join('');
  },
  // ---------- 右下角数据源状态胶囊 ----------
  renderStatusPill(){
    let el=document.getElementById('statusPill');
    if(!el){
      el=document.createElement('div');
      el.id='statusPill';
      document.body.appendChild(el);
    }
    const real=DataAdapter.mode==='real';
    el.className='status-pill'+(real?' live':'');
    el.innerHTML=real
      ?'<i class="fa-solid fa-circle" style="font-size:8px"></i> 数据源: 阿里妈妈API(已连接)'
      :'<i class="fa-solid fa-circle" style="font-size:8px"></i> 数据源: 演示数据';
    el.onclick=()=>AuthUI.showSourcePanel();
  },
  showSourcePanel(){
    const real=DataAdapter.mode==='real';
    openModal('数据源配置','<i class="fa-solid fa-database"></i>',real?'#10b981':'#f59e0b',`
      <div class="result-box mb-3">
        <p class="text-sm"><strong>当前数据源：</strong>${real?'<span class="badge badge-green">阿里妈妈开放API（实时）</span>':'<span class="badge badge-yellow">演示数据</span>'}</p>
        <p class="text-xs text-gray mt-2">演示模式下全部61个技能与10个工具使用内置种子数据；配置appKey/appSecret并完成店铺授权后自动切换为阿里妈妈实时数据。</p>
      </div>
      <h4 class="mb-2">各能力API连接状态</h4>
      <div style="border:1px solid var(--c-border);border-radius:8px">${AuthUI.sourceRowsHtml()}</div>
      <div class="flex gap-2 mt-3">
        ${real?'':'<button class="btn btn-primary btn-sm" onclick="AuthUI.openLogin()"><i class="fa-solid fa-store"></i> 店铺登录接入真实数据</button>'}
        <button class="btn btn-secondary btn-sm" onclick="AuthUI.showConfigTutorial()"><i class="fa-solid fa-book"></i> 配置教程</button>
      </div>
    `);
  }
};

// ===================== INIT =====================
(async function initApp(){
  try{
    await AuthUI.init();
  }catch(e){
    console.error('初始化数据适配层失败（降级为演示模式）:',e);
    AuthUI.renderStatusPill();
  }
  renderOverview();
  renderAccordion();
  renderTools();
})();
</script>
</body>
</html>
