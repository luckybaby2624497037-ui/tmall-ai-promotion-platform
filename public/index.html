<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天猫推广自动化平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --grad-primary:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  --c-primary:#667eea;
  --c-primary-dark:#5568d3;
  --c-secondary:#764ba2;
  --c-bg:#f5f6fa;
  --c-card:#ffffff;
  --c-text:#2d3748;
  --c-text-light:#718096;
  --c-border:#e2e8f0;
  --c-blue:#3b82f6;
  --c-green:#10b981;
  --c-orange:#f59e0b;
  --c-red:#ef4444;
  --c-purple:#8b5cf6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,.15);
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#f1f1f1;}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#a1a1a1;}

/* Top Navigation */
.topbar{background:var(--grad-primary);color:#fff;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:1000;box-shadow:var(--shadow-md);}
.topbar .logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.topbar .logo i{font-size:22px;}
.topbar .tabs{display:flex;gap:4px;}
.topbar .tab{padding:8px 20px;border-radius:8px;cursor:pointer;transition:.2s;font-size:14px;font-weight:500;opacity:.8;}
.topbar .tab:hover{opacity:1;background:rgba(255,255,255,.15);}
.topbar .tab.active{background:rgba(255,255,255,.2);opacity:1;font-weight:700;}
.topbar .search{flex:1;max-width:400px;margin-left:auto;position:relative;}
.topbar .search input{width:100%;padding:8px 12px 8px 36px;border:none;border-radius:20px;font-size:13px;font-family:inherit;background:rgba(255,255,255,.2);color:#fff;}
.topbar .search input::placeholder{color:rgba(255,255,255,.6);}
.topbar .search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6);}
.topbar .search-results{position:absolute;top:48px;left:0;right:0;background:#fff;border-radius:8px;box-shadow:var(--shadow-lg);max-height:400px;overflow-y:auto;display:none;z-index:9999;}
.topbar .search-results.show{display:block;}
.topbar .search-results .item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--c-border);color:var(--c-text);}
.topbar .search-results .item:hover{background:var(--c-bg);}
.topbar .search-results .item .mod{font-size:11px;color:var(--c-text-light);}

/* Main Content */
.main{max-width:1400px;margin:0 auto;padding:24px;}

/* Tab panels */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Stat Cards */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px;transition:.2s;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.stat-card .icon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
.stat-card .num{font-size:28px;font-weight:900;}
.stat-card .label{font-size:13px;color:var(--c-text-light);}

/* Module Cards Grid */
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.module-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;border:2px solid transparent;text-align:center;}
.module-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow-md);transform:translateY(-3px);}
.module-card .icon{width:52px;height:52px;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;}
.module-card .name{font-size:14px;font-weight:700;margin-bottom:4px;}
.module-card .count{font-size:12px;color:var(--c-text-light);}
.module-card .desc{font-size:11px;color:var(--c-text-light);margin-top:6px;line-height:1.4;}

/* Accordion */
.accordion-item{background:var(--c-card);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.accordion-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s;}
.accordion-header:hover{background:var(--c-bg);}
.accordion-header .icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;}
.accordion-header .title{font-size:16px;font-weight:700;flex:1;}
.accordion-header .count{font-size:12px;color:var(--c-text-light);background:var(--c-bg);padding:2px 10px;border-radius:10px;}
.accordion-header .arrow{transition:.3s;color:var(--c-text-light);}
.accordion-item.open .accordion-header .arrow{transform:rotate(180deg);}
.accordion-body{display:none;padding:16px 20px 20px;}
.accordion-item.open .accordion-body{display:block;}

/* Skill Cards */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.skill-card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:.2s;display:flex;align-items:flex-start;gap:12px;}
.skill-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.skill-card .s-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0;}
.skill-card .s-info{flex:1;min-width:0;}
.skill-card .s-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.skill-card .s-desc{font-size:11px;color:var(--c-text-light);line-height:1.4;}
.skill-card .s-badge{font-size:10px;color:var(--c-green);background:var(--c-green-bg,#ecfdf5);padding:1px 6px;border-radius:4px;margin-top:4px;display:inline-block;}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:5000;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:900px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalIn .2s;}
@keyframes modalIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.modal-header{padding:16px 24px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.modal-header .m-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
.modal-header .m-title{font-size:17px;font-weight:700;flex:1;}
.modal-header .close{width:32px;height:32px;border:none;background:var(--c-bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--c-text-light);transition:.2s;}
.modal-header .close:hover{background:var(--c-red);color:#fff;}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1;}

/* Forms & Inputs */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--c-text);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;font-family:inherit;transition:.2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(102,126,234,.1);}
.form-group textarea{resize:vertical;min-height:80px;}
.form-row{display:flex;gap:12px;}
.form-row .form-group{flex:1;}

/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--grad-primary);color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-secondary{background:var(--c-bg);color:var(--c-text);}
.btn-secondary:hover{background:var(--c-border);}
.btn-danger{background:var(--c-red);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-success{background:var(--c-green);color:#fff;}
.btn-success:hover{opacity:.9;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{background:var(--c-bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--c-text-light);font-size:12px;white-space:nowrap;}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--c-border);}
.data-table tr:hover td{background:#fafbfc;}
.data-table .actions{display:flex;gap:6px;}

/* Badges */
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-gray{background:#f3f4f6;color:#374151;}
.badge-purple{background:#f3e8ff;color:#6b21a8;}

/* Toggle Switch */
.toggle{position:relative;width:40px;height:22px;background:#ccc;border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle.on{background:var(--c-green);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;}
.toggle.on::after{transform:translateX(18px);}

/* Progress Bars */
.progress{height:8px;background:var(--c-bg);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;border-radius:4px;transition:width .5s;}

/* Charts */
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:160px;padding:8px 0;}
.chart-bar .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.chart-bar .bar{width:60%;border-radius:4px 4px 0 0;transition:.3s;min-height:2px;position:relative;}
.chart-bar .bar:hover{opacity:.8;}
.chart-bar .bar-label{font-size:10px;color:var(--c-text-light);text-align:center;white-space:nowrap;}

.pie-chart{width:160px;height:160px;border-radius:50%;position:relative;margin:0 auto;}
.pie-chart::after{content:'';position:absolute;top:25%;left:25%;width:50%;height:50%;background:#fff;border-radius:50%;}

.line-chart{width:100%;height:160px;}
.line-chart svg{width:100%;height:100%;}

/* Heatmap */
.heatmap{display:grid;gap:2px;font-size:10px;}
.heatmap .hm-cell{padding:4px;text-align:center;border-radius:3px;cursor:pointer;transition:.2s;color:#fff;font-weight:600;}
.heatmap .hm-cell:hover{transform:scale(1.1);z-index:1;}

/* Tool Cards (Tab 3) */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.tool-card{background:var(--c-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;border:2px solid transparent;}
.tool-card:hover{border-color:var(--c-primary);box-shadow:var(--shadow-md);transform:translateY(-3px);}
.tool-card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-bottom:12px;}
.tool-card .name{font-size:15px;font-weight:700;margin-bottom:4px;}
.tool-card .desc{font-size:12px;color:var(--c-text-light);line-height:1.5;}

/* Section Title */
.section-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-title i{color:var(--c-primary);}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--c-text);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:9999;animation:toastIn .3s;font-size:14px;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* Tree */
.tree-node{padding-left:20px;}
.tree-item{padding:6px 10px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;transition:.2s;}
.tree-item:hover{background:var(--c-bg);}
.tree-item.active{background:rgba(102,126,234,.1);}
.tree-children{margin-left:16px;border-left:2px solid var(--c-border);padding-left:8px;}

/* Misc */
.flex{display:flex;}
.items-center{align-items:center;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.gap-4{gap:16px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mt-4{margin-top:16px;}
.mb-2{margin-bottom:8px;}
.mb-3{margin-bottom:12px;}
.mb-4{margin-bottom:16px;}
.text-sm{font-size:13px;}
.text-xs{font-size:12px;}
.text-green{color:var(--c-green);}
.text-red{color:var(--c-red);}
.text-orange{color:var(--c-orange);}
.text-blue{color:var(--c-blue);}
.text-gray{color:var(--c-text-light);}
.text-center{text-align:center;}
.font-bold{font-weight:700;}
.w-full{width:100%;}
.hidden{display:none!important;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.flex-wrap{flex-wrap:wrap;}
.justify-between{justify-content:space-between;}
.pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s;border:1px solid var(--c-border);}
.pill.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.pill:hover{border-color:var(--c-primary);}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:4px 0;}
.checkbox-item input{margin:0;}
.result-box{background:var(--c-bg);border-radius:8px;padding:14px;margin-top:12px;}
.kpi-card{background:var(--c-bg);border-radius:8px;padding:14px;text-align:center;}
.kpi-card .v{font-size:22px;font-weight:900;}
.kpi-card .l{font-size:11px;color:var(--c-text-light);}
.slider{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--c-border);outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--c-primary);cursor:pointer;}

/* Topbar Store Login */
.topbar-auth{display:flex;align-items:center;gap:10px;position:relative;margin-left:8px;white-space:nowrap;}
.auth-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.auth-btn:hover{background:rgba(255,255,255,.32);}
.demo-badge{background:#f59e0b;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.demo-badge.live{background:var(--c-green);}
.store-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:4px 12px 4px 4px;border-radius:18px;cursor:pointer;position:relative;color:#fff;font-size:13px;font-weight:600;transition:.2s;}
.store-chip:hover{background:rgba(255,255,255,.3);}
.store-chip .avatar{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
.chip-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);min-width:220px;z-index:10001;padding:6px 0;color:var(--c-text);}
.chip-dropdown.show{display:block;}
.chip-dropdown .dd-title{padding:6px 16px;font-size:11px;color:var(--c-text-light);font-weight:700;}
.chip-dropdown .dd-item{padding:8px 16px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--c-text);}
.chip-dropdown .dd-item:hover{background:var(--c-bg);}
.chip-dropdown .dd-item.active{color:var(--c-primary);font-weight:700;}
.chip-dropdown .dd-item.danger{color:var(--c-red);}
.chip-dropdown .dd-sep{height:1px;background:var(--c-border);margin:4px 0;}

/* Live badge on data panels */
.live-badge{font-size:10px;color:var(--c-green);background:#ecfdf5;border:1px solid #a7f3d0;padding:1px 6px;border-radius:4px;font-weight:700;display:inline-block;vertical-align:middle;}

/* Footer data source status pill */
.status-pill{position:fixed;bottom:16px;right:16px;z-index:4000;background:var(--c-text);color:#fff;padding:8px 16px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:6px;transition:.2s;}
.status-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.status-pill.live{background:var(--c-green);}
.src-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--c-border);font-size:13px;}
.src-row:last-child{border-bottom:none;}
.src-state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.src-ok{background:#dcfce7;color:#166534;}
.src-demo{background:#fef3c7;color:#92400e;}
.src-err{background:#fee2e2;color:#991b1b;}
.info-box{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:14px;}

/* Data import button in topbar */
.import-btn{background:rgba(255,255,255,.25);color:#fff;border:1px dashed rgba(255,255,255,.6);padding:6px 14px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.import-btn:hover{background:rgba(255,255,255,.4);border-style:solid;}
.import-btn.has-data{background:#10b981;border-color:#10b981;border-style:solid;}

/* Data Import Modal full-screen */
.import-modal{max-width:1100px!important;}
.di-dropzone{border:2px dashed var(--c-border);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:.2s;background:var(--c-bg);}
.di-dropzone:hover,.di-dropzone.dragover{border-color:var(--c-primary);background:rgba(102,126,234,.06);}
.di-dropzone .dz-icon{font-size:40px;color:var(--c-text-light);margin-bottom:12px;}
.di-dropzone .dz-text{font-size:14px;color:var(--c-text);}
.di-dropzone .dz-hint{font-size:12px;color:var(--c-text-light);margin-top:6px;}
.di-section{margin-top:20px;}
.di-section h4{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.di-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.di-type-card{border:2px solid var(--c-border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:.2s;font-size:13px;}
.di-type-card:hover{border-color:var(--c-primary);}
.di-type-card.active{border-color:var(--c-primary);background:rgba(102,126,234,.08);font-weight:700;}
.di-type-card .dt-cols{font-size:11px;color:var(--c-text-light);margin-top:4px;line-height:1.4;}
.di-mapping-table{width:100%;border-collapse:collapse;font-size:13px;}
.di-mapping-table th{background:var(--c-bg);padding:8px 10px;text-align:left;font-weight:600;font-size:12px;}
.di-mapping-table td{padding:8px 10px;border-bottom:1px solid var(--c-border);}
.di-mapping-table select{width:100%;padding:5px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px;font-family:inherit;}
.di-preview-table{width:100%;border-collapse:collapse;font-size:12px;max-height:240px;overflow:auto;display:block;}
.di-preview-table th{background:var(--c-bg);padding:6px 8px;text-align:left;white-space:nowrap;position:sticky;top:0;}
.di-preview-table td{padding:6px 8px;border-bottom:1px solid var(--c-border);white-space:nowrap;}
.di-history-item{background:var(--c-bg);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.di-history-item .hi-info{flex:1;min-width:0;}
.di-history-item .hi-name{font-size:13px;font-weight:600;}
.di-history-item .hi-meta{font-size:11px;color:var(--c-text-light);margin-top:2px;}

function buildStoreMetrics(name){
  const camp=(typeof DataAdapter!=='undefined')?DataAdapter.getImportedData(name,'campaign_report'):null;
  if(camp&&camp.rows&&camp.rows.length){
    let tSpend=0,tGMV=0,tClicks=0,tImp=0;
    camp.rows.forEach(r=>{tSpend+=+(r.花费||r.cost||0);tGMV+=+(r.GMV||r.gmv||0);tClicks+=+(r.点击量||r.clicks||0);tImp+=+(r.展现量||r.impressions||0);});
    const roi=tSpend>0?+(tGMV/tSpend).toFixed(2):0;
    return {name,status:'已授权',expire:'长期',quota:8000,quotaMax:10000,
      roi,gmv:Math.round(tGMV),spend:Math.round(tSpend),
      ctr:tImp>0?+(tClicks/tImp*100).toFixed(2):0,cvr:0,clicks:Math.round(tClicks),impressions:Math.round(tImp),
      health:roi>=2.5?85:70,real:true,imported:true};
  }
  // 万相台API实时指标缓存（refreshRealData拉取）
  const cache=(typeof DataAdapter!=='undefined')?DataAdapter.metricsCache[name]:null;

  _currentStoreName(){

  // ---------- 初始化：决定 demo/real（有session令牌的店铺即real模式） ----------
  async init(){

  // ---------- 通用API代理（经xcxd代理网关，bizParams格式，自动带当前店铺session） ----------
  // scene: 可选营销场景biz_code，不传用默认onebpSearch
  async proxy(method,bizParams,scene){
    const my=getMyStores();
    const name=currentStore();
    const rec=my.find(s=>s.shopName===name);
    const session=rec&&rec.session;
    if(!session){return {status:'error',message:'当前店铺无session令牌，请先在店铺管理中添加'};}
    const bp=Object.assign({},bizParams||{});
    // 注入场景上下文（保持调用方传入的top_service_context优先）
    if(!bp.top_service_context){
      bp.top_service_context=JSON.stringify({biz_code:scene||'onebpSearch',login_type:1});
    }
    const resp=await fetch('/api/proxy/alimama',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session:session,method:method,bizParams:bp})
    });
    return resp.json();
  },
  // 从上游响应中尽力提取列表数据
  extractList(resp){
    if(!resp||typeof resp!=='object')return[];
    let best=[];
    // 万相台响应嵌套较深（campaign_v_o在6-7层），深度上限设为12
    const scan=(o,depth)=>{
      if(!o||typeof o!=='object'||depth>12)return;
      if(Array.isArray(o)){if(o.length>best.length)best=o;return;}
      Object.values(o).forEach(v=>scan(v,depth+1));
    };
    scan(resp,0);
    return best;
  },
  upstreamError(d){
    if(d&&d.response&&d.response.error_response){
      const er=d.response.error_response;
      return er.sub_msg||er.msg||('上游错误code:'+er.code);
    }
    if(d&&d.status==='error')return d.message||'网关错误';
    if(d&&d.status==='not_configured')return '未配置appKey';
    return null;
  },

  summarize(rows){
    const cost=rows.reduce((t,r)=>t+(+r.cost||0),0);
    const gmv=rows.reduce((t,r)=>t+(+r.gmv||0),0);
    const clicks=rows.reduce((t,r)=>t+(+r.clicks||0),0);
    const impressions=rows.reduce((t,r)=>t+(+r.impressions||0),0);
    return {spend:cost,gmv,roi:cost>0?+(gmv/cost).toFixed(2):0,ctr:impressions>0?+(clicks/impressions*100).toFixed(2):0,cvr:0,clicks,impressions};

  async fetchReports(startDate,endDate,storeName){
    // 导入数据优先（隔离模式：默认当前店铺，可指定storeName）
    const curStore=storeName||this._currentStoreName();
    const imported=this.getImportedData(curStore,'campaign_report');

        roi:+(r.ROI||r.roi||0),ctr:+(r.CTR||r.ctr||0),cvr:+(r.CVR||r.cvr||0),
        clicks:+(r.点击量||r.clicks||0),impressions:+(r.展现量||r.impressions||0)
      }));
      return {live:true,rows,summary:this.summarize(rows),imported:true};
    }
    if(this.mode==='real'){
      try{
        // 万相台计划报表（当前应用权限仅开放charge花费字段；点击/展现等指标需补申请权限或Excel导入）
        // 遍历全部营销场景聚合花费，与万相台后台"全部营销场景"口径对齐
        const start=(startDate||new Date(Date.now()-7*86400000).toISOString().slice(0,10));
        const end=(endDate||new Date().toISOString().slice(0,10));
        const rows=[];
        let sceneOk=0,sceneTotal=0;
        for(const scene of SCENE_CODES){
          try{
            // 关键修复：query_field_in_list必须用数组格式（逗号字符串会触发"所有字段均无查询权限"误导报错）
            // 响应字段为下划线格式：ad_pv/click/charge/alipay_inshop_amt/gmv_inshop_amt/cvr/roi
            const d=await this.proxy('taobao.universalbp.new.report.query.campaign',{
              top_campaign_report_query_v_o:JSON.stringify({by_page:true,split_type:'sum',unify_type:'zhai',start_time:start,end_time:end,effect_equal:15,query_domains:'campaign',query_field_in_list:['adPv','click','charge','alipayInshopAmt','gmvInshopAmt','cvr','roi'],offset:0,page_size:50})
            },scene);
            const err=this.upstreamError(d);
            if(!err&&d.status==='ok'){
              sceneOk++;
              const list=this.extractList(d.response);
              list.forEach(r=>{
                const ri=r.report_index||{};
                const c=+(ri.charge)||0;
                const clicks=+(ri.click)||0;
                const imp=+(ri.ad_pv||ri.adPv)||0;
                const gmv=+(ri.alipay_inshop_amt||ri.alipayInshopAmt)||0;
                const roi=+(ri.roi)||0;
                const cvr=+(ri.cvr)||0;
                if(c>0||clicks>0||r.campaign_name){
                  sceneTotal+=c;
                  rows.push({
                    date:end,store:currentStore()||'',campaign:r.campaign_name||'',
                    cost:c,gmv,roi,ctr:imp>0?+(clicks/imp*100).toFixed(2):0,cvr:cvr?+(cvr*100).toFixed(2):0,clicks,impressions:imp,
                    item:r.promotion_name||'',scene:SCENE_NAMES[scene]||scene
                  });
                }
              });
            }
          }catch(e){}
        }
        if(sceneOk>0){
          this.apiStatus.reports='已连接('+sceneOk+'场景·全指标)';
          const summary=this.summarize(rows);
          summary.spend=Math.round(sceneTotal*100)/100;
          summary.note='已聚合'+sceneOk+'个营销场景全指标（展现/点击/花费/GMV/ROI/CVR均为万相台真实数据）';
          return {live:true,rows,summary,real:true};
        }
        this.apiStatus.reports='未授权接口';
      }catch(e){this.apiStatus.reports='连接失败';}
      const rows=this.seedReports();
      return {live:false,rows,summary:this.summarize(rows)};
    }
    this.apiStatus.reports='演示数据';
    const rows=this.seedReports();
    return {live:false,rows,summary:this.summarize(rows)};
  },

  async _doRefreshRealData(){
    const my=getMyStores();
    const name=currentStore();
    const rec=my.find(s=>s.shopName===name);
    if(!rec||!rec.session){this.diagLog=[{t:new Date().toLocaleTimeString(),ok:false,msg:'当前店铺无session，跳过拉取'}];return;}
    this.diagLog=[];
    const log=(ok,msg)=>{this.diagLog.push({t:new Date().toLocaleTimeString(),ok,msg});};
    log(true,'开始拉取：'+name);
    const out=[];
    const st={name:name,roi:0,gmv:0,spend:0,ctr:0,cvr:0,real:true};
    const cache={spend:0,gmv:0,roi:0,ctr:0,cvr:0,campaignCount:0,creativeCount:0,ts:Date.now()};
    this.realCampaigns=[];this.realCreatives=[];this.realReports=[];
    // 淘宝侧服务波动检测：全部拉取为0时定时自动重试（hsf异常/限流自愈后自动恢复数据）
    const gotAnyData=()=>{
      return (this.realCampaigns&&this.realCampaigns.length)||(this.realReports&&this.realReports.length)||(cache.todaySpend>0);
    };
    try{
      // 1. 真实报表（花费汇总，近7天）
      const rep=await this.fetchReports();
      if(rep&&rep.live&&rep.summary){
        st.spend=rep.summary.spend||0;st.gmv=rep.summary.gmv||0;st.roi=rep.summary.roi||0;st.ctr=rep.summary.ctr||0;
        cache.spend=st.spend;cache.gmv=st.gmv;cache.roi=st.roi;cache.ctr=st.ctr;
        this.realReports=rep.rows||[];
        log(true,'报表拉取成功：'+this.realReports.length+'行，花费'+Math.round(st.spend)+'元');
      }else{
        log(false,'报表拉取失败：'+((rep&&rep.summary&&rep.summary.note)||this.apiStatus.reports));
      }
    }catch(e){log(false,'报表异常：'+e.message);}
    try{
      // 2. 真实计划列表（全量缓存，供各技能直接使用）
      const camp=await this.fetchCampaigns();
      if(camp&&camp.live&&Array.isArray(camp.data)){
        cache.campaignCount=camp.data.length;
        this.realCampaigns=camp.data;
        log(true,'计划拉取成功：'+camp.data.length+'个');
      }else{
        log(false,'计划拉取失败：'+this.apiStatus.campaigns);
      }
    }catch(e){log(false,'计划异常：'+e.message);}
    try{
      // 3. 真实创意列表（全量缓存）
      const cr=await this.fetchCreatives();
      if(cr&&cr.live&&Array.isArray(cr.data)){
        cache.creativeCount=cr.data.length;
        this.realCreatives=cr.data;
        log(true,'创意拉取成功：'+cr.data.length+'个');
      }else{
        log(false,'创意拉取失败：'+this.apiStatus.creatives);
      }
    }catch(e){log(false,'创意异常：'+e.message);}
    try{
      // 4. 实时报表（今日实时花费，遍历场景聚合）
      let rtTotal=0;const rtRows=[];
      for(const scene of SCENE_CODES){
        try{
          const d=await this.proxy('taobao.universalbp.new.report.query.realtime',{
            top_real_time_report_query_v_o:JSON.stringify({by_page:true,split_type:'sum',unify_type:'zhai',effect_equal:15,query_domains:'campaign',query_field_in_list:['adPv','click','charge','alipayInshopAmt','gmvInshopAmt','cvr','roi'],offset:0,page_size:50})
          },scene);
          const err=this.upstreamError(d);
          if(!err&&d.status==='ok'){
            const list=this.extractList(d.response);
            list.forEach(r=>{
              const ri=r.report_index||{};
              const c=+(ri.charge)||0;
              const gmv=+(ri.alipay_inshop_amt||ri.alipayInshopAmt)||0;
              const clicks=+(ri.click)||0;
              const imp=+(ri.ad_pv||ri.adPv)||0;
              const roi=+(ri.roi)||0;
              if(c>0||clicks>0){rtTotal+=c;rtRows.push({campaign:r.campaign_name||'',cost:c,gmv,clicks,impressions:imp,roi,scene:(r.scene1_name||SCENE_NAMES[scene]||scene)});}
            });
          }
        }catch(e){}
      }
      cache.todaySpend=Math.round(rtTotal*100)/100;
      cache.todayGmv=Math.round(rtRows.reduce((s,r)=>s+(r.gmv||0),0)*100)/100;
      cache.todayClicks=rtRows.reduce((s,r)=>s+(r.clicks||0),0);
      this.realRealtime=rtRows;
      log(true,'实时报表成功：今日实时花费'+cache.todaySpend+'元 / GMV '+cache.todayGmv+'元（'+rtRows.length+'个在投计划）');
    }catch(e){log(false,'实时报表异常：'+e.message);}
    try{
      // 5. 推广单元数据（含商品信息与成交增长数据）+ 收集单元ID供bidword查询
      const agRows=[];const agIds=[];
      for(const c of (this.realCampaigns||[]).slice(0,10)){
        try{
          const d=await this.proxy('taobao.universalbp.new.adgroup.horizontal.findpage',{
            adgroup_query_v_o:JSON.stringify({campaign_id_list:[c['计划ID']],offset:0,page_size:20})
          },'onebpSearch');
          const err=this.upstreamError(d);
          if(!err&&d.status==='ok'){
            const list=this.extractList(d.response);
            list.forEach(a=>{
              if(a.adgroup_id)agIds.push(a.adgroup_id);
              if(a.adgroup_name)agRows.push({'单元名称':a.adgroup_name,'计划名称':a.campaign_name||c['计划名称'],'状态':a.display_status||'','商品':(a.material&&(a.material.title||a.material.item_name))||(a.adgroup_name||''),'增长数据':(a.material&&a.material.grow_desc)||''});
            });
          }
        }catch(e){}
      }
      this.realAdgroups=agRows;this._adgroupIds=agIds;
      if(agRows.length)log(true,'推广单元拉取成功：'+agRows.length+'个单元');
    }catch(e){log(false,'推广单元异常：'+e.message);}
    try{
      // 6. 真实关键词数据（bidword.findlist + rpt_query，词+出价+效果+排名）
      const kw=await this.fetchKeywords();
      if(kw&&kw.live&&Array.isArray(kw.data)){
        cache.keywordCount=kw.data.length;
        log(true,'关键词拉取成功：'+kw.data.length+'个词');
      }else{log(false,'关键词拉取：'+this.apiStatus.keywords);}
    }catch(e){log(false,'关键词异常：'+e.message);}
    this.metricsCache[name]=cache;
    out.push(st);
    this.realStores=out;
    log(true,'拉取流程完成，缓存已更新');
    // 淘宝服务波动自愈：拉取结果全为0时，每5分钟自动重试（最多10次），服务恢复后数据自动补齐
    if(!gotAnyData()){
      log(false,'⚠ 拉取结果为空——淘宝万相台服务可能波动(hsf异常)或限流，已启动自动重试');
      if(this._retryTimer)clearInterval(this._retryTimer);
      let retries=0;
      this._retryTimer=setInterval(()=>{
        retries++;
        if(retries>10||gotAnyData()||this.mode!=='real'){clearInterval(this._retryTimer);this._retryTimer=null;return;}
        this.refreshRealData().catch(()=>{});
      },5*60*1000);
    }
    // 数据到位后刷新总览与状态栏
    try{renderOverview();if(typeof AuthUI!=='undefined'){AuthUI.renderTopbar();AuthUI.renderStatusPill();}}catch(e){}
  }
};

}

// CSV Export
function exportCSV(filename,rows){
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

// CSS Bar Chart
function barChart(data,opts={}){
  const max=Math.max(...data.map(d=>d.value),1);
  const h=opts.height||140;
  return `<div class="chart-bar" style="height:${h}px">${data.map((d,i)=>`<div class="bar-col"><div class="bar" style="height:${(d.value/max)*100}%;background:${d.color||COLORS[i%COLORS.length]}" title="${d.label}:${d.value}"></div><div class="bar-label">${d.label}</div></div>`).join('')}</div>`;
}
// Pie Chart with legend
function pieChart(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let acc=0;const segs=[];
  data.forEach((d,i)=>{const pct=(d.value/total)*100;segs.push(`${d.color||COLORS[i%COLORS.length]} ${acc}% ${acc+pct}%`);acc+=pct;});
  return `<div style="display:flex;gap:20px;align-items:center"><div class="pie-chart" style="background:conic-gradient(${segs.join(',')})"></div><div>${data.map((d,i)=>`<div style="display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px"><span style="width:12px;height:12px;border-radius:3px;background:${d.color||COLORS[i%COLORS.length]}"></span>${d.label}: ${d.value} (${((d.value/total)*100).toFixed(1)}%)</div>`).join('')}</div></div>`;
}
// SVG Line Chart
function lineChart(series,opts={}){
  const w=opts.width||500,h=opts.height||160,pad=30;
  const allVals=series.flatMap(s=>s.data);
  const max=Math.max(...allVals,1),min=Math.min(...allVals,0);
  const n=series[0].data.length;
  const pts=s=>s.data.map((v,i)=>`${pad+(i/(n-1))*(w-pad*2)},${h-pad-((v-min)/(max-min||1))*(h-pad*2)}`).join(' ');
  const grid=[0,0.25,0.5,0.75,1].map(p=>`<line x1="${pad}" y1="${h-pad-p*(h-pad*2)}" x2="${w-pad}" y2="${h-pad-p*(h-pad*2)}" stroke="#e2e8f0" stroke-width="1"/><text x="${pad-4}" y="${h-pad-p*(h-pad*2)+3}" text-anchor="end" font-size="9" fill="#718096">${Math.round(min+p*(max-min))}</text>`).join('');
  return `<div class="line-chart"><svg viewBox="0 0 ${w} ${h}">${grid}${series.map((s,i)=>`<polyline points="${pts(s)}" fill="none" stroke="${s.color||COLORS[i%COLORS.length]}" stroke-width="2"/>${s.data.map((v,j)=>`<circle cx="${pad+(j/(n-1))*(w-pad*2)}" cy="${h-pad-((v-min)/(max-min||1))*(h-pad*2)}" r="3" fill="${s.color||COLORS[i%COLORS.length]}"/>`).join('')}`).join('')}</svg></div>`;
}

function switchTab(tab){
  if(currentWbTab==='cockpit'&&tab!=='cockpit')stopCockpitBoard();
  currentWbTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById('tab-'+tab);
  if(!panel)return;
  panel.classList.add('active');
  renderWbGrids();
  if(tab==='ov')renderDashboard();
  if(tab==='cockpit')renderCockpit();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

const searchInput=document.getElementById('globalSearch');
const searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){searchResults.classList.remove('show');return;}
  const results=[];
  MODULES.forEach(m=>m.skills.forEach(s=>{
    if(s.name.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q)||m.name.toLowerCase().includes(q))
      results.push({mod:m,skill:s});
  }));
  TOOLS.forEach(t=>{if(t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q))results.push({tool:t});});
  searchResults.innerHTML=results.slice(0,12).map(r=>{
    if(r.skill)return `<div class="item" onclick="openSkill('${r.mod.id}','${r.skill.id}');document.getElementById('globalSearch').value='';this.parentElement.classList.remove('show')"><div>${r.skill.name}</div><div class="mod">${r.mod.name}</div></div>`;
    return `<div class="item" onclick="openTool('${r.tool.id}');document.getElementById('globalSearch').value='';this.parentElement.classList.remove('show')"><div>${r.tool.name}</div><div class="mod">平台工具</div></div>`;
  }).join('');
  searchResults.classList.add('show');
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))searchResults.classList.remove('show');});

// ===== S6: 多店铺报表并行拉取 =====
function renderS6(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`
    <div class="flex gap-3 mb-3"><select id="s6Store" style="padding:6px;border:1px solid var(--c-border);border-radius:6px">${getStores().map(s=>`<option>${s.name}</option>`).join('')}</select><select id="s6Type" style="padding:6px;border:1px solid var(--c-border);border-radius:6px"><option>直通车报表</option><option>引力魔方报表</option><option>万相台报表</option></select><button class="btn btn-primary btn-sm" onclick="s6Start()"><i class="fa-solid fa-play"></i> 启动拉取</button></div>
    <div id="s6Tasks"></div>
  `,mb=>s6Render());
}
function s6Render(){const tasks=LS.get('s6tasks',[]);document.getElementById('s6Tasks').innerHTML=(DataAdapter.mode==='real'?'<p class="text-xs text-gray mb-2"><i class="fa-solid fa-circle-check text-green"></i> 真实模式：启动拉取将从万相台获取真实报表数据</p>':'')+(tasks.length?`<table class="data-table"><thead><tr><th>店铺</th><th>报表类型</th><th>进度</th><th>数据行</th><th>状态</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${t.store}</td><td>${t.type}</td><td><div class="progress" style="width:100px"><div class="progress-bar" style="width:${t.progress}%;background:${t.status==='失败'?'var(--c-red)':t.status==='完成'||t.status.indexOf('完成')===0?'var(--c-green)':'var(--c-blue)'}"></div></div></td><td>${t.rows||'-'}</td><td><span class="badge ${t.status==='失败'?'badge-red':t.status.indexOf('完成')===0?'badge-green':'badge-blue'}">${t.status}</span></td></tr>`).join('')}</tbody></table>`:'<p class="text-gray text-sm">暂无任务，点击"启动拉取"开始</p>');}
function s6Start(){
  const store=document.getElementById('s6Store').value;const type=document.getElementById('s6Type').value;
  if(DataAdapter.mode!=='real'){toast('演示模式下为模拟任务，添加授权店铺后可拉取真实报表');}
  const tasks=LS.get('s6tasks',[]);const task={store,type,progress:0,status:'运行中',rows:0};tasks.push(task);LS.set('s6tasks',tasks);s6Render();
  const idx=tasks.length-1;
  const timer=setInterval(()=>{
    task.progress+=Math.random()*25+8;
    if(task.progress>=100){
      task.progress=100;
      // 真实模式：从已缓存的万相台报表写入行数
      task.rows=(DataAdapter.realReports||[]).length;
      task.status=task.rows>0?'完成':(DataAdapter.mode==='real'?'完成(无数据)':'完成');
      clearInterval(timer);
      if(DataAdapter.mode==='real'&&task.rows===0){
        // 缓存为空时实时拉一次
        DataAdapter.refreshRealData().then(()=>{task.rows=(DataAdapter.realReports||[]).length;s6Render();}).catch(()=>{});
      }
    }
    tasks[idx]=task;LS.set('s6tasks',tasks);s6Render();
  },400);
  toast(DataAdapter.mode==='real'?'正在从万相台拉取真实报表...':'模拟拉取任务已启动');
}

function s7Update(){const stores=getCompareStores();const active=[...document.querySelectorAll('#s7Stores .pill.active')].map(p=>stores[parseInt(p.dataset.idx)]);if(!active.length){document.getElementById('s7Dashboard').innerHTML='<p class="text-gray text-sm">请至少选择一个店铺</p>';return;}const tGMV=active.reduce((s,st)=>s+st.gmv,0);const tSpend=active.reduce((s,st)=>s+st.spend,0);const aROI=tSpend>0?(tGMV/tSpend).toFixed(2):'-';const aCTR=(active.reduce((s,st)=>s+st.ctr,0)/active.length).toFixed(2);const realNote=DataAdapter.mode==='real'&&tSpend>0?'<p class="text-xs text-gray mt-2"><i class="fa-solid fa-circle-check text-green"></i> 花费为万相台真实数据（近7天）；GMV/ROI等指标需补申请报表字段权限后显示</p>':'';document.getElementById('s7Dashboard').innerHTML=`${realNote}<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div class="kpi-card"><div class="v text-blue">${tGMV>0?(tGMV/10000).toFixed(1)+'万':'-'}</div><div class="l">总GMV</div></div><div class="kpi-card"><div class="v text-orange">${(tSpend/10000).toFixed(1)}万</div><div class="l">总花费</div></div><div class="kpi-card"><div class="v text-green">${aROI}</div><div class="l">综合ROI</div></div><div class="kpi-card"><div class="v text-purple">${aCTR}%</div><div class="l">平均CTR</div></div></div><div class="mt-4"><h4 class="mb-2">GMV分布</h4>${tGMV>0?barChart(active.map(s=>({label:s.name.slice(0,6),value:s.gmv}))):'<p class="text-xs text-gray">GMV数据待补权限</p>'}</div><div class="mt-4"><h4 class="mb-2">花费占比</h4>${tSpend>0?pieChart(active.map(s=>({label:s.name.slice(0,6),value:s.spend}))):'<p class="text-xs text-gray">暂无数据</p>'}</div>`;}

// ===== S9: 自定义多维度报表 =====
function renderS9(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`
    <div class="grid-2 mb-3"><div><label class="text-sm font-bold mb-2">维度：</label>${['店铺','渠道','计划','日期'].map(d=>`<div class="checkbox-item"><input type="checkbox" class="s9dim" value="${d}" checked><span>${d}</span></div>`).join('')}</div><div><label class="text-sm font-bold mb-2">指标：</label>${['花费','GMV','ROI','CTR','CVR','点击','展现'].map(m=>`<div class="checkbox-item"><input type="checkbox" class="s9metric" value="${m}" ${['花费','GMV','ROI'].includes(m)?'checked':''}><span>${m}</span></div>`).join('')}</div></div>
    <button class="btn btn-primary btn-sm" onclick="s9Gen()"><i class="fa-solid fa-table"></i> 生成报表</button> <button class="btn btn-secondary btn-sm" onclick="s9Export()"><i class="fa-solid fa-download"></i> 导出CSV</button>
    <div id="s9Result" class="mt-3"></div>
  `,mb=>{});
}
function s9Gen(){const dims=[...document.querySelectorAll('.s9dim:checked')].map(c=>c.value);const metrics=[...document.querySelectorAll('.s9metric:checked')].map(c=>c.value);if(!dims.length||!metrics.length){toast('请选择维度和指标');return;}const stores=getStores().slice(0,6);const channels=['直通车','引力魔方','万相台'];let rows=[];stores.forEach(s=>{channels.forEach(ch=>{if(dims.includes('日期')){['2025-06-01','2025-06-02','2025-06-03'].forEach(d=>{rows.push(genRow9(s,ch,d,dims,metrics));});}else{rows.push(genRow9(s,ch,'',dims,metrics));}});});let html=`<table class="data-table"><thead><tr>${dims.map(d=>`<th>${d}</th>`).join('')}${metrics.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>`;html+=rows.map(r=>`<tr>${dims.map(d=>`<td>${r[d]}</td>`).join('')}${metrics.map(m=>`<td>${r[m]}</td>`).join('')}</tr>`).join('')+'</tbody></table>';document.getElementById('s9Result').innerHTML=html;LS.set('s9rows',{dims,metrics,rows});}
function genRow9(s,ch,d,dims,metrics){const row={};dims.forEach(dim=>{if(dim==='店铺')row[dim]=s.name;if(dim==='渠道')row[dim]=ch;if(dim==='计划')row[dim]=ch+'-计划'+Math.ceil(Math.random()*3);if(dim==='日期')row[dim]=d||'2025-06-01';});metrics.forEach(m=>{if(m==='花费')row[m]=Math.round(s.spend/3+Math.random()*5000);if(m==='GMV')row[m]=Math.round(s.gmv/3+Math.random()*15000);if(m==='ROI')row[m]=(s.roi+Math.random()-0.5).toFixed(2);if(m==='CTR')row[m]=(s.ctr+Math.random()-0.5).toFixed(2)+'%';if(m==='CVR')row[m]=(s.cvr+Math.random()-0.5).toFixed(2)+'%';if(m==='点击')row[m]=Math.round(5000+Math.random()*8000);if(m==='展现')row[m]=Math.round(80000+Math.random()*100000);});return row;}
function s9Export(){const data=LS.get('s9rows',null);if(!data){toast('请先生成报表');return;}exportCSV('自定义报表.csv',[data.dims.concat(data.metrics),...data.rows.map(r=>data.dims.concat(data.metrics).map(c=>r[c]))]);toast('已导出');}

    <div class="mb-3"><label class="text-sm font-bold mb-2">归因模型：</label><div id="s11Models" class="flex gap-2">${['首次点击','末次点击','线性','时间衰减'].map((m,i)=>`<span class="pill ${i===0?'active':''}" onclick="s11Model(this)">${m}</span>`).join('')}</div></div>
    <div class="mb-3"><label class="text-sm font-bold mb-2">触点路径 (用 → 分隔)：</label><textarea id="s11Path" style="width:100%;padding:8px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;font-family:inherit">旗舰店-美妆官方 → 旗舰店-个护品牌 → 旗舰店-家电官方 → 旗舰店-美妆官方</textarea><button class="btn btn-primary btn-sm mt-2" onclick="s11Calc()">计算归因</button></div>
    <div id="s11Result"></div>
  `,mb=>{});
}
function s11Model(el){[...el.parentElement.querySelectorAll('.pill')].forEach(p=>p.classList.remove('active'));el.classList.add('active');}
function s11Calc(){const model=document.querySelector('#s11Models .pill.active')?.textContent||'首次点击';const path=document.getElementById('s11Path').value.split('→').map(s=>s.trim()).filter(s=>s);if(path.length<2){toast('请输入至少2个触点');return;}const stores=[...new Set(path)];const weights={};stores.forEach(s=>weights[s]=0);if(model==='首次点击')weights[path[0]]=100;else if(model==='末次点击')weights[path[path.length-1]]=100;else if(model==='线性')path.forEach(p=>weights[p]+=100/path.length);else if(model==='时间衰减'){const total=path.reduce((s,_,i)=>s+Math.pow(0.5,i),0);path.forEach((p,i)=>weights[p]+=(Math.pow(0.5,i)/total)*100);}const data=stores.map(s=>({label:s.slice(0,6),value:Math.round(weights[s])}));document.getElementById('s11Result').innerHTML=`<div class="result-box"><h4 class="mb-2">${model}归因结果</h4>${pieChart(data)}<table class="data-table mt-3"><thead><tr><th>店铺</th><th>ROI贡献(%)</th></tr></thead><tbody>${data.map(d=>`<tr><td>${d.label}</td><td>${d.value}%</td></tr>`).join('')}</tbody></table></div>`;}

  `,mb=>{s12Render();skillRuleRender('s12');});

function s12Render(){
  const store=getStores()[document.getElementById('s12Store').selectedIndex];
  // 真实数据优先：万相台计划列表 + 报表花费
  if(DataAdapter.realCampaigns&&DataAdapter.realCampaigns.length){
    const repMap={};(DataAdapter.realReports||[]).forEach(r=>{if(r.campaign)repMap[r.campaign]={cost:r.cost,roi:r.roi,clicks:r.clicks,imp:r.impressions};});
    const toggles=LS.get('s12real_'+(currentStore()||'demo'),{});
    const plans=DataAdapter.realCampaigns.map(c=>{
      const off=toggles[c['计划名称']]===false;
      const rep=repMap[c['计划名称']]||{};
      return {name:c['计划名称'],id:c['计划ID'],on:!off&&c['状态'].indexOf('停')<0,

// ---------- 真实写回万相台（计划状态 pause/start） ----------
async function tmallUpdateStatus(campaignId,status,campaignName){
  try{
    const d=await DataAdapter.proxy('taobao.universalbp.new.campaign.updatepart',{
      campaign_update_part_list_v_o:JSON.stringify({campaign_list:[{campaign_id:campaignId,display_status:status}]})
    });
    const s=JSON.stringify(d);
    if(s.indexOf('updatepart_response')>=0&&(s.indexOf('"ok":true')>=0||s.indexOf('"error_count":0')>=0)){
      return true;
    }
    const msg=(s.match(/"message":"([^"]+)"/)||[])[1]||(s.match(/"msg":"([^"]+)"/)||[])[1]||'未知错误';
    toast('❌ 状态写回失败：'+msg);
    return false;
  }catch(e){
    toast('❌ 状态写回异常：'+e.message);
    return false;
  }
}

async function tmallUpdateBudget(campaignId,newBudget,campaignName){

async function s12SetBudget(campaignId,val,campaignName){

// 真实写回关键词出价（bidword.update，bidword_list必须数组）
async function tmallUpdateBidword(kw,newBid){
  try{
    const d=await DataAdapter.proxy('taobao.universalbp.new.bidword.update',{
      word_update_request_v_o:JSON.stringify({bidword_list:[{bidword_id:kw.bidword_id,campaign_id:kw.campaign_id,adgroup_id:kw.adgroup_id,word:kw['关键词'],bid_price:String(newBid)}]})
    });
    const s=JSON.stringify(d);
    if(s.indexOf('bidword_update_response')>=0&&(s.indexOf('"ok":true')>=0||s.indexOf('"error_count":0')>=0))return true;
    const msg=(s.match(/"message":"([^"]+)"/)||[])[1]||(s.match(/"msg":"([^"]+)"/)||[])[1]||'未知错误';
    toast('❌ 改价写回失败：'+msg);return false;
  }catch(e){toast('❌ 改价异常：'+e.message);return false;}
}
async function s21SetBid(ki,val){
  const newBid=parseFloat(val);
  if(!newBid||newBid<0.05){toast('出价最低0.05元');return;}
  const kw=DataAdapter.realKeywords[ki];if(!kw)return;
  const wb=LS.get('writeback_'+(currentStore()||'demo'),false);
  if(!wb){toast('仅本地记录（真实写回未开启）：「'+kw['关键词']+'」→¥'+newBid);return;}
  toast('正在写回万相台改价...');
  const ok=await tmallUpdateBidword(kw,newBid);
  if(ok){toast('✅ 「'+kw['关键词']+'」出价已真实改为¥'+newBid);DataAdapter.fetchKeywords().then(()=>s21Tab(0)).catch(()=>{});}
}

function s40Render(){const window=parseInt(document.getElementById('s40Window').value)||5;const raw=[{store:'美妆官方',msg:'ROI下降',t:1},{store:'美妆官方',msg:'ROI下降',t:2},{store:'美妆官方',msg:'ROI下降',t:3},{store:'个护品牌',msg:'花费超标',t:2},{store:'个护品牌',msg:'花费超标',t:4},{store:'美妆官方',msg:'ROI下降',t:6},{store:'家电官方',msg:'排名丢失',t:3},{store:'家电官方',msg:'排名丢失',t:5},{store:'母婴官方',msg:'CTR低',t:1},{store:'母婴官方',msg:'CTR低',t:7},{store:'数码优选',msg:'API额度低',t:4},{store:'数码优选',msg:'API额度低',t:5}];document.getElementById('s40Raw').innerHTML=raw.map(r=>`<div class="text-xs" style="padding:4px 0;border-bottom:1px solid var(--c-border)"><span class="badge badge-gray">${r.t}分</span> ${r.store} - ${r.msg}</div>`).join('');const groups={};raw.forEach(r=>{const key=r.store+'|'+r.msg;if(!groups[key])groups[key]={store:r.store,msg:r.msg,count:0,first:r.t,last:r.t};groups[key].count++;groups[key].last=Math.max(groups[key].last,r.t);});const aggregated=Object.values(groups).filter(g=>g.last-g.first<=window);const deduped=Object.values(groups);document.getElementById('s40Agg').innerHTML=deduped.map(g=>`<div class="result-box mb-2"><div class="flex justify-between"><span class="text-sm font-bold">${g.store} - ${g.msg}</span>${g.count>1?`<span class="badge badge-purple">聚合${g.count}条</span>`:'<span class="badge badge-gray">单条</span>'}</div><div class="text-xs text-gray mt-1">首次: ${g.first}分钟前 | 最后: ${g.last}分钟前</div></div>`).join('')+'<div class="result-box mt-2"><p class="text-sm text-green"><i class="fa-solid fa-check"></i> 去重率: '+Math.round((1-deduped.length/raw.length)*100)+'% ('+raw.length+'条→'+deduped.length+'条)</p></div>';}

function s42Calc(){const budget=parseInt(document.getElementById('s42Budget').value);const stores=getCompareStores().slice(0,6);const totalROI=stores.reduce((s,st)=>s+st.roi,0);const totalGrowth=stores.reduce((s,st)=>s+st.roi*1.2,0);let before=[],after=[];const beforeTotal=budget;stores.forEach(s=>{const bShare=Math.round(budget/s.length);before.push({label:s.name.slice(0,6)+'(原)',value:bShare,color:'#94a3b8'});const aShare=Math.round(budget*(s.roi*1.2/totalGrowth));after.push({label:s.name.slice(0,6)+'(AI)',value:aShare,color:'var(--c-primary)'});});document.getElementById('s42Result').innerHTML=`<div class="grid-2"><div><h4 class="mb-2">原均分方案</h4>${pieChart(before)}</div><div><h4 class="mb-2">AI优化方案</h4>${pieChart(after)}</div></div><table class="data-table mt-3"><thead><tr><th>店铺</th><th>ROI</th><th>原分配</th><th>AI分配</th><th>变化</th></tr></thead><tbody>${stores.map((s,i)=>{const b=Math.round(budget/stores.length);const a=Math.round(budget*(s.roi*1.2/totalGrowth));const diff=a-b;return `<tr><td>${s.name}</td><td>${s.roi}</td><td>¥${b.toLocaleString()}</td><td>¥${a.toLocaleString()}</td><td class="${diff>0?'text-green':'text-red'}">${diff>0?'+':''}¥${diff.toLocaleString()}</td></tr>`;}).join('')}</tbody></table><div class="result-box mt-3"><p class="text-sm"><i class="fa-solid fa-lightbulb text-orange"></i> AI将更多预算分配给高ROI店铺，预计总GMV提升${Math.round(Math.random()*15+10)}%。</p></div>`;}

// ===== S46: 跨店AB测试框架 =====
function renderS46(mod,skill){
  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="result-box mb-3"><h4 class="mb-2">实验配置</h4><div class="grid-2"><div class="form-group"><label>测试店铺</label><input id="s46Test" value="旗舰店-美妆官方,专卖店-护肤优选" style="width:100%;padding:6px;border:1px solid var(--c-border);border-radius:6px"></div><div class="form-group"><label>对照店铺</label><input id="s46Ctrl" value="旗舰店-个护品牌,专营店-彩妆集合" style="width:100%;padding:6px;border:1px solid var(--c-border);border-radius:6px"></div></div><div class="form-group"><label>测试指标</label><select id="s46Metric" style="padding:6px;border:1px solid var(--c-border);border-radius:6px"><option>ROI</option><option>CTR</option><option>CVR</option><option>GMV</option></select></div><button class="btn btn-primary btn-sm" onclick="s46Calc()">计算显著性</button></div><div id="s46Result"></div>`,mb=>{});
}
function s46Calc(){const metric=document.getElementById('s46Metric').value;const testN=20000;const ctrlN=20000;const testRate=Math.random()*0.05+0.03;const ctrlRate=Math.random()*0.04+0.02;const testConv=Math.round(testN*testRate);const ctrlConv=Math.round(ctrlN*ctrlRate);const pooledRate=(testConv+ctrlConv)/(testN+ctrlN);const se=Math.sqrt(pooledRate*(1-pooledRate)*(1/testN+1/ctrlN));const z=(testRate-ctrlRate)/se;const significant=Math.abs(z)>1.96;const pValue=2*(1-normalCDF(Math.abs(z)));document.getElementById('s46Result').innerHTML=`<table class="data-table"><thead><tr><th>指标</th><th>测试组</th><th>对照组</th></tr></thead><tbody><tr><td>样本量</td><td>${testN.toLocaleString()}</td><td>${ctrlN.toLocaleString()}</td></tr><tr><td>${metric}</td><td>${(testRate*100).toFixed(2)}%</td><td>${(ctrlRate*100).toFixed(2)}%</td></tr><tr><td>转化数</td><td>${testConv.toLocaleString()}</td><td>${ctrlConv.toLocaleString()}</td></tr></tbody></table><div class="result-box mt-3"><div class="grid-3"><div class="kpi-card"><div class="v">${z.toFixed(2)}</div><div class="l">Z值</div></div><div class="kpi-card"><div class="v">${pValue.toFixed(4)}</div><div class="l">P值</div></div><div class="kpi-card"><div class="v ${significant?'text-green':'text-orange'}">${significant?'显著':'不显著'}</div><div class="l">结论(95%置信)</div></div></div><p class="text-sm mt-2">${significant?'<i class="fa-solid fa-check text-green"></i> 测试组'+metric+'显著'+(testRate>ctrlRate?'高于':'低于')+'对照组，建议'+(testRate>ctrlRate?'推广测试方案':'放弃测试方案')+'。':'<i class="fa-solid fa-clock text-orange"></i> 差异不显著，建议增加样本量或延长测试周期。'}</p></div>`;}
function normalCDF(x){return 0.5*(1+erf(x/Math.SQRT2));}
function erf(x){const t=1/(1+0.3275911*Math.abs(x));const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y;}

  openModal(skill.name,`<i class="fa-solid ${skill.icon}"></i>`,mod.color,`<div class="result-box mb-3"><div class="grid-2"><div class="form-group"><label>开始日期</label><input id="s47Start" type="date" value="2025-06-01" style="padding:6px;border:1px solid var(--c-border);border-radius:6px"></div><div class="form-group"><label>结束日期</label><input id="s47End" type="date" value="2025-06-30" style="padding:6px;border:1px solid var(--c-border);border-radius:6px"></div></div><button class="btn btn-primary btn-sm" onclick="s47Gen()"><i class="fa-solid fa-file-lines"></i> 生成报告</button> <button class="btn btn-secondary btn-sm" onclick="s47Export()"><i class="fa-solid fa-download"></i> 导出CSV</button></div><div id="s47Result"></div>`,mb=>{});

function s47Gen(){const stores=getCompareStores();const tGMV=stores.reduce((s,st)=>s+st.gmv,0);const tSpend=stores.reduce((s,st)=>s+st.spend,0);const tROI=(tGMV/tSpend).toFixed(2);document.getElementById('s47Result').innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div class="kpi-card"><div class="v text-blue">${(tGMV/10000).toFixed(1)}万</div><div class="l">总GMV</div></div><div class="kpi-card"><div class="v text-orange">${(tSpend/10000).toFixed(1)}万</div><div class="l">总花费</div></div><div class="kpi-card"><div class="v text-green">${tROI}</div><div class="l">综合ROI</div></div><div class="kpi-card"><div class="v text-purple">${stores.length}</div><div class="l">店铺数</div></div></div><div class="mt-4"><h4 class="mb-2">GMV趋势</h4>${lineChart([{name:'GMV',data:stores.slice(0,6).map(s=>s.gmv),color:'#667eea'},{name:'花费',data:stores.slice(0,6).map(s=>s.spend),color:'#f59e0b'}])}</div><table class="data-table mt-3"><thead><tr><th>店铺</th><th>GMV</th><th>花费</th><th>ROI</th><th>CTR</th><th>CVR</th></tr></thead><tbody>${stores.map(s=>`<tr><td>${s.name}</td><td>¥${s.gmv.toLocaleString()}</td><td>¥${s.spend.toLocaleString()}</td><td>${s.roi}</td><td>${s.ctr}%</td><td>${s.cvr}%</td></tr>`).join('')}</tbody></table>`;LS.set('s47data',stores);}
function s47Export(){const stores=LS.get('s47data',getStores());exportCSV('多店铺汇总报告.csv',[['店铺','GMV','花费','ROI','CTR','CVR'],...stores.map(s=>[s.name,s.gmv,s.spend,s.roi,s.ctr,s.cvr])]);toast('已导出');}

function renderT2(tool){
  const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);

    <div id="t2Result" class="mt-3"></div>

function t2Calc(){
  const total=parseInt(document.getElementById('t2Total').value)||0;
  const stores=getStores().filter(s=>s.status!=='已过期').slice(0,6);
  const weights=stores.map((s,i)=>parseInt(document.getElementById('t2w'+i).value)||0);
  const sum=weights.reduce((a,b)=>a+b,0)||1;
  stores.forEach((s,i)=>{document.getElementById('t2v'+i).textContent=weights[i];});
  const alloc=weights.map(w=>Math.round(total*w/sum));
  document.getElementById('t2Result').innerHTML=`<table class="data-table"><thead><tr><th>店铺</th><th>权重</th><th>分配金额</th><th>占比</th></tr></thead><tbody>${stores.map((s,i)=>`<tr><td>${s.name}</td><td>${weights[i]}</td><td>¥${alloc[i].toLocaleString()}</td><td>${(weights[i]/sum*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>${pieChart(stores.map((s,i)=>({label:s.name.slice(0,6),value:alloc[i]})))}`;

// ===== T3: A/B测试计算器 =====
function renderT3(tool){
  openModal(tool.name,`<i class="fa-solid ${tool.icon}"></i>`,tool.color,`
    <div class="grid-2 mb-3">
      <div class="result-box"><h4>A组</h4><div class="form-group"><label>展现量</label><input id="t3aImp" type="number" value="12000" oninput="t3Calc()"></div><div class="form-group"><label>点击量</label><input id="t3aClick" type="number" value="480" oninput="t3Calc()"></div></div>
      <div class="result-box"><h4>B组</h4><div class="form-group"><label>展现量</label><input id="t3bImp" type="number" value="12000" oninput="t3Calc()"></div><div class="form-group"><label>点击量</label><input id="t3bClick" type="number" value="612" oninput="t3Calc()"></div></div>
    </div>
    <div id="t3Result"></div>
  `,mb=>t3Calc());
}
function t3Calc(){
  const aImp=parseInt(document.getElementById('t3aImp').value)||0;
  const aClick=parseInt(document.getElementById('t3aClick').value)||0;
  const bImp=parseInt(document.getElementById('t3bImp').value)||0;
  const bClick=parseInt(document.getElementById('t3bClick').value)||0;
  const aCTR=aImp>0?aClick/aImp:0;const bCTR=bImp>0?bClick/bImp:0;
  const pooledCTR=(aClick+bClick)/(aImp+bImp)||0;
  const se=Math.sqrt(pooledCTR*(1-pooledCTR)*(1/(aImp||1)+1/(bImp||1)));
  const z=se>0?Math.abs(bCTR-aCTR)/se:0;
  const pValue=2*(1-normalCDF(z));
  const significant=z>1.96;
  document.getElementById('t3Result').innerHTML=`
    <table class="data-table"><thead><tr><th>指标</th><th>A组</th><th>B组</th></tr></thead><tbody>
    <tr><td>CTR</td><td><strong>${(aCTR*100).toFixed(2)}%</strong></td><td><strong>${(bCTR*100).toFixed(2)}%</strong></td></tr>
    <tr><td>点击量</td><td>${aClick}</td><td>${bClick}</td></tr>
    <tr><td>CTR差异</td><td colspan="2">${((bCTR-aCTR)*100).toFixed(2)}pp</td></tr>
    </tbody></table>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">
      <div class="kpi-card"><div class="v">${z.toFixed(2)}</div><div class="l">Z值</div></div>
      <div class="kpi-card"><div class="v">${pValue.toFixed(4)}</div><div class="l">P值</div></div>
      <div class="kpi-card"><div class="v ${significant?'text-green':'text-orange'}">${significant?'显著':'不显著'}</div><div class="l">95%置信</div></div>
    </div>

function genExpRow(s,ch,d,dims,metrics){const row={};dims.forEach(dim=>{if(dim==='店铺')row[dim]=s.name;if(dim==='渠道')row[dim]=ch;if(dim==='日期')row[dim]=d||'2025-06-01';if(dim==='计划')row[dim]=ch+'-计划'+Math.ceil(Math.random()*3);});metrics.forEach(m=>{if(m==='花费')row[m]=Math.round(s.spend/3+Math.random()*2000);if(m==='GMV')row[m]=Math.round(s.gmv/3+Math.random()*8000);if(m==='ROI')row[m]=(s.roi+(Math.random()-0.5)).toFixed(2);if(m==='CTR')row[m]=(s.ctr+(Math.random()-0.5)).toFixed(2)+'%';if(m==='CVR')row[m]=(s.cvr+(Math.random()-0.5)).toFixed(2)+'%';if(m==='点击')row[m]=Math.round(3000+Math.random()*5000);if(m==='展现')row[m]=Math.round(60000+Math.random()*80000);});return row;}

        <div class="di-dropzone" id="diDropzone">
          <div class="dz-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
          <div class="dz-text">支持拖拽Excel/CSV文件到此处</div>
          <div class="dz-hint">支持格式：.xlsx / .xls / .csv（仅本地解析，不上传服务器）</div>
        </div>
        <input type="file" id="diFileInput" accept=".xlsx,.xls,.csv" style="display:none">
        <div id="diFileInfo" class="mt-2"></div>
        <div id="diPreviewWrap" class="mt-3" style="display:none">
          <h4 class="mb-2">数据预览（前10行）</h4>
          <table class="di-preview-table" id="diPreviewTable"></table>
        </div>
      </div>
      <!-- B. 数据类型选择 -->
      <div class="di-section">
        <h4><i class="fa-solid fa-list-check"></i> 数据类型选择</h4>
        <div class="di-type-grid" id="diTypeGrid">
          ${DATA_TYPES.map(t=>`<div class="di-type-card ${t.key===this.state.dataType?'active':''}" onclick="DataImport.selectType('${t.key}')">
            <div>${t.label}</div>
            <div class="dt-cols">${t.cols.length?t.cols.join('、'):'自动识别列'}</div>
          </div>`).join('')}
        </div>
      </div>
      <!-- C. 店铺关联 -->
      <div class="di-section">
        <h4><i class="fa-solid fa-store"></i> 店铺关联</h4>
        <div class="flex gap-2 items-center">
          <select id="diStoreSelect" style="flex:1;padding:6px 12px;border:1px solid var(--c-border);border-radius:6px;font-size:13px">
            ${stores.map(s=>`<option value="${this._esc(s)}" ${s===this.state.storeName?'selected':''}>${this._esc(s)}</option>`).join('')}
          </select>
          <button class="btn btn-sm btn-secondary" onclick="DataImport.addNewStore()"><i class="fa-solid fa-plus"></i> 新建店铺</button>
        </div>
      </div>
      <!-- D. 数据预览与映射 -->
      <div class="di-section" id="diMappingSection" style="display:none">
        <h4><i class="fa-solid fa-arrows-left-right"></i> 数据预览与映射</h4>
        <p class="text-xs text-gray mb-2">系统已根据表头自动匹配字段，可手动调整右侧映射。</p>
        <table class="di-mapping-table" id="diMappingTable">
          <thead><tr><th>文件表头</th><th>→ 标准字段</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <!-- E. 导入执行 -->
      <div class="di-section" id="diExecSection" style="display:none">
        <div class="flex gap-2">
          <button class="btn btn-success" onclick="DataImport.doImport()"><i class="fa-solid fa-check"></i> 确认导入</button>
          <button class="btn btn-secondary" onclick="DataImport.openModal()"><i class="fa-solid fa-rotate"></i> 重置</button>
        </div>
        <div id="diImportResult" class="mt-3"></div>
      </div>
      <!-- F. 导入历史 -->
      <div class="di-section">
        <h4><i class="fa-solid fa-clock-rotate-left"></i> 导入历史</h4>
        <div id="diHistoryList"></div>
      </div>
    `,mb=>this.onMount(mb));
  },
  onMount(mb){
    // 文件拖拽
    const dz=mb.querySelector('#diDropzone');
    const fi=mb.querySelector('#diFileInput');
    dz.addEventListener('click',()=>fi.click());
    fi.addEventListener('change',e=>{if(e.target.files[0])this.handleFile(e.target.files[0]);});
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('dragover');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('dragover');}));
    dz.addEventListener('drop',e=>{if(e.dataTransfer.files[0])this.handleFile(e.dataTransfer.files[0]);});
    // 店铺选择
    mb.querySelector('#diStoreSelect').addEventListener('change',e=>{this.state.storeName=e.target.value;});
    this.renderHistory();
  },
  selectType(key){
    this.state.dataType=key;
    document.querySelectorAll('#diTypeGrid .di-type-card').forEach(c=>c.classList.remove('active'));
    event.target.closest('.di-type-card').classList.add('active');
    this.autoMapColumns();
    this.renderMapping();
  },
  addNewStore(){
    const name=prompt('请输入新店铺名称');
    if(!name)return;
    const stores=this._getStoreList();
    if(!stores.includes(name))stores.push(name);
    // 写入种子存储
    const seed=LS.get('stores',STORE_SEED);
    if(!seed.find(s=>s.name===name)){
      seed.push({name,status:'已授权(导入)',expire:'长期',quota:8000,quotaMax:10000,roi:2.5,gmv:0,spend:0,ctr:3.5,cvr:2.5,health:75,imported:true});
      saveStores(seed);
    }
    this.state.storeName=name;
    const sel=document.getElementById('diStoreSelect');
    if(sel){
      const opt=document.createElement('option');
      opt.value=name;opt.textContent=name;opt.selected=true;
      sel.appendChild(opt);
    }
    toast('新店铺已添加：'+name);
  },
  async handleFile(file){
    if(!window.XLSX){toast('xlsx库未加载，请检查网络');return;}
    this.state.file=file;
    document.getElementById('diFileInfo').innerHTML=`<div class="result-box"><p class="text-sm"><i class="fa-solid fa-file-excel text-green"></i> <strong>${this._esc(file.name)}</strong> (${(file.size/1024).toFixed(1)} KB)</p><p class="text-xs text-gray mt-1">正在解析...</p></div>`;
    try{
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data,{type:'array'});
      this.state.workbook=wb;
      const wsName=wb.SheetNames[0];
      const ws=wb.Sheets[wsName];
      const json=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!json.length){
        document.getElementById('diFileInfo').innerHTML='<div class="result-box"><p class="text-sm text-red">文件中没有数据行</p></div>';
        return;
      }
      this.state.headers=Object.keys(json[0]);
      this.state.rows=json;
      this.state.previewRows=json.slice(0,10);
      // 渲染预览
      this.renderPreview();
      // 自动匹配类型
      this.guessDataType();
      // 自动映射列
      this.autoMapColumns();
      this.renderMapping();
      document.getElementById('diFileInfo').innerHTML=`<div class="result-box"><p class="text-sm"><i class="fa-solid fa-file-excel text-green"></i> <strong>${this._esc(file.name)}</strong> (${(file.size/1024).toFixed(1)} KB)</p><p class="text-sm mt-1 text-green">解析成功：${json.length} 行数据，${this.state.headers.length} 列</p></div>`;
      document.getElementById('diMappingSection').style.display='block';
      document.getElementById('diExecSection').style.display='block';
    }catch(e){
      document.getElementById('diFileInfo').innerHTML=`<div class="result-box"><p class="text-sm text-red">解析失败：${this._esc(e.message)}</p></div>`;
    }
  },
  renderPreview(){
    if(!this.state.previewRows.length){document.getElementById('diPreviewWrap').style.display='none';return;}
    document.getElementById('diPreviewWrap').style.display='block';
    const hdrs=this.state.headers;
    let html='<thead><tr>'+hdrs.map(h=>`<th>${this._esc(h)}</th>`).join('')+'</tr></thead><tbody>';
    this.state.previewRows.forEach(r=>{html+='<tr>'+hdrs.map(h=>`<td>${this._esc(r[h])}</td>`).join('')+'</tr>';});
    html+='</tbody>';
    document.getElementById('diPreviewTable').innerHTML=html;
  },
  guessDataType(){
    const hdrs=this.state.headers.map(h=>h.toLowerCase());
    const hasAll=(cols)=>cols.every(c=>hdrs.some(h=>h.includes(c.toLowerCase().slice(0,2))));
    // 简单猜测
    if(hasAll(['计划名称','展现量','花费']))this.state.dataType='campaign_report';
    else if(hasAll(['关键词','出价']))this.state.dataType='keyword_report';
    else if(hasAll(['人群名称','展现量']))this.state.dataType='audience_report';
    else if(hasAll(['创意标题','创意类型']))this.state.dataType='creative_report';
    else if(hasAll(['访客数','支付金额']))this.state.dataType='sycm_overview';
    else if(hasAll(['商品名称','支付件数']))this.state.dataType='sycm_product';
    else this.state.dataType='custom';
    // 更新UI选中状态
    document.querySelectorAll('#diTypeGrid .di-type-card').forEach(c=>{
      c.classList.toggle('active',c.textContent.includes(DATA_TYPES.find(t=>t.key===this.state.dataType)?.label||''));
    });
  },
  autoMapColumns(){
    const dt=this._getDataType(this.state.dataType);
    const standardCols=dt.cols;
    this.state.mapping={};
    this.state.headers.forEach(h=>{
      const hl=h.toLowerCase();
      let best=null;
      standardCols.forEach(sc=>{
        const sl=sc.toLowerCase();
        // 模糊匹配：包含或相似
        if(hl.includes(sl)||sl.includes(hl)){
          best=sc;
        }else if(!best&&hl.slice(0,2)===sl.slice(0,2)){
          best=sc;
        }
      });
      this.state.mapping[h]=best||'';
    });
  },
  renderMapping(){
    if(!this.state.headers.length){document.getElementById('diMappingSection').style.display='none';return;}
    document.getElementById('diMappingSection').style.display='block';
    const dt=this._getDataType(this.state.dataType);
    const stdCols=dt.cols.length?dt.cols:this.state.headers;
    const tb=document.querySelector('#diMappingTable tbody');
    tb.innerHTML=this.state.headers.map(h=>`<tr>
      <td><strong>${this._esc(h)}</strong></td>
      <td><select onchange="DataImport.updateMapping('${this._esc(h)}',this.value)">
        <option value="">（不映射）</option>
        ${stdCols.map(sc=>`<option value="${this._esc(sc)}" ${sc===this.state.mapping[h]?'selected':''}>${this._esc(sc)}</option>`).join('')}
      </select></td>
    </tr>`).join('');
  },
  updateMapping(header,val){this.state.mapping[header]=val;},
  doImport(){
    if(!this.state.rows.length){toast('请先上传文件');return;}
    if(!this.state.storeName){toast('请选择店铺');return;}
    if(!this.state.dataType){toast('请选择数据类型');return;}
    // 构建映射后的rows
    const mapped=this.state.rows.map(r=>{
      const obj={};
      this.state.headers.forEach(h=>{
        const target=this.state.mapping[h];
        if(target)obj[target]=r[h];
      });
      return obj;
    });
    const dt=this._getDataType(this.state.dataType);
    const key='tmall_imported_data_'+this.state.storeName+'_'+this.state.dataType;
    const record={
      storeName:this.state.storeName,
      dataType:this.state.dataType,
      dataTypeLabel:dt.label,
      fileName:this.state.file?this.state.file.name:'未知',
      headers:this.state.headers,
      mapping:this.state.mapping,
      rows:mapped,
      rowCount:mapped.length,
      importedAt:new Date().toISOString()
    };
    try{
      localStorage.setItem(key,JSON.stringify(record));
    }catch(e){
      toast('存储失败（数据可能过大）：'+e.message);
      return;
    }
    // 更新 DataAdapter 缓存
    DataAdapter.scanImportedData();
    // 如果是新店铺且不在种子列表，追加
    const seed=LS.get('stores',STORE_SEED);
    if(!seed.find(s=>s.name===this.state.storeName)){
      seed.push({name:this.state.storeName,status:'已授权(导入)',expire:'长期',quota:8000,quotaMax:10000,roi:2.5,gmv:0,spend:0,ctr:3.5,cvr:2.5,health:75,imported:true});
      saveStores(seed);
    }
    // 更新平台数据结构
    this.mergeIntoPlatform(this.state.storeName,this.state.dataType,mapped);
    // 更新UI
    AuthUI.renderTopbar();
    AuthUI.renderStatusPill();
    renderOverview();
    // 成功结果
    this.renderImportResult(record,mapped);
    this.renderHistory();
    toast('导入成功：'+mapped.length+'行');
  },
  mergeIntoPlatform(storeName,dataType,rows){
    // 将导入数据合并到平台现有数据结构
    if(dataType==='keyword_report'){
      // 合并到关键词库
      const kws=getKeywords();
      rows.forEach(r=>{
        const word=r.关键词||r.word||'';
        if(word&&!kws.find(k=>k.word===word)){
          kws.push({word,cat:'导入',brand:storeName,volume:+(r.展现量||0)||0,comp:50,status:'启用'});
        }
      });
      saveKeywords(kws);
    }
    // 其他数据类型通过 DataAdapter.getImportedData 即时读取，无需额外合并
  },
  renderImportResult(record,mapped){
    // 统计
    let dateRange='-';
    const dates=mapped.map(r=>r.日期||r.date).filter(Boolean);
    if(dates.length){const sorted=[...dates].sort();dateRange=sorted[0]+' ~ '+sorted[sorted.length-1];}
    // 关键指标求和
    const sumField=(f)=>mapped.reduce((t,r)=>t+(+r[f]||0),0);
    const totalCost=sumField('花费')||sumField('cost')||0;
    const totalGMV=sumField('GMV')||sumField('gmv')||0;
    const totalClicks=sumField('点击量')||sumField('clicks')||0;
    const totalImp=sumField('展现量')||sumField('impressions')||0;
    const roi=totalCost>0?(totalGMV/totalCost).toFixed(2):'-';
    const ctr=totalImp>0?(totalClicks/totalImp*100).toFixed(2)+'%':'-';
    document.getElementById('diImportResult').innerHTML=`<div class="result-box" style="border:2px solid var(--c-green)">
      <h4 style="color:var(--c-green)"><i class="fa-solid fa-circle-check"></i> 导入成功</h4>
      <p class="text-sm mt-2">已导入 <strong>${record.rowCount}</strong> 行 ${this._esc(record.dataTypeLabel)} 数据到店铺 <strong>${this._esc(record.storeName)}</strong></p>
      <div class="di-summary">
        <div class="ds-card"><div class="v text-blue">${record.rowCount}</div><div class="l">总行数</div></div>
        <div class="ds-card"><div class="v">${dateRange.split(' ~ ')[0]}</div><div class="l">起始日期</div></div>
        <div class="ds-card"><div class="v">${dateRange.split(' ~ ')[1]||'-'}</div><div class="l">结束日期</div></div>
        <div class="ds-card"><div class="v text-orange">¥${totalCost.toLocaleString()}</div><div class="l">总花费</div></div>
        <div class="ds-card"><div class="v text-green">¥${totalGMV.toLocaleString()}</div><div class="l">总GMV</div></div>
        <div class="ds-card"><div class="v text-purple">${roi}</div><div class="l">ROI</div></div>
        <div class="ds-card"><div class="v">${ctr}</div><div class="l">CTR</div></div>
      </div>
    </div>`;
  },
  renderHistory(){
    const list=document.getElementById('diHistoryList');
    if(!list)return;
    const entries=[];
    try{
      for(let i=0;i<localStorage.length;i++){
        const key=localStorage.key(i);
        if(key&&key.indexOf('tmall_imported_data_')===0){
          const val=JSON.parse(localStorage.getItem(key));
          if(val)entries.push({key,val});
        }
      }
    }catch(e){}
    entries.sort((a,b)=>(b.val.importedAt||'').localeCompare(a.val.importedAt||''));
    if(!entries.length){list.innerHTML='<p class="text-gray text-sm">暂无导入记录</p>';return;}
    list.innerHTML=entries.map(({key,val})=>{
      const time=val.importedAt?new Date(val.importedAt).toLocaleString('zh-CN'):'-';
      return `<div class="di-history-item">
        <div class="hi-info">
          <div class="hi-name"><i class="fa-solid fa-file-excel text-green"></i> ${this._esc(val.fileName||'未知文件')}</div>
          <div class="hi-meta">${this._esc(val.dataTypeLabel||val.dataType)} · ${this._esc(val.storeName)} · ${val.rowCount}行 · ${time}</div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-sm btn-secondary" onclick="DataImport.viewHistory('${this._esc(key)}')"><i class="fa-solid fa-eye"></i> 重新查看</button>
          <button class="btn btn-sm btn-danger" onclick="DataImport.deleteHistory('${this._esc(key)}')"><i class="fa-solid fa-trash"></i> 删除</button>
        </div>
      </div>`;
    }).join('');
  },
  viewHistory(key){
    let val;
    try{val=JSON.parse(localStorage.getItem(key));}catch(e){}
    if(!val){toast('记录不存在');return;}
    openModal('导入数据详情 - '+val.fileName,'<i class="fa-solid fa-eye"></i>','#3b82f6',`
      <div class="result-box mb-3">
        <p class="text-sm"><strong>文件：</strong>${this._esc(val.fileName)}</p>
        <p class="text-sm mt-1"><strong>类型：</strong>${this._esc(val.dataTypeLabel||val.dataType)}</p>
        <p class="text-sm mt-1"><strong>店铺：</strong>${this._esc(val.storeName)}</p>
        <p class="text-sm mt-1"><strong>行数：</strong>${val.rowCount}</p>
        <p class="text-sm mt-1"><strong>导入时间：</strong>${val.importedAt?new Date(val.importedAt).toLocaleString('zh-CN'):'-'}</p>
      </div>
      <h4 class="mb-2">数据预览（前20行）</h4>
      <table class="di-preview-table"><thead><tr>${(val.headers||[]).map(h=>`<th>${this._esc(h)}</th>`).join('')}</tr></thead><tbody>
        ${(val.rows||[]).slice(0,20).map(r=>`<tr>${(val.headers||[]).map(h=>`<td>${this._esc(r[val.mapping[h]]||r[h])}</td>`).join('')}</tr>`).join('')}
      </tbody></table>
    `);
  },
  deleteHistory(key){
    if(!confirm('确认删除此导入记录？'))return;
    try{localStorage.removeItem(key);}catch(e){}
    DataAdapter.scanImportedData();
    this.renderHistory();
    AuthUI.renderTopbar();
    AuthUI.renderStatusPill();
    renderOverview();
    toast('已删除');
  }
};

// ============ 店铺登录 / 数据源状态 UI ============
const AuthUI={
  async init(){
    await DataAdapter.init();
    this.bindMessage();
    this.renderTopbar();
    this.renderStatusPill();
    if(DataAdapter.mode==='real'){
      DataAdapter.refreshRealData().then(()=>{this.renderTopbar();this.renderStatusPill();}).catch(()=>{});
    }
  },
  // 监听授权回调窗口 postMessage
  bindMessage(){
    window.addEventListener('message',async(e)=>{
      if(!e.data||typeof e.data!=='object')return;
      if(e.data.type==='auth_success'&&e.data.shop){
        const shop=e.data.shop;
        const shops=DataAdapter.getShops();
        if(!shops.some(s=>String(s.userId)===String(shop.userId)))shops.push(shop);
        DataAdapter.saveShops(shops);
        DataAdapter.mode='real';
        DataAdapter.currentUserId=String(shop.userId);
        closeModal();
        toast('店铺授权成功：'+(shop.shopName||shop.nick||''));
        try{await DataAdapter.refreshRealData();}catch(err){}
        this.renderTopbar();
        this.renderStatusPill();
      }else if(e.data.type==='auth_failed'){
        toast('授权失败：'+(e.data.message||'未知错误'));
      }
    });
    // 点击其他区域关闭店铺下拉菜单
    document.addEventListener('click',e=>{
      const menu=document.getElementById('storeMenu');
      if(menu&&menu.classList.contains('show')&&!e.target.closest('.store-chip'))menu.classList.remove('show');
    });
  },
  // ---------- 顶栏：登录按钮 / 店铺芯片 + 演示模式徽标 ----------
  renderTopbar(){
    const el=document.getElementById('topbarAuth');
    if(!el)return;
    const shops=DataAdapter.getShops();
    const real=DataAdapter.mode==='real'&&shops.length;
    const hasImported=DataAdapter.hasAnyImportedData();
    const badge=real
      ?'<span class="demo-badge live" title="已连接阿里妈妈实时数据"><i class="fa-solid fa-signal"></i> 实时</span>'
      :hasImported
        ?'<span class="demo-badge live" title="已导入真实店铺数据"><i class="fa-solid fa-database"></i> 导入数据</span>'
        :'<span class="demo-badge" title="当前使用演示数据"><i class="fa-solid fa-flask"></i> 演示数据</span>';
    // 更新导入按钮状态
    const importBtn=document.querySelector('.import-btn');
    if(importBtn)importBtn.classList.toggle('has-data',hasImported);
    if(!real){
      el.innerHTML=badge+'<button class="auth-btn" onclick="AuthUI.openLogin()"><i class="fa-solid fa-store"></i> 店铺登录</button>';
      return;
    }
    const cur=shops.find(s=>String(s.userId)===String(DataAdapter.currentUserId))||shops[0];
    const name=cur.shopName||cur.nick||('店铺-'+cur.userId);
    el.innerHTML=badge+`
    <div class="store-chip" onclick="AuthUI.toggleMenu(event)">
      <div class="avatar">${name.slice(0,1)}</div>
      <span>${name}</span>
      <i class="fa-solid fa-chevron-down" style="font-size:10px;opacity:.8"></i>
      <div class="chip-dropdown" id="storeMenu">
        <div class="dd-title">已授权店铺（${shops.length}）</div>
        ${shops.map((sh,i)=>`<div class="dd-item ${String(sh.userId)===String(DataAdapter.currentUserId)?'active':''}" onclick="event.stopPropagation();AuthUI.switchStore(${i})"><i class="fa-solid fa-store"></i> ${sh.shopName||sh.nick||sh.userId}</div>`).join('')}
        <div class="dd-sep"></div>
        <div class="dd-item" onclick="event.stopPropagation();AuthUI.openLogin()"><i class="fa-solid fa-plus"></i> 添加店铺（切换店铺）</div>
        <div class="dd-item" onclick="event.stopPropagation();AuthUI.showStoreStatus()"><i class="fa-solid fa-chart-pie"></i> 店铺数据状态</div>
        <div class="dd-item danger" onclick="event.stopPropagation();AuthUI.logout()"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</div>
      </div>
    </div>`;
  },
  toggleMenu(e){
    if(e)e.stopPropagation();
    const m=document.getElementById('storeMenu');
    if(m)m.classList.toggle('show');
  },
  switchStore(i){
    const shops=DataAdapter.getShops();
    if(!shops[i])return;
    DataAdapter.currentUserId=String(shops[i].userId);
    const m=document.getElementById('storeMenu');if(m)m.classList.remove('show');
